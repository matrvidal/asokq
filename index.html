 {t:"code",cap:"Montando as duas versões numa tabela só",code:'library(dplyr); library(tidyr); library(ggplot2)\n\n# antes: matriz log2 bruta   |   depois: median-centered\nmed <- apply(mat_log2, 2, median, na.rm = TRUE)\nmat_norm <- sweep(mat_log2, 2, med, FUN = "-")\nmat_norm <- mat_norm + median(med, na.rm = TRUE)   # devolve à escala original\n\nlongo_antes  <- as.data.frame(mat_log2) |>\n  tibble::rownames_to_column("acc") |>\n  pivot_longer(-acc, names_to = "amostra", values_to = "int") |>\n  mutate(etapa = "1. Bruto (log2)")\n\nlongo_depois <- as.data.frame(mat_norm) |>\n  tibble::rownames_to_column("acc") |>\n  pivot_longer(-acc, names_to = "amostra", values_to = "int") |>\n  mutate(etapa = "2. Mediana centrada")\n\nlongo2 <- bind_rows(longo_antes, longo_depois)'},
 {t:"h",text:"Facet: dois painéis, um comando"},
 {t:"code",cap:"O gráfico",code:'longo2 <- longo2 |>\n  mutate(condicao = sub("_[0-9]+$", "", amostra))\n\np <- ggplot(longo2, aes(x = amostra, y = int, fill = condicao)) +\n  geom_boxplot(outlier.size = 0.5, linewidth = 0.3) +\n  facet_wrap(~ etapa, ncol = 1, scales = "free_y") +\n  labs(x = NULL, y = "log2(intensidade)", fill = "Grupo",\n       title = "Efeito da normalização por mediana",\n       subtitle = "Cerebelo — 12 amostras, abundância bruta do Progenesis") +\n  theme_bw(base_size = 11) +\n  theme(axis.text.x = element_text(angle = 45, hjust = 1),\n        panel.grid.major.x = element_blank())\n\nggsave("normalizacao_cerebelo.png", p, width = 9, height = 7, dpi = 300)'},
 {t:"p",html:"<code class=\"i\">facet_wrap(~ etapa)</code> é o que transforma uma coluna categórica em painéis. É a mesma linha que gera os seus painéis por tecido — troque <code class=\"i\">etapa</code> por <code class=\"i\">tecido</code> e sai cerebelo, hipocampo e medula lado a lado."},
 {t:"h",text:"Como ler o resultado"},
 {t:"table",head:["O que você vê","O que significa"],rows:[
  ["Caixas alinhadas depois, bagunçadas antes","Normalização funcionou — era diferença de escala"],
  ["Uma caixa continua baixa depois","Amostra com problema real de input, não de escala (o caso da ctrl_9)"],
  ["Caixas alinhadas mas com alturas muito diferentes","Diferença de <b>dispersão</b>, não de centro — considere VSN em vez de mediana"],
  ["Tudo alinhado antes e depois","A normalização não era necessária (ou não fez nada)"]
 ]},
 {t:"key",title:"Este gráfico contou a história do cerebelo",html:"<p>No bloco <i>normalized</i> do Progenesis, ctrl_1 e ctrl_9 apareciam igualmente baixas. No <b>raw</b>, só ctrl_9 continua baixa depois de centrar pela mediana — porque ela tem input real baixo. A ctrl_1 se realinha perfeitamente. Foi o gráfico, não a estatística, que separou os dois casos.</p>"},
 {t:"h",text:"O painel de CV"},
 {t:"code",cap:"Boxplot de CV com e sem a amostra suspeita",code:'cv_tab <- longo |>\n  group_by(acc, condicao) |>\n  summarise(cv = 100 * sd(int, na.rm = TRUE) / mean(int, na.rm = TRUE),\n            n = sum(!is.na(int)), .groups = "drop") |>\n  filter(n >= 2)\n\nggplot(cv_tab, aes(x = condicao, y = cv, fill = condicao)) +\n  geom_boxplot(outlier.shape = NA) +\n  coord_cartesian(ylim = c(0, quantile(cv_tab$cv, 0.95, na.rm = TRUE))) +\n  labs(x = NULL, y = "CV intragrupo (%)") +\n  theme_bw(base_size = 11) +\n  theme(legend.position = "none")'},
 {t:"warn",title:"coord_cartesian vs ylim",html:"<p><code class=\"i\">coord_cartesian(ylim = ...)</code> dá <b>zoom</b> — os pontos fora da faixa continuam entrando no cálculo do boxplot. <code class=\"i\">ylim()</code> ou <code class=\"i\">scale_y_continuous(limits =)</code> <b>descarta</b> os pontos fora, e as caixas mudam de lugar. Para cortar cauda de CV, você quer <code class=\"i\">coord_cartesian</code> — é o que o seu script já usa, com corte no percentil 95.</p>"}
],
ex:[
 {type:"code", q:"Escreva a camada que divide o gráfico em painéis empilhados (uma coluna) pela variável <code>etapa</code>.",
  ans:["facet_wrap(~ etapa, ncol = 1)","facet_wrap(~etapa, ncol = 1)","facet_wrap(vars(etapa), ncol = 1)"],
  ph:"facet_wrap(...)",
  why:"O til indica 'em função de'. <code>ncol = 1</code> empilha; sem ele, o ggplot decide sozinho.",
  hint:"<code>facet_wrap(~ variavel, ncol = )</code>"},
 {type:"mc", q:"Depois da normalização por mediana, 11 caixas se alinham e uma continua visivelmente mais baixa. O que isso indica?",
  opts:["A normalização falhou e é preciso outro método","Essa amostra tem problema real de input/qualidade, não de escala","É normal, ignore","Faltou remover contaminantes"],
  correct:1, why:"Centrar pela mediana corrige escala por definição. Se uma amostra resiste, o problema é outro: menos proteínas detectadas, input baixo, corrida ruim. Confirme com contagem de IDs e correlação, e considere remover."}
]},

{id:"6.3", min:"14", title:"PCA na mão", goal:"Calcular e plotar o PCA sem pacote de proteômica — e colorir por lote para caçar efeito técnico.",
blocks:[
 {t:"p",html:"PCA responde: “se eu tivesse que resumir cada amostra em dois números, quais seriam?”. Em proteômica, ele é o detector de efeito de lote mais rápido que existe."},
 {t:"code",cap:"O cálculo — quatro linhas",code:'# prcomp espera AMOSTRAS nas linhas -> transpõe a matriz\nmat_c <- mat_norm[complete.cases(mat_norm), ]   # prcomp não aceita NA\npca <- prcomp(t(mat_c), scale. = FALSE)\n\nvar_exp <- round(100 * pca$sdev^2 / sum(pca$sdev^2), 1)\nvar_exp[1:3]\n# [1] 39.2 18.4  9.7'},
 {t:"warn",title:"prcomp e NA",html:"<p><code class=\"i\">prcomp()</code> não aceita NA. Duas saídas: <code class=\"i\">complete.cases()</code>, que usa só as proteínas completas (honesto, mas pode sobrar pouca coisa), ou imputar antes. <b>Diga qual você usou na legenda da figura</b> — muda a interpretação.</p>"},
 {t:"code",cap:"O gráfico",code:'library(ggplot2)\n\npc <- as.data.frame(pca$x[, 1:2])\npc$amostra <- rownames(pc)\npc <- merge(pc, design, by.x = "amostra", by.y = "label")\n\nggplot(pc, aes(x = PC1, y = PC2, color = condicao, shape = lote)) +\n  geom_point(size = 3) +\n  ggrepel::geom_text_repel(aes(label = amostra), size = 3, show.legend = FALSE) +\n  labs(x = paste0("PC1 (", var_exp[1], "%)"),\n       y = paste0("PC2 (", var_exp[2], "%)"),\n       color = "Grupo", shape = "Lote") +\n  theme_bw(base_size = 11)'},
 {t:"h",text:"Como ler"},
 {t:"table",head:["Padrão","Leitura"],rows:[
  ["<b>PC1 muito alto</b> (&gt;70%)","Uma fonte técnica domina tudo — geralmente escala. Normalize e refaça."],
  ["Separação segue a <b>condição</b>","Sinal biológico. É o que você quer ver."],
  ["Separação segue o <b>lote</b> ou a <b>ordem de injeção</b>","Efeito técnico. Precisa entrar no modelo como covariável."],
  ["Uma amostra sozinha longe","Outlier. Confirme com contagem de IDs e correlação antes de remover."]
 ]},
 {t:"key",title:"Os seus números",html:"<p>Cerebelo: PC1 caiu de <b>84,5%</b> (raw) para <b>52,1%</b> (mediana) e <b>39,2%</b> (VSN). Um PC1 de 84,5% significa que a variação técnica de escala engolia toda a biologia — e explica por que nada dava significativo antes de normalizar. Depois do VSN, PC1 em 39,2% é um valor saudável.</p><p>No pâncreas, o alerta é outro: as amostras fortes são <b>consecutivas</b> (5–9, 22–24), o que aponta efeito de lote ou de ordem de aquisição, não biologia. Nesse caso, colorir o PCA por ordem de injeção é o teste decisivo.</p>"},
 {t:"h",text:"O outro lado: correlação e dendrograma"},
 {t:"code",cap:"Heatmap de correlação",code:'cm <- cor(mat_c, method = "spearman", use = "pairwise.complete.obs")\nround(cm[1:4, 1:4], 2)\n\n# média de correlação de cada amostra com as demais\ndiag(cm) <- NA\nsort(round(colMeans(cm, na.rm = TRUE), 2))\n# ctrl_9  ctrl_1  D3_2 ...\n#   0.80    0.93  0.94\n\n# Agrupamento hierárquico\nplot(hclust(as.dist(1 - cm)), main = "Cerebelo — 1 - Spearman")'},
 {t:"p",html:"A <code class=\"i\">ctrl_9</code> com correlação média de 0,80 contra ≥0,91 das outras, e sozinha no dendrograma, é o terceiro sinal independente apontando a mesma amostra. Três evidências convergentes é o que justifica remover uma amostra — nunca uma só."}
],
ex:[
 {type:"code", q:"Escreva a linha que roda o PCA em <code>mat_c</code> (proteínas nas linhas, amostras nas colunas), sem escalonar.",
  ans:["prcomp(t(mat_c), scale. = FALSE)","pca <- prcomp(t(mat_c), scale. = FALSE)","prcomp(t(mat_c))"],
  ph:"prcomp(t(mat_c), scale. = ...)",
  why:"O <code>t()</code> é obrigatório: <code>prcomp</code> espera observações (amostras) nas linhas. Sem ele você faz PCA das proteínas.",
  hint:"Transponha com <code>t()</code>. O argumento tem ponto no nome: <code>scale.</code>"},
 {type:"mc", q:"PC1 explica 84,5% da variância e separa as amostras pela ordem de injeção. Conclusão?",
  opts:["Excelente, há forte sinal biológico","Há efeito técnico dominante — normalize e/ou inclua a ordem como covariável antes de testar","O PCA está errado","Deve-se aumentar o número de componentes"],
  correct:1, why:"PC1 dominante que segue uma variável técnica é o retrato de artefato. No cerebelo, normalizar derrubou PC1 de 84,5% para 39,2% — a biologia só apareceu depois disso."}
]},

{id:"6.4", min:"15", title:"Volcano na mão", goal:"Construir o volcano camada por camada, com cortes explícitos e rótulos — sem depender do plot_volcano.",
blocks:[
 {t:"p",html:"Volcano é um scatter: efeito no eixo x, significância no y. Fazer o seu dá controle total sobre cortes, cores e rótulos — e obriga você a saber exatamente o que está sendo mostrado."},
 {t:"code",cap:"Preparando a tabela",code:'library(dplyr); library(ggplot2)\n\nLFC <- log2(1.5)   # 0.585\nALPHA <- 0.05\n\nvol <- res |>\n  mutate(\n    logp  = -log10(p_adj),\n    grupo = case_when(\n      p_adj < ALPHA & diff >  LFC ~ "Aumentada",\n      p_adj < ALPHA & diff < -LFC ~ "Diminuída",\n      TRUE                        ~ "n.s."\n    ),\n    grupo = factor(grupo, levels = c("Diminuída", "n.s.", "Aumentada"))\n  )\n\ntable(vol$grupo)'},
 {t:"code",cap:"O gráfico completo",code:'top <- vol |> filter(grupo != "n.s.") |> arrange(p_adj) |> head(12)\n\nggplot(vol, aes(x = diff, y = logp, color = grupo)) +\n  geom_point(alpha = 0.75, size = 1.8) +\n  geom_vline(xintercept = c(-LFC, LFC), linetype = "dashed", linewidth = 0.35) +\n  geom_hline(yintercept = -log10(ALPHA), linetype = "dashed", linewidth = 0.35) +\n  ggrepel::geom_text_repel(data = top, aes(label = gene),\n                           size = 3, max.overlaps = 20, show.legend = FALSE) +\n  scale_color_manual(values = c("Diminuída" = "#2d6cb0",\n                                "n.s."      = "grey75",\n                                "Aumentada" = "#b93a5c")) +\n  labs(x = "log2 fold change (D14 / Ctrl)",\n       y = "-log10(q-valor, BH)",\n       color = NULL,\n       title = "Cerebelo — D14 vs Ctrl",\n       subtitle = paste0("q < ", ALPHA, " e |log2FC| > ", round(LFC, 3),\n                         " — ", sum(vol$grupo != "n.s."), " proteínas")) +\n  theme_bw(base_size = 11) +\n  theme(legend.position = "top", panel.grid.minor = element_blank())'},
 {t:"h",text:"As decisões escondidas num volcano"},
 {t:"list",items:[
  "<b>Eixo Y é p ou q?</b> Faz diferença enorme no número de pontos acima da linha. Escreva no eixo qual dos dois é.",
  "<b>A direção do fold change.</b> <code class=\"i\">diff</code> positivo significa maior em qual grupo? Depende de qual é a referência do factor (aula 2.3). Escreva no eixo: <i>D14 / Ctrl</i>.",
  "<b>O corte de FC.</b> <code class=\"i\">log2(1.5) = 0.585</code> é o seu padrão. É uma escolha, não uma lei — declare-a.",
  "<b>Quantos pontos foram cortados do gráfico.</b> Se você limitou os eixos, diga quantos ficaram de fora."
 ]},
 {t:"key",title:"Uma armadilha do plot_volcano do DEP2",html:"<p>Com <code class=\"i\">add_threshold_line = \"intersect\"</code>, o <code class=\"i\">plot_volcano()</code> <b>recalcula</b> a cor dos pontos pela regra (|diff| &gt; fcCutoff &amp; p &lt; pCutoff) usando o eixo que está sendo mostrado — ele <b>não</b> usa a coluna <code class=\"i\">_significant</code> do <code class=\"i\">add_rejections()</code>. Ou seja: se você plota com <code class=\"i\">adjusted = FALSE</code>, as cores refletem p bruto, e o gráfico mostra mais “significativas” do que a sua tabela. Fazendo o volcano à mão, esse descasamento não existe.</p>"},
 {t:"h",text:"Rotulando só o que importa"},
 {t:"code",cap:"Três estratégias de rótulo",code:'# 1) As N mais significativas\ntop <- vol |> arrange(p_adj) |> head(10)\n\n# 2) As de maior efeito entre as significativas\ntop <- vol |> filter(grupo != "n.s.") |> arrange(desc(abs(diff))) |> head(10)\n\n# 3) Uma lista de interesse do pesquisador\nalvos <- c("Slc25a22", "Cox4i1", "Gfap", "Aif1")\ntop <- vol |> filter(gene %in% alvos)'},
 {t:"note",title:"ggrepel",html:"<p><code class=\"i\">install.packages(\"ggrepel\")</code>. <code class=\"i\">geom_text_repel()</code> afasta os rótulos para não se sobreporem. <code class=\"i\">max.overlaps</code> controla quantos ele desiste de desenhar — se sumirem rótulos, aumente esse número.</p>"}
],
ex:[
 {type:"code", q:"Escreva a camada que desenha as linhas verticais tracejadas nos cortes de fold change, em <code>-LFC</code> e <code>LFC</code>.",
  ans:["re:geom_vline\\(\\s*xintercept\\s*=\\s*c\\(\\s*-LFC\\s*,\\s*LFC\\s*\\)\\s*,\\s*linetype\\s*=\\s*\"dashed\".*\\)",
       "geom_vline(xintercept = c(-LFC, LFC), linetype = \"dashed\")"],
  ph:'geom_vline(xintercept = ..., linetype = "dashed")',
  why:"<code>geom_vline</code> aceita um vetor — as duas linhas saem numa camada só.",
  hint:"<code>geom_vline(xintercept = c(...), linetype = \"dashed\")</code>"},
 {type:"mc", q:"Seu volcano mostra 30 pontos coloridos, mas a tabela exportada lista 8 significativas. Qual a explicação mais provável?",
  opts:["Erro na exportação da tabela","O gráfico está usando p bruto (ou outro método de FDR) enquanto a tabela usa q ajustado por BH","O gráfico está desatualizado","A tabela filtrou contaminantes"],
  correct:1, why:"É exatamente o descasamento entre <code>plot_volcano(adjusted = FALSE)</code> e a coluna <code>_significant</code>, e também o que acontece ao trocar Strimmer por BH. Sempre confira qual eixo o gráfico está usando."}
]},

{id:"6.5", min:"11", title:"Escalas, temas e figura publicável", goal:"Sair do gráfico exploratório para a figura que vai no artigo.",
blocks:[
 {t:"p",html:"Explorar é uma coisa; publicar é outra. As diferenças são poucas e sempre as mesmas."},
 {t:"h",text:"Escalas: controlar eixos e cores"},
 {t:"code",cap:"scale_*",code:'p +\n  scale_y_continuous(breaks = seq(0, 20, 2), expand = expansion(mult = c(0, .05))) +\n  scale_x_continuous(limits = c(-4, 4)) +\n  scale_color_manual(values = c("Ctrl" = "#5a6b66", "D3" = "#0d7c6e",\n                                "D14" = "#b98a2a", "D28" = "#b93a5c")) +\n  scale_fill_brewer(palette = "Set2")'},
 {t:"warn",title:"limits descarta dados",html:"<p><code class=\"i\">scale_x_continuous(limits = )</code> <b>remove</b> os pontos fora da faixa (e avisa quantos). Para apenas dar zoom sem alterar os cálculos, use <code class=\"i\">coord_cartesian(xlim = )</code>. Em volcano isso importa: cortar com <code class=\"i\">limits</code> pode sumir com a proteína mais interessante.</p>"},
 {t:"h",text:"Tema: o visual"},
 {t:"code",cap:"Um tema seu, aplicado a tudo",code:'library(ggplot2)\n\ntema_prot <- theme_bw(base_size = 11) +\n  theme(\n    panel.grid.minor = element_blank(),\n    panel.border     = element_rect(linewidth = 0.4),\n    strip.background = element_rect(fill = "grey92", linewidth = 0.3),\n    legend.position  = "top",\n    plot.title       = element_text(face = "bold", size = 12),\n    plot.subtitle    = element_text(color = "grey35", size = 10),\n    axis.text.x      = element_text(angle = 45, hjust = 1)\n  )\n\n# Aplica em um gráfico:\np + tema_prot\n\n# Ou de uma vez, para toda a sessão:\ntheme_set(tema_prot)'},
 {t:"key",title:"Por que isso vale a pena",html:"<p>Definindo <code class=\"i\">tema_prot</code> uma vez no topo do script, os oito painéis do seu QC saem visualmente idênticos, e mudar a fonte de todos é editar uma linha. É o mesmo princípio do bloco CONFIGURAÇÃO que você já usa no <code class=\"i\">qc_proteomica.R</code>: decisão num lugar só.</p>"},
 {t:"h",text:"Juntando painéis"},
 {t:"code",cap:"patchwork",code:'# install.packages("patchwork")\nlibrary(patchwork)\n\n(p1 | p2) / p3 +\n  plot_annotation(tag_levels = "A",\n                  title = "Cerebelo — controle de qualidade")\n\nggsave("figura1.pdf", width = 11, height = 8)'},
 {t:"p",html:"<code class=\"i\">|</code> põe lado a lado, <code class=\"i\">/</code> empilha, e <code class=\"i\">tag_levels = \"A\"</code> rotula A, B, C automaticamente. É a forma mais rápida de montar figura de artigo sem sair do R."},
 {t:"h",text:"Checklist da figura publicável"},
 {t:"list",items:[
  "Eixos com <b>unidade</b>: “log2(intensidade)”, não “valor”.",
  "Se é q ou p, está escrito no eixo.",
  "A direção do fold change está no rótulo: “D14 / Ctrl”.",
  "n de cada grupo aparece (no subtítulo ou no eixo).",
  "Os cortes usados estão declarados no subtítulo.",
  "Fonte legível no tamanho final — teste imprimindo em 100%.",
  "Salvo com <code class=\"i\">width</code>, <code class=\"i\">height</code> e <code class=\"i\">dpi</code> explícitos.",
  "Cores distinguíveis também em escala de cinza, ou com forma/preenchimento redundante."
 ]}
],
ex:[
 {type:"mc", q:"Você quer dar zoom no eixo y sem alterar o cálculo do boxplot. Qual usar?",
  opts:["<code>ylim(0, 100)</code>","<code>scale_y_continuous(limits = c(0, 100))</code>","<code>coord_cartesian(ylim = c(0, 100))</code>","<code>theme(axis.text.y = ...)</code>"],
  correct:2, why:"As duas primeiras descartam os pontos fora da faixa antes de calcular a estatística do boxplot, e as caixas mudam. <code>coord_cartesian</code> só recorta a visualização."},
 {type:"do", q:"Faça na sua máquina:", q2:"Criei um objeto <code>tema_prot</code> com o meu tema padrão e apliquei em pelo menos dois gráficos diferentes do meu QC."}
]}
]});

TRILHA.push({n:"7", title:"A estatística por trás do DEP2", lessons:[

{id:"7.1", min:"10", title:"log2: por que sempre", goal:"Saber justificar a transformação log — e o que ela faz com a interpretação do fold change.",
blocks:[
 {t:"p",html:"Intensidade de MS é <b>multiplicativa</b>: o ruído cresce junto com o sinal. Proteína abundante varia em milhares de unidades; proteína rara varia em dezenas. Isso viola as premissas de todo teste paramétrico."},
 {t:"code",cap:"O problema",code:'ctrl  <- c(100, 1000, 100000)\ntrat  <- c(200, 2000, 200000)   # todas dobraram\n\ntrat - ctrl\n# [1]    100   1000 100000    <- diferenças incomparáveis\n\nlog2(trat) - log2(ctrl)\n# [1] 1 1 1                   <- a MESMA diferença: dobrou'},
 {t:"p",html:"Depois do log2, <b>diferença vira razão</b>. Uma diferença de 1 significa o dobro, seja a proteína abundante ou rara. É por isso que a coluna <code class=\"i\">_diff</code> do DEP2 já é o log2 fold change: ela é literalmente uma subtração de médias em log."},
 {t:"h",text:"A tabela de conversão"},
 {t:"table",head:["log2FC","Fold change","Interpretação"],rows:[
  ["<code>0</code>","1,0×","Sem mudança"],
  ["<code>0.585</code>","1,5×","O seu corte padrão"],
  ["<code>1</code>","2,0×","Dobrou"],
  ["<code>2</code>","4,0×","Quadruplicou"],
  ["<code>-1</code>","0,5×","Caiu pela metade"],
  ["<code>-0.585</code>","0,67×","Caiu para dois terços"]
 ]},
 {t:"code",cap:"Convertendo nos dois sentidos",code:'log2(1.5)     # 0.585\n2^0.585       # 1.5\n\n# Numa tabela de resultado:\nres$fold_change <- 2^res$diff\nres$fold_change[res$diff < 0] <- -1 / 2^res$diff[res$diff < 0]\n# fold change "assinado", como o Progenesis reporta'},
 {t:"h",text:"O outro efeito: normalidade"},
 {t:"p",html:"Intensidade bruta tem distribuição fortemente assimétrica à direita (muitas proteínas de baixa abundância, poucas altíssimas). Em log2, ela fica aproximadamente normal — que é a premissa do t-teste e do limma."},
 {t:"code",cap:"Vendo a diferença",code:'par(mfrow = c(1, 2))\nhist(as.vector(mat_raw),        breaks = 50, main = "Bruto",  xlab = "intensidade")\nhist(as.vector(log2(mat_raw)),  breaks = 50, main = "log2",   xlab = "log2(intensidade)")\npar(mfrow = c(1, 1))'},
 {t:"warn",title:"Zeros e a ordem das operações",html:"<p><code class=\"i\">log2(0) = -Inf</code>. Sempre transforme zeros em NA <b>antes</b> do log. E a ordem correta do pipeline é: <b>zeros→NA → log2 → normalizar → filtrar → imputar → testar</b>. Normalizar antes do log é conceitualmente errado — a correção de escala é aditiva no espaço log, multiplicativa no linear.</p>"}
],
ex:[
 {type:"mc", q:"Uma proteína tem <code>diff = 1.32</code>. Quantas vezes ela aumentou?",
  opts:["1,32×","2,5×","2,64×","4×"],
  correct:1, why:"2^1.32 ≈ 2,5. A coluna <code>_diff</code> está em log2, então a conversão é sempre <code>2^diff</code>."},
 {type:"code", q:"Escreva a expressão que converte a coluna <code>diff</code> (log2FC) da tabela <code>res</code> em fold change linear.",
  ans:["2^res$diff","2 ^ res$diff","res$fold <- 2^res$diff"],
  ph:"2^res$diff", why:"Dois elevado ao log2FC. Para valores negativos, muitos pesquisadores reportam <code>-1/2^diff</code> como fold change assinado.",
  hint:"Base 2 elevada à coluna."}
]},

{id:"7.2", min:"16", title:"Normalização: mediana e VSN", goal:"Implementar as duas na mão, entender a diferença e saber quando escolher cada uma.",
blocks:[
 {t:"p",html:"Normalizar é corrigir diferenças <b>técnicas</b> de escala entre corridas — quantidade injetada, eficiência de ionização, tempo de coluna — sem apagar a biologia. A premissa é sempre a mesma: <i>a maioria das proteínas não muda entre as amostras</i>."},
 {t:"h",text:"Median centering, linha por linha"},
 {t:"code",cap:"A implementação completa",code:'# 1) mediana de cada amostra (coluna)\nmed <- apply(mat_log2, 2, median, na.rm = TRUE)\nround(med, 2)\n# ctrl_1  ctrl_5  ctrl_9   D3_2 ...\n#  11.05   10.90    8.94  10.99\n\n# 2) subtrai a mediana de cada coluna dela mesma\nmat_c <- sweep(mat_log2, 2, med, FUN = "-")\n\n# 3) devolve à escala original (opcional, só cosmético)\nmat_norm <- mat_c + median(med, na.rm = TRUE)\n\n# 4) confere\nround(apply(mat_norm, 2, median, na.rm = TRUE), 2)   # todas iguais agora'},
 {t:"p",html:"<code class=\"i\">sweep(X, MARGIN, STATS, FUN)</code> aplica um vetor ao longo de uma margem: margem 2 = uma correção por coluna. É a mesma operação que o seu <code class=\"i\">run_dep2_batch.R</code> faz com <code class=\"i\">NORMALIZACAO = mediana</code>."},
 {t:"h",text:"VSN: o que ele faz de diferente"},
 {t:"p",html:"O median centering corrige o <b>centro</b> de cada amostra. O VSN (<i>variance stabilizing normalization</i>) corrige centro <b>e dispersão</b>, e estabiliza a variância ao longo da faixa de intensidade — o que resolve o problema de proteínas de baixa abundância serem muito mais ruidosas."},
 {t:"code",cap:"VSN",code:'# BiocManager::install("vsn")\nlibrary(vsn)\n\n# Atenção: vsn trabalha na escala LINEAR e faz a transformação log ele mesmo\nfit <- vsn2(mat_raw)\nmat_vsn <- predict(fit, mat_raw)   # já sai em escala glog (~log2)\n\nmeanSdPlot(mat_vsn)   # o diagnóstico: a linha vermelha deve ficar horizontal'},
 {t:"warn",title:"Não aplique VSN em dado já em log",html:"<p>O VSN espera intensidade <b>linear</b> e faz a própria transformação. Passar uma matriz já em log2 gera resultado sem sentido. No DEP2, <code class=\"i\">normalize_vsn()</code> cuida disso — mas se você fizer na mão, atenção à ordem.</p>"},
 {t:"h",text:"Como escolher"},
 {t:"table",head:["","Mediana","VSN"],rows:[
  ["Corrige","Centro","Centro + dispersão"],
  ["Premissa","Maioria não muda","Maioria não muda + relação média-variância estável"],
  ["Transparência","Total — você vê a conta","Caixa-preta (ajuste por máxima verossimilhança)"],
  ["Quando preferir","Amostras parecidas em dispersão; quando precisa explicar o método","Dispersões diferentes entre amostras; muitas proteínas de baixa abundância"],
  ["Diagnóstico","Boxplots alinhados","<code>meanSdPlot()</code> com linha plana"]
 ]},
 {t:"key",title:"A evidência do seu projeto",html:"<p>No cerebelo, o efeito no PC1 foi: <b>84,5%</b> (raw) → <b>52,1%</b> (mediana) → <b>39,2%</b> (VSN). O VSN removeu mais estrutura técnica. Ainda assim, o <code class=\"i\">run_dep2_batch.R</code> ficou com a mediana — decisão sua, defensável: é transparente, mais fácil de justificar num artigo e o resultado final foi consistente. O importante é ter os dois números e ter escolhido conscientemente.</p>"},
 {t:"note",title:"Um detalhe que mudou tudo",html:"<p>Também no cerebelo: os IDs de proteína eram praticamente iguais em todas as amostras (~285 de 290). Isso prova que o problema era <b>escala</b>, não cobertura — por isso normalizar resolveu. Se as contagens variassem muito (como no pâncreas: 120 a 745), normalização sozinha não resolveria; seria preciso match-between-runs ou filtro por grupo.</p>"},
 {t:"h",text:"Outros métodos"},
 {t:"list",items:[
  "<b>Quantile</b>: força a mesma distribuição em todas as amostras. Poderoso, mas agressivo — pode apagar diferença biológica real se os grupos forem muito distintos.",
  "<b>Total sum / TIC</b>: divide pela soma. Sensível a uma proteína dominante (hemoglobina, albumina) — arriscado nos seus dados de saliva e polpa.",
  "<b>Spike-in</b>: âncora externa. Foi o que corrompeu a ctrl_1 — depende de a razão spike/endógeno ser constante entre as amostras, e ela não era.",
  "<b>LOESS/cyclic loess</b>: corrige viés dependente da intensidade. Bom meio-termo entre mediana e VSN."
 ]}
],
ex:[
 {type:"code", q:"Escreva a linha que subtrai de cada coluna de <code>mat_log2</code> a sua própria mediana, guardada no vetor <code>med</code>.",
  ans:["sweep(mat_log2, 2, med, FUN = \"-\")","sweep(mat_log2, 2, med, \"-\")","mat_c <- sweep(mat_log2, 2, med, FUN = \"-\")"],
  ph:'sweep(mat_log2, 2, med, FUN = "-")',
  why:"Margem 2 = colunas = amostras. Com margem 1 você centraria por proteína, que é outra coisa (útil para heatmap, errado para normalizar).",
  hint:"<code>sweep(X, MARGIN, STATS, FUN)</code>, com MARGIN = 2."},
 {type:"mc", q:"Você normalizou por mediana e as distribuições ficaram alinhadas no centro, mas com larguras bem diferentes. O que considerar?",
  opts:["Nada, está pronto","VSN ou cyclic loess, que corrigem também a dispersão","Remover as amostras diferentes","Normalizar de novo pela mediana"],
  correct:1, why:"Median centering só desloca o centro. Diferença de dispersão persiste e infla a variância dentro dos grupos — exatamente o que atrapalha o limma. VSN estabiliza a variância; confira com <code>meanSdPlot()</code>."},

  ans:["as.matrix(prog[, 5:16])","mat <- as.matrix(prog[, 5:16])","as.matrix(prog[,5:16])"],
  ph:"as.matrix(...)", why:"Depois é só <code>rownames(mat) &lt;- prog$Accession</code> para não perder a identidade das proteínas.",
  hint:"Colchete com vírgula, e o intervalo <code>5:16</code> na posição da coluna."}
]},

{id:"2.2", min:"11", title:"Listas e o operador $", goal:"Entender a estrutura onde vivem os resultados de teste estatístico — e como pescar o que você quer de dentro deles.",
blocks:[
 {t:"p",html:"<b>Lista</b> é o único container que aceita qualquer coisa dentro: números, textos, tabelas inteiras, outras listas. Quase todo resultado de função estatística em R é uma lista."},
 {t:"code",cap:"Lista à mão",code:'config <- list(\n  input    = "input_dep2_cerebelo_raw.txt",\n  alpha    = 0.05,\n  lfc      = log2(1.5),\n  fdr_type = "BH",\n  amostras = c("ctrl_1", "ctrl_5", "ctrl_9")\n)\n\nconfig$alpha        # 0.05\nconfig[["alpha"]]   # o mesmo\nnames(config)       # o que tem dentro\nstr(config)         # a estrutura toda'},
 {t:"warn",title:"Colchete simples vs duplo",html:"<p><code class=\"i\">config[\"alpha\"]</code> devolve uma <b>lista de um elemento</b>. <code class=\"i\">config[[\"alpha\"]]</code> devolve <b>o valor</b>. Metáfora clássica: o vagão do trem versus a carga dentro do vagão.</p>"},
 {t:"h",text:"Por que isso é a chave dos resultados"},
 {t:"code",cap:"Pescando de dentro de um resultado",code:'x <- c(11.05, 10.90, 11.20)\ny <- c( 9.80,  9.75,  9.60)\n\nres <- t.test(x, y)\n\nclass(res)     # "htest"\nnames(res)     # "statistic" "parameter" "p.value" "conf.int" ...\n\nres$p.value    # só o p-valor\nres$conf.int   # o intervalo de confiança\nres$estimate   # as duas médias'},
 {t:"p",html:"Esse é o padrão universal: rode a função, olhe <code class=\"i\">names()</code> ou <code class=\"i\">str()</code> do resultado, e pesque com <code class=\"i\">$</code> só o pedaço que você precisa. Funciona para <code class=\"i\">t.test</code>, <code class=\"i\">prcomp</code>, <code class=\"i\">lm</code>, e para os objetos do limma."},
 {t:"code",cap:"PCA: o mesmo raciocínio",code:'pca <- prcomp(t(mat_log2), scale. = FALSE)\n\nnames(pca)          # "sdev" "rotation" "center" "scale" "x"\npca$x[, 1:2]        # coordenadas das amostras em PC1 e PC2\n\n# Variância explicada — a conta por trás daquele "PC1 84,5%"\nvar_exp <- pca$sdev^2 / sum(pca$sdev^2) * 100\nround(var_exp[1:3], 1)\n# [1] 84.5  7.2  3.1'},
 {t:"key",title:"No seu caso",html:"<p>É essa conta que gerou o número mais importante do QC do cerebelo: PC1 caiu de <b>84,5%</b> (raw) para <b>52,1%</b> (median-center) e <b>39,2%</b> (VSN). PC1 dominante = a maior fonte de variação é <b>escala técnica</b>, não biologia. Você calcula isso em três linhas, sem pacote nenhum.</p>"},
 {t:"h",text:"Data.frame é uma lista"},
 {t:"p",html:"Curiosidade que explica muita coisa: um data.frame <b>é</b> uma lista de vetores de mesmo comprimento. Por isso <code class=\"i\">df$coluna</code> funciona, e por isso <code class=\"i\">lapply(df, class)</code> devolve o tipo de cada coluna."},
 {t:"code",cap:"Consequência prática",code:'sapply(prog, class)               # tipo de cada coluna, de uma vez\nnames(prog)[sapply(prog, is.numeric)]   # quais colunas são numéricas'}
],
ex:[
 {type:"code", q:"Você guardou o resultado de <code>t.test(x, y)</code> em <code>res</code>. Escreva o comando que extrai apenas o p-valor.",
  ans:["res$p.value","res[[\"p.value\"]]"], ph:"res$...",
  why:"Todo resultado estatístico em R é uma lista. <code>names(res)</code> mostra o que há para pescar.",
  hint:"Use <code>$</code> seguido do nome do elemento — rode <code>names(res)</code> se não lembrar."},
 {type:"code", q:"A partir de <code>pca &lt;- prcomp(t(mat))</code>, escreva a expressão que calcula a porcentagem de variância explicada por cada componente.",
  ans:["pca$sdev^2 / sum(pca$sdev^2) * 100","100 * pca$sdev^2 / sum(pca$sdev^2)","pca$sdev^2/sum(pca$sdev^2)*100"],
  ph:"pca$sdev^2 / ...", why:"Variância = desvio padrão ao quadrado; divide pelo total e multiplica por 100.",
  hint:"<code>sdev</code> é desvio padrão. Eleve ao quadrado e normalize pela soma."}
]},

{id:"2.3", min:"13", title:"Factor: a armadilha dos grupos", goal:"Controlar níveis e ordem — é o factor que define qual grupo é a referência no seu modelo estatístico.",
blocks:[
 {t:"p",html:"<b>Factor</b> é texto com um conjunto fixo de valores possíveis (os <i>níveis</i>). Toda variável de grupo — condição, tecido, lote — deve ser factor. E a <b>ordem dos níveis</b> tem consequência estatística direta."},
 {t:"code",cap:"Criando um factor",code:'cond <- c("ctrl", "3dias", "14dias", "28dias", "ctrl", "3dias")\nf <- factor(cond)\n\nlevels(f)\n# [1] "14dias" "28dias" "3dias"  "ctrl"\n\ntable(f)   # quantas amostras por grupo'},
 {t:"warn",title:"Ordem alfabética é o default — e quase nunca é o que você quer",html:"<p>Repare: <code class=\"i\">14dias</code> virou o primeiro nível só por ordem alfabética. <b>O primeiro nível é o grupo de referência</b> em <code class=\"i\">model.matrix()</code> e no limma. Sem corrigir, você compara tudo contra 14 dias em vez do controle — e o sinal do fold change inverte.</p>"},
 {t:"code",cap:"Definindo a ordem certa",code:'f <- factor(cond, levels = c("ctrl", "3dias", "14dias", "28dias"))\nlevels(f)\n# [1] "ctrl"   "3dias"  "14dias" "28dias"\n\n# Ou promover um nível a referência mantendo o resto:\nf <- relevel(factor(cond), ref = "ctrl")'},
 {t:"key",title:"No seu caso",html:"<p>No pâncreas da Talita são 4 grupos (C, I, E, F) e o controle provável é <b>C</b>. No cerebelo, a referência é <code class=\"i\">ctrl</code>. Definir <code class=\"i\">levels</code> explicitamente na criação do factor é o que garante que “Ctrl_vs_D14” significa D14 menos Ctrl, e não o contrário.</p>"},
 {t:"h",text:"Renomear níveis"},
 {t:"code",cap:"Nomes que começam com dígito",code:'# 3dias vira X3dias quando vira nome de coluna. Renomeie os níveis:\nlevels(f) <- c("Ctrl", "D3", "D14", "D28")\n\n# Ou, com dplyr:\ncond2 <- dplyr::recode(cond,\n  "ctrl" = "Ctrl", "3dias" = "D3", "14dias" = "D14", "28dias" = "D28")\nf <- factor(cond2, levels = c("Ctrl", "D3", "D14", "D28"))'},
 {t:"p",html:"É exatamente o <code class=\"i\">recode</code> que você já usa para transformar <code class=\"i\">X3dias</code> em <code class=\"i\">D3</code> — agora você sabe <b>por que</b> ele é necessário: nome de objeto/coluna não pode começar com dígito, e o R prefixa um <code class=\"i\">X</code> sozinho."},
 {t:"h",text:"A pegadinha do factor para número"},
 {t:"code",cap:"Nunca faça as.numeric direto num factor",code:'f <- factor(c("10", "20", "30"))\n\nas.numeric(f)                  # 1 2 3   <- os CÓDIGOS dos níveis!\nas.numeric(as.character(f))    # 10 20 30  <- certo'},
 {t:"warn",title:"Isso já quebrou muita análise",html:"<p>Se a ordem de injeção ou o lote foi lido como factor e você faz <code class=\"i\">as.numeric()</code> direto, os valores viram 1, 2, 3… — números plausíveis, resultado errado, nenhum erro na tela. Sempre <code class=\"i\">as.numeric(as.character(x))</code>.</p>"},
 {t:"note",title:"stringsAsFactors",html:"<p>Desde o R 4.0, <code class=\"i\">read.csv()</code> e <code class=\"i\">data.frame()</code> <b>não</b> convertem texto em factor automaticamente. Em scripts antigos você ainda encontra <code class=\"i\">stringsAsFactors = FALSE</code> — hoje é desnecessário, mas inofensivo.</p>"}
],
ex:[
 {type:"code", q:"Crie o factor <code>grupo</code> a partir do vetor <code>cond</code>, com os níveis nesta ordem: ctrl, 3dias, 14dias, 28dias.",
  ans:["re:factor\\(\\s*cond\\s*,\\s*levels\\s*=\\s*c\\(\\s*\"ctrl\"\\s*,\\s*\"3dias\"\\s*,\\s*\"14dias\"\\s*,\\s*\"28dias\"\\s*\\)\\s*\\)",
       "re:grupo\\s*<-\\s*factor\\(\\s*cond\\s*,\\s*levels\\s*=\\s*c\\(\\s*\"ctrl\"\\s*,\\s*\"3dias\"\\s*,\\s*\"14dias\"\\s*,\\s*\"28dias\"\\s*\\)\\s*\\)"],
  ph:'grupo <- factor(cond, levels = ...)',
  why:"Com ctrl como primeiro nível, ele é a referência do modelo e todos os contrastes ficam na direção certa.",
  hint:"<code>factor(x, levels = c(...))</code>, com os nomes entre aspas e na ordem desejada."},
 {type:"mc", q:"<code>lote</code> é um factor com valores \"1\", \"2\", \"3\". Você roda <code>as.numeric(lote)</code> e usa como covariável. Qual o risco?",
  opts:["Nenhum, os valores coincidem","Os valores viram códigos internos dos níveis, que podem não corresponder aos rótulos","Vai dar erro","Perde os NA"],
  correct:1, why:"Aqui até coincidiria por acaso. Mas com níveis \"10\",\"20\",\"30\" você receberia 1,2,3 — números plausíveis e errados, sem aviso nenhum. Use sempre <code>as.numeric(as.character(x))</code>."}
]},

{id:"2.4", min:"10", title:"Olhar antes de analisar", goal:"Criar o hábito das cinco linhas que você roda em toda tabela nova, antes de qualquer coisa.",
blocks:[
 {t:"p",html:"Antes de filtrar, normalizar ou testar: <b>olhe</b>. Cinco comandos, trinta segundos, e você evita a maioria dos desastres silenciosos."},
 {t:"code",cap:"O ritual de entrada",code:'dim(prog)          # 1) quantas linhas e colunas? bate com o esperado?\nstr(prog)          # 2) que tipo é cada coluna? alguma numérica virou texto?\nhead(prog, 3)      # 3) os dados começam onde eu acho que começam?\nnames(prog)        # 4) como são exatamente os nomes das colunas?\nsummary(prog[, 5:16])   # 5) faixa de valores, medianas e NAs por amostra'},
 {t:"h",text:"O que cada um pega"},
 {t:"table",head:["Comando","Pega este problema"],rows:[
  ["<code>dim()</code>","Leu 3 colunas em vez de 28 — separador errado. Ou 1 linha só — o cabeçalho virou dado."],
  ["<code>str()</code>","Coluna de abundância como <code>chr</code> — decimal com vírgula ou texto no meio dos números."],
  ["<code>head()</code>","Linhas de metadados do Progenesis ocupando o topo; cabeçalho real na 3ª linha."],
  ["<code>names()</code>","Nomes com espaço, acento ou pontos — <code>Normalized.abundance</code> vs <code>Normalized abundance</code>."],
  ["<code>summary()</code>","Amostra com mediana muito fora, muitos NAs, valor negativo ou zero onde não devia."]
 ]},
 {t:"key",title:"Aplicado ao seu arquivo",html:"<p>No <code class=\"i\">TODAS_CEREBELO_bruto.csv</code>, o cabeçalho verdadeiro está na <b>3ª linha</b>, as colunas 5–16 são <i>Normalized abundance</i> e as 17–28 são <i>Raw abundance</i>. Se você ler sem <code class=\"i\">skip</code>, o <code class=\"i\">str()</code> mostra tudo como <code class=\"i\">chr</code> e o <code class=\"i\">head()</code> mostra o cabeçalho real como se fosse a primeira observação. Os dois comandos denunciam o problema em dois segundos.</p>"},
 {t:"h",text:"Um sexto comando, específico de proteômica"},
 {t:"code",cap:"Perfil da matriz",code:'mat <- as.matrix(prog[, 5:16])\n\n# nº de proteínas identificadas por amostra\ncolSums(!is.na(mat) & mat > 0)\n\n# mediana log2 por amostra — a assinatura de amostra fraca\nround(apply(log2(mat), 2, median, na.rm = TRUE), 2)\n#  ctrl_1  3dias_2  14dias_3  ...  ctrl_9\n#   11.05    10.98     11.02   ...    8.94   <- olha ela aí'},
 {t:"p",html:"Esses dois números — contagem por amostra e mediana log2 por amostra — são o QC mínimo. Se uma amostra destoa nos dois, ela é problema real; se destoa só no segundo, pode ser escala (normalização resolve)."},
 {t:"note",title:"Correlação sozinha não serve",html:"<p>Um lembrete do seu próprio QC: correlação entre amostras dá r ≈ 0,7 mesmo em amostras gravemente problemáticas, porque é dominada pelas proteínas abundantes. Use contagem, distribuição, PCA e CV — não só correlação.</p>"}
],
ex:[
 {type:"do", q:"Faça agora, num arquivo seu:", q2:"Abri um export do Progenesis no R e rodei <code>dim()</code>, <code>str()</code>, <code>head()</code>, <code>names()</code> e <code>summary()</code> antes de qualquer outra coisa."},
 {type:"code", q:"Escreva o comando que devolve a mediana de cada coluna da matriz <code>mat_log2</code>, ignorando NA. (Dica: <code>apply</code> com margem 2 = colunas.)",
  ans:["apply(mat_log2, 2, median, na.rm = TRUE)","apply(mat_log2,2,median,na.rm=T)","colMedians(mat_log2, na.rm = TRUE)"],
  ph:"apply(mat_log2, 2, ...)",
  why:"Margem 1 = linhas (por proteína), margem 2 = colunas (por amostra). Este vetor é o insumo do median-centering.",
  hint:"<code>apply(X, MARGIN, FUN, ...)</code> — argumentos extras da função vão no final."}
]},

{id:"2.5", min:"15", title:"SummarizedExperiment: o objeto do DEP2", goal:"Abrir a caixa-preta. Saber exatamente onde ficam a matriz, os grupos e os resultados dentro do objeto se.",
blocks:[
 {t:"p",html:"Quando você roda <code class=\"i\">make_se_parse()</code>, o resultado não é uma tabela: é um <b>SummarizedExperiment</b>. Ele guarda três coisas alinhadas num objeto só, e essa é a razão de ele existir — filtrar linhas nunca desalinha a anotação."},
 {t:"table",head:["Parte","Acessa com","É"],rows:[
  ["<b>assay</b>","<code>assay(se)</code>","A matriz numérica: proteínas (linhas) × amostras (colunas)"],
  ["<b>rowData</b>","<code>rowData(se)</code>","Anotação das <b>proteínas</b>: gene, accession, e depois do teste, p-valores"],
  ["<b>colData</b>","<code>colData(se)</code>","Anotação das <b>amostras</b>: condition, replicate, label"]
 ]},
 {t:"code",cap:"Explorando o seu objeto se",code:'library(SummarizedExperiment)\n\ndim(se)              # proteínas x amostras\nassay(se)[1:5, 1:4]  # canto da matriz\n\ncolData(se)          # o desenho experimental\n#          label condition replicate\n# ctrl_1  ctrl_1      ctrl         1\n# 3dias_2 3dias_2     3dias        2\n\nnames(rowData(se))   # o que já foi calculado sobre cada proteína\nrowData(se)$name[1:5]'},
 {t:"h",text:"A regra de ouro: tudo fica alinhado"},
 {t:"p",html:"Se você filtrar <code class=\"i\">se[rowData(se)$n_na &lt; 3, ]</code>, o assay e o rowData são cortados juntos. Foi para evitar o erro clássico — filtrar a matriz e esquecer de filtrar a tabela de genes, desalinhando tudo — que essa classe foi criada."},
 {t:"code",cap:"Subsetting",code:'se[1:100, ]                        # 100 primeiras proteínas\nse[, colData(se)$condition != "ctrl"]   # tira o grupo ctrl\n\n# Remover uma amostra específica — o caso da ctrl_9:\nse2 <- se[, colnames(se) != "ctrl_all_9"]\ndim(se2)'},
 {t:"key",title:"No seu caso",html:"<p>Essa é a linha central do <code class=\"i\">run_dep2_batch.R</code>: remover <code class=\"i\">ctrl_all_9</code> do cerebelo <b>depois</b> de gerar o gráfico de CV, renormalizar nas 11 restantes e rodar a DE. Foi isso que levou os significativos de 3 para 30 (e depois para 8, com BH). Agora você sabe o que a linha faz por dentro.</p>"},
 {t:"h",text:"Onde os resultados aparecem"},
 {t:"p",html:"Depois de <code class=\"i\">test_diff()</code>, cada contraste acrescenta colunas ao <b>rowData</b>, com nome padronizado:"},
 {t:"table",head:["Coluna","Conteúdo"],rows:[
  ["<code>Ctrl_vs_D14_p.val</code>","p-valor bruto do contraste"],
  ["<code>Ctrl_vs_D14_p.adj</code>","p ajustado (q-valor) — depende do <code>fdr.type</code>"],
  ["<code>Ctrl_vs_D14_diff</code>","diferença em log2 = o fold change"],
  ["<code>Ctrl_vs_D14_CI.L</code> / <code>_CI.R</code>","limites do intervalo de confiança"],
  ["<code>Ctrl_vs_D14_significant</code>","TRUE/FALSE, preenchido pelo <code>add_rejections()</code>"]
 ]},
 {t:"code",cap:"Virando tabela de resultado",code:'rd <- as.data.frame(rowData(se))\n\n# Só as colunas de um contraste:\ncols <- grep("Ctrl_vs_D14", names(rd), value = TRUE)\nrd[, c("name", cols)]\n\n# As significativas daquele contraste:\nrd[which(rd$Ctrl_vs_D14_significant), c("name", "Ctrl_vs_D14_diff", "Ctrl_vs_D14_p.adj")]'},
 {t:"warn",title:"which() com lógicos que têm NA",html:"<p>Use <code class=\"i\">which()</code> ao filtrar por coluna lógica que pode conter <code class=\"i\">NA</code>. <code class=\"i\">rd[rd$sig, ]</code> devolve linhas de <code class=\"i\">NA</code> puro para cada NA da condição; <code class=\"i\">rd[which(rd$sig), ]</code> não.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que remove a amostra chamada <code>ctrl_all_9</code> do objeto <code>se</code>, guardando em <code>se2</code>.",
  ans:["se2 <- se[, colnames(se) != \"ctrl_all_9\"]","se2 <- se[ , colnames(se) != \"ctrl_all_9\"]"],
  ph:'se2 <- se[, ...]',
  why:"Amostra é coluna, então vai depois da vírgula. O assay e o colData são cortados juntos, sem risco de desalinhar.",
  hint:"Amostras são colunas: <code>se[, condição]</code>. Compare <code>colnames(se)</code> com <code>!=</code>."},
 {type:"mc", q:"Depois de <code>test_diff()</code>, onde ficam os p-valores?",
  opts:["Em <code>assay(se)</code>, junto das intensidades","Em <code>rowData(se)</code>, como novas colunas por contraste","Em <code>colData(se)</code>","Num data.frame separado devolvido pela função"],
  correct:1, why:"P-valor é uma propriedade da <b>proteína</b> (linha), então vai em rowData. Intensidade fica no assay; informação de amostra, em colData."},
 {type:"do", q:"Faça na sua máquina:", q2:"Carreguei um objeto <code>se</code> de um dos meus projetos e rodei <code>dim()</code>, <code>colData()</code> e <code>names(rowData(se))</code> para ver o que tem dentro."}
]}
]});

TRILHA.push({n:"3", title:"Ler o export do Progenesis sem sofrer", lessons:[

{id:"3.1", min:"9", title:"Caminhos no Windows", goal:"Nunca mais tomar erro de arquivo não encontrado por causa de barra invertida.",
blocks:[
 {t:"p",html:"O Windows usa <code class=\"i\">\\</code> nos caminhos. Em R, <code class=\"i\">\\</code> dentro de aspas é o caractere de escape — ele significa “o próximo caractere é especial”. Por isso colar um caminho do Explorer direto no R quase sempre dá erro."},
 {t:"code",cap:"O erro e as duas soluções",code:'# ERRADO — o R interpreta \\U, \\B, \\d como escapes:\n# read.delim("C:\\Users\\Bioinfo\\Documents\\dados.txt")\n# Error: \'\\U\' used without hex digits in character string\n\n# CERTO, opção 1 (recomendada): barra normal\nread.delim("C:/Users/Bioinfo/Documents/dados.txt")\n\n# CERTO, opção 2: dobrar as barras invertidas\n# (funciona, mas é feio e fácil de errar)'},
 {t:"p",html:"A opção 2 é escrever <code class=\"i\">C:\\\\Users\\\\Bioinfo</code>, com as barras dobradas. Funciona, mas prefira sempre a barra normal: o R aceita <code class=\"i\">/</code> no Windows sem problema, e o script fica portátil."},
 {t:"h",text:"Montando caminhos sem colar texto"},
 {t:"code",cap:"file.path e here",code:'# file.path monta com o separador certo do sistema\npasta <- "dados"\nfile.path(pasta, "input_dep2_cerebelo_raw.txt")\n# "dados/input_dep2_cerebelo_raw.txt"\n\n# Dentro de um RStudio Project, o pacote here ancora na raiz do projeto\n# install.packages("here")\nlibrary(here)\nhere("dados", "input_dep2_cerebelo_raw.txt")\n# funciona mesmo se você rodar de uma subpasta'},
 {t:"h",text:"Conferindo antes de ler"},
 {t:"code",cap:"Três comandos que evitam frustração",code:'getwd()                       # onde estou?\nlist.files()                  # o que tem aqui?\nlist.files(pattern = "[.]txt$")   # só os .txt\nfile.exists("input_dep2_cerebelo_raw.txt")   # TRUE ou FALSE'},
 {t:"key",title:"No seu caso",html:"<p>Você tem três arquivos com nomes paralelos: <code class=\"i\">input_dep2_cerebelo_raw.txt</code>, <code class=\"i\">input_dep2_hipocampo_raw.txt</code>, <code class=\"i\">input_dep2_medula_raw.txt</code>. Esse padrão é ouro — na aula 9.2 ele vira uma linha só que roda os três tecidos: <code class=\"i\">file.path(\"dados\", paste0(\"input_dep2_\", tecido, \"_raw.txt\"))</code>.</p>"},
 {t:"note",title:"O R não está no PATH",html:"<p>Na sua máquina o R fica em <code class=\"i\">C:/Program Files/R/R-4.6.0</code> e o <code class=\"i\">Rscript</code> não está no PATH. Para rodar em sessão limpa, chame com o caminho completo entre aspas:</p>"},
 {t:"code",cap:"Rodando via Rscript (no cmd/PowerShell, não no R)",code:'"C:/Program Files/R/R-4.6.0/bin/Rscript.exe" qc_proteomica.R'}
],
ex:[
 {type:"code", q:"Escreva o comando que testa se o arquivo <code>input_dep2_medula_raw.txt</code> existe na pasta atual.",
  ans:["file.exists(\"input_dep2_medula_raw.txt\")"], ph:"file.exists(...)",
  why:"Devolve TRUE/FALSE. Rodar isso antes de ler economiza muita confusão.",
  hint:"<code>file.exists()</code> com o nome do arquivo entre aspas."},
 {type:"mc", q:"Qual destes caminhos funciona em R no Windows?",
  opts:['<code>"C:\\Dados\\arquivo.txt"</code>','<code>"C:/Dados/arquivo.txt"</code>','<code>C:/Dados/arquivo.txt</code> (sem aspas)','<code>"C:\\\\Dados/arquivo.txt\\"</code>'],
  correct:1, why:"Barra normal entre aspas é a forma mais simples e portátil. A primeira quebra por causa do escape; a terceira, por falta de aspas."}
]},

{id:"3.2", min:"15", title:"Ler o arquivo: read.delim, read_csv e fread", goal:"Escolher a função certa e usar skip, sep e dec para ler o export na primeira tentativa.",
blocks:[
 {t:"p",html:"Três famílias, mesma tarefa. A diferença está nos defaults e na velocidade."},
 {t:"table",head:["Função","Pacote","Característica"],rows:[
  ["<code>read.csv</code> / <code>read.delim</code>","base R","Sempre disponível. Mexe nos nomes das colunas por padrão. Lenta em arquivo grande."],
  ["<code>readr::read_csv</code> / <code>read_tsv</code>","readr","Devolve tibble, preserva nomes, informa o tipo lido de cada coluna. Bom padrão."],
  ["<code>data.table::fread</code>","data.table","Muito rápida, adivinha separador sozinha. Ideal para os 470 mil registros do export do Skyline."]
 ]},
 {t:"code",cap:"Os argumentos que resolvem 95% dos casos",code:'read.delim(\n  file   = "input_dep2_cerebelo_raw.txt",\n  sep    = "\\t",        # separador: tab\n  header = TRUE,        # a primeira linha lida é cabeçalho\n  skip   = 0,           # quantas linhas pular ANTES do cabeçalho\n  dec    = ".",         # separador decimal\n  na.strings = c("", "NA", "NaN", "0"),   # o que virar NA\n  check.names = FALSE,  # NÃO mexer nos nomes das colunas\n  stringsAsFactors = FALSE\n)'},
 {t:"h",text:"O caso do cabeçalho na 3ª linha"},
 {t:"p",html:"Export do Progenesis costuma trazer linhas de metadados no topo. Se o cabeçalho verdadeiro está na 3ª linha, você pula as 2 anteriores:"},
 {t:"code",cap:"skip = 2",code:'prog <- read.csv("TODAS_CEREBELO_bruto.csv",\n                 skip = 2,             # pula as 2 primeiras linhas\n                 header = TRUE,        # a 3a linha vira cabeçalho\n                 check.names = FALSE)\n\ndim(prog)\nnames(prog)[1:6]\nhead(prog, 3)'},
 {t:"warn",title:"Como saber quantas pular",html:"<p>Não adivinhe. Olhe o arquivo cru antes:</p>"},
 {t:"code",cap:"Espiando as primeiras linhas sem carregar tudo",code:'readLines("TODAS_CEREBELO_bruto.csv", n = 5)\n# [1] "Progenesis QI for proteomics,,,,,,"\n# [2] ",,,,Normalized abundance,,,,,,,,Raw abundance,,,,"\n# [3] "Accession,Peptide count,Confidence score,Anova (p),ctrl_1,3dias_2,..."\n\n# A linha 3 é o cabeçalho -> skip = 2'},
 {t:"key",title:"Isso é o seu arquivo",html:"<p>No <code class=\"i\">TODAS_CEREBELO_bruto.csv</code> o cabeçalho verdadeiro está na 3ª linha, e a 2ª linha é aquela que marca onde começam os blocos <i>Normalized abundance</i> (colunas 5–16) e <i>Raw abundance</i> (colunas 17–28). Vale a pena ler essa 2ª linha separadamente — é ela que te diz a posição dos blocos. Faremos isso na aula 3.4.</p>"},
 {t:"h",text:"fread: quando o arquivo é grande"},
 {t:"code",cap:"data.table::fread",code:'library(data.table)\n\nsky <- fread("teste2.csv")   # adivinha separador e tipos sozinha\ndim(sky)                     # 470832 linhas\n\n# Forçando quando o palpite dá errado:\nsky <- fread("teste2.csv", sep = ";", dec = ",", na.strings = c("", "NA"))'},
 {t:"note",title:"Por que você já usa data.table",html:"<p>Seu <code class=\"i\">skyline_to_dep2.R</code> usa data.table justamente por causa das 470 mil linhas do export. <code class=\"i\">read.csv</code> levaria minutos; <code class=\"i\">fread</code> leva segundos. Para arquivos de proteína (algumas centenas de linhas), qualquer uma serve.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que mostra as 5 primeiras linhas cruas do arquivo <code>TODAS_CEREBELO_bruto.csv</code>, sem tentar interpretá-lo como tabela.",
  ans:["readLines(\"TODAS_CEREBELO_bruto.csv\", n = 5)","readLines(\"TODAS_CEREBELO_bruto.csv\", 5)"],
  ph:"readLines(...)", why:"É assim que você descobre quantas linhas pular, qual o separador e onde estão os blocos.",
  hint:"<code>readLines()</code> com o argumento <code>n</code>."},
 {type:"mc", q:"Você leu o arquivo e <code>dim()</code> devolveu <code>[1] 291 1</code> — 291 linhas e apenas 1 coluna. O que aconteceu?",
  opts:["O arquivo está corrompido","O separador está errado (leu tudo como uma coluna só)","Faltou <code>header = TRUE</code>","O arquivo tem só uma coluna mesmo"],
  correct:1, why:"Uma coluna só é a assinatura clássica de separador errado: o R não achou onde cortar. Arquivo <code>.csv</code> brasileiro costuma vir com <code>;</code>."}
]},

{id:"3.3", min:"12", title:"Nomes de coluna quebrados", goal:"Entender o que check.names faz com os seus nomes e como padronizar de vez.",
blocks:[
 {t:"p",html:"Nomes de coluna do Progenesis têm espaço, parêntese e acento: <code class=\"i\">Anova (p)</code>, <code class=\"i\">Normalized abundance</code>, <code class=\"i\">Max fold change</code>. O R base, por padrão, os reescreve — e aí você tenta acessar pelo nome original e não acha."},
 {t:"code",cap:"O que check.names faz",code:'# check.names = TRUE (padrão do read.csv):\n# "Anova (p)"            ->  "Anova..p."\n# "Normalized abundance" ->  "Normalized.abundance"\n# "14dias_3"             ->  "X14dias_3"     <- prefixo X!\n\n# check.names = FALSE: preserva exatamente\nprog <- read.csv("arquivo.csv", check.names = FALSE)\nnames(prog)[1:5]'},
 {t:"h",text:"Acessar nome com espaço: crase"},
 {t:"p",html:"Preservando os nomes originais, você precisa de crase para acessá-los:"},
 {t:"code",cap:"Crase para nomes não-sintáticos",code:'prog$`Anova (p)`            # com crase, funciona\nprog[["Anova (p)"]]         # alternativa, sem crase\n\n# dplyr também precisa de crase:\ndplyr::filter(prog, `Anova (p)` < 0.05)'},
 {t:"h",text:"A saída limpa: janitor"},
 {t:"code",cap:"clean_names",code:'# install.packages("janitor")\nlibrary(janitor)\n\nprog <- read.csv("TODAS_CEREBELO_bruto.csv", skip = 2, check.names = FALSE)\nprog <- clean_names(prog)\n\nnames(prog)[1:6]\n# "accession" "peptide_count" "confidence_score" "anova_p" "ctrl_1" "x3dias_2"'},
 {t:"p",html:"<code class=\"i\">clean_names()</code> deixa tudo em minúsculo, troca espaço e pontuação por <code class=\"i\">_</code>, tira acento e resolve duplicatas. Vira um padrão único, e você para de adivinhar como o nome ficou."},
 {t:"warn",title:"Ainda sobra o X",html:"<p>Nome que começa com dígito continua ganhando prefixo (<code class=\"i\">x3dias_2</code>). Isso é regra da linguagem, não do pacote. Duas saídas: renomear as amostras na origem (<code class=\"i\">D3_2</code> em vez de <code class=\"i\">3dias_2</code>), ou casar os nomes com <code class=\"i\">sub(\"^[Xx]\", \"\", nomes)</code> — que é o truque que o seu <code class=\"i\">run_dep2_batch.R</code> já usa.</p>"},
 {t:"code",cap:"Renomeando à mão",code:'names(prog)[5:16] <- c("Ctrl_1","D3_2","D14_3","D28_4",\n                       "Ctrl_5","D3_6","D14_7","D28_8",\n                       "Ctrl_9","D3_10","D14_11","D28_12")\n\n# Ou por padrão de texto, sem contar posição:\nnames(prog) <- sub("28dias", "D28", names(prog), fixed = TRUE)\nnames(prog) <- sub("14dias", "D14", names(prog), fixed = TRUE)\nnames(prog) <- sub("3dias",  "D3",  names(prog), fixed = TRUE)'},
 {t:"key",title:"Ordem importa",html:"<p>Repare que <code class=\"i\">14dias</code> tem que ser trocado <b>antes</b> de <code class=\"i\">3dias</code>? Não — mas <code class=\"i\">3dias</code> antes de <code class=\"i\">14dias</code> seria um desastre? Também não, porque <code class=\"i\">sub(\"3dias\")</code> não casa dentro de <code class=\"i\">14dias</code>. Já <code class=\"i\">28dias</code> vs <code class=\"i\">8dias</code> casaria. Regra: troque sempre do padrão mais específico para o mais genérico, e confira com <code class=\"i\">names()</code> depois.</p>"}
],
ex:[
 {type:"code", q:"A coluna se chama exatamente <code>Anova (p)</code>. Escreva a expressão que extrai essa coluna do data.frame <code>prog</code>, usando crase.",
  ans:["prog$`Anova (p)`","prog[[\"Anova (p)\"]]"], ph:"prog$`...`",
  why:"Crase é o jeito de dizer ao R que aquilo é um nome, apesar do espaço e do parêntese.",
  hint:"Cerque o nome com crases (a tecla ao lado do 1)."},
 {type:"mc", q:"Depois de <code>read.csv()</code> sem argumentos extras, a coluna <code>14dias_3</code> passou a se chamar como?",
  opts:["<code>14dias_3</code>","<code>X14dias_3</code>","<code>x14dias.3</code>","<code>V14</code>"],
  correct:1, why:"<code>check.names = TRUE</code> prefixa <code>X</code> em nomes que começam com dígito, porque nome de objeto em R não pode começar com número. Minúsculo só se você passar pelo <code>clean_names()</code>."}
]},

{id:"3.4", min:"16", title:"O layout do Progenesis: raw vs normalized", goal:"Separar os blocos de abundância com segurança — por nome, não por posição decorada.",
blocks:[
 {t:"p",html:"O export do Progenesis coloca dois blocos de abundância lado a lado, cada um com uma coluna por amostra. No seu arquivo do cerebelo: colunas 5–16 são <i>Normalized abundance</i> e 17–28 são <i>Raw abundance</i>. O rótulo do bloco fica na <b>linha acima</b> do cabeçalho, não no nome de cada coluna."},
 {t:"code",cap:"Lendo a linha dos blocos separadamente",code:'linhas <- readLines("TODAS_CEREBELO_bruto.csv", n = 3)\n\nblocos <- strsplit(linhas[2], ",", fixed = TRUE)[[1]]\nwhich(blocos != "")\n# [1]  5 17\nblocos[which(blocos != "")]\n# [1] "Normalized abundance" "Raw abundance"'},
 {t:"p",html:"Ou seja: o bloco normalized começa na coluna 5 e o raw na 17. Com 12 amostras, isso dá 5:16 e 17:28 — mas você <b>derivou</b> em vez de decorar, e o código continua correto num arquivo com número diferente de amostras."},
 {t:"code",cap:"Separando os blocos",code:'prog <- read.csv("TODAS_CEREBELO_bruto.csv", skip = 2, check.names = FALSE)\n\nanot <- prog[, 1:4]        # Accession, Peptide count, Confidence, Anova (p)\nnorm <- prog[, 5:16]       # Normalized abundance (Progenesis)\nraw  <- prog[, 17:28]      # Raw abundance\n\nmat_raw <- as.matrix(raw)\nrownames(mat_raw) <- prog$Accession\n\ndim(mat_raw)   # 290 x 12'},
 {t:"h",text:"Comparando os dois blocos"},
 {t:"code",cap:"O diagnóstico que mudou o seu projeto",code:'med_norm <- apply(log2(as.matrix(norm)), 2, median, na.rm = TRUE)\nmed_raw  <- apply(log2(as.matrix(raw)),  2, median, na.rm = TRUE)\n\nround(rbind(normalized = med_norm, raw = med_raw), 2)\n#              ctrl_1  3dias_2  ...  ctrl_9\n# normalized     9.02    10.95  ...    9.10\n# raw           11.05    10.98  ...    8.94'},
 {t:"key",title:"A descoberta",html:"<p>Foi essa tabela que revelou o problema: no bloco <b>normalized</b> do Progenesis, <code class=\"i\">ctrl_1</code> e <code class=\"i\">ctrl_9</code> pareciam igualmente baixas (~9). No <b>raw</b>, <code class=\"i\">ctrl_1</code> está normal (11,05) e só <code class=\"i\">ctrl_9</code> está baixa (8,94).</p><p>A normalização por spike-in de enolase (adicionada em quantidade fixa <b>pós-digestão</b>) corrompeu a ctrl_1: quando a razão spike/endógeno é alta, ancorar na enolase empurra o endógeno para baixo. Conclusão: <b>normalizar a partir do raw e descartar o normalized do Progenesis</b> — isso resgata a ctrl_1 sozinho.</p>"},
 {t:"h",text:"A lição geral"},
 {t:"p",html:"Software de aquisição faz escolhas de normalização que você não controla. Sempre que o export oferecer abundância bruta, <b>leve a bruta</b> para o R e normalize você, com método que você entende e consegue justificar. O bloco normalized serve para comparação, não como ponto de partida."},
 {t:"warn",title:"Spike-in é diferente de contaminante",html:"<p>O spike-in de enolase de levedura é o accession <code class=\"i\">P00924</code>. A <code class=\"i\">Eno1</code> que aparece nos inputs de cerebelo e hipocampo (A0A8I6ART9, A0ABK0LLI1) é a enolase <b>endógena</b> do rato — proteína real, deve permanecer. Remova por accession, nunca por nome de gene.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que cria <code>mat_raw</code>: matriz numérica das colunas 17 a 28 do data.frame <code>prog</code>.",
  ans:["mat_raw <- as.matrix(prog[, 17:28])","as.matrix(prog[, 17:28])"],
  ph:"mat_raw <- as.matrix(...)", why:"Em seguida: <code>rownames(mat_raw) &lt;- prog$Accession</code>, para não perder a identidade das proteínas.",
  hint:"<code>as.matrix()</code> em cima do recorte de colunas."},
 {type:"mc", q:"Por que normalizar a partir do bloco <i>Raw abundance</i> em vez do <i>Normalized abundance</i>?",
  opts:["Raw é sempre mais preciso","Porque a normalização do Progenesis usou um spike-in que pode distorcer amostras com razão spike/endógeno alta — e você não controla esse passo","Porque o DEP2 não aceita dados normalizados","Porque o bloco normalized tem mais NA"],
  correct:1, why:"É exatamente o que aconteceu com a ctrl_1. Normalizando você mesmo, a partir do raw, o método fica explícito, auditável e defensável."},
 {type:"do", q:"Faça na sua máquina:", q2:"Peguei um export do Progenesis com os dois blocos e comparei as medianas log2 por amostra entre raw e normalized."}
]},

{id:"3.5", min:"10", title:"Encoding, ponto e vírgula, decimal com vírgula", goal:"Ler sem susto os arquivos gerados em configuração brasileira.",
blocks:[
 {t:"p",html:"Três armadilhas locais aparecem juntas: separador <code class=\"i\">;</code>, decimal <code class=\"i\">,</code> e acento quebrado. As três se resolvem na leitura."},
 {t:"code",cap:"CSV brasileiro",code:'# read.csv2 é read.csv com sep=";" e dec="," já configurados\nsky <- read.csv2("teste2.csv", check.names = FALSE)\n\n# Ou explícito, que é mais claro:\nsky <- read.csv("teste2.csv", sep = ";", dec = ",", check.names = FALSE)\n\n# Com fread:\nsky <- data.table::fread("teste2.csv", sep = ";", dec = ",")'},
 {t:"key",title:"O seu export do Skyline",html:"<p><code class=\"i\">teste2.csv</code> tem 470.832 linhas, separador <code class=\"i\">;</code> e decimal <code class=\"i\">,</code>, com as colunas <i>Protein Accession; Protein Gene; Peptide Modified Sequence; Precursor Charge; Is Decoy; Isotope Dot Product; Replicate Name; Total Area MS1</i>. Sem <code class=\"i\">dec = \",\"</code>, a coluna <i>Total Area MS1</i> vira texto e todo o resto do script falha — o <code class=\"i\">idotp &gt; 0.8</code> inclusive.</p>"},
 {t:"h",text:"Confira sempre depois de ler"},
 {t:"code",cap:"Verificação de tipo",code:'str(sky)\n# Se aparecer:  $ Total Area MS1 : chr  "1234,5" "890,2" ...\n# o dec estava errado.\n\n# Conserto pós-leitura (funciona, mas prefira acertar na leitura):\nsky$`Total Area MS1` <- as.numeric(sub(",", ".", sky$`Total Area MS1`, fixed = TRUE))'},
 {t:"h",text:"Acentos"},
 {t:"code",cap:"encoding",code:'# Se "Proteína" aparecer como "Prote?na" ou "ProteÃ­na":\nprog <- read.csv("arquivo.csv", fileEncoding = "latin1")   # Windows antigo\nprog <- read.csv("arquivo.csv", fileEncoding = "UTF-8")    # padrão moderno\n\n# readr detecta melhor:\nprog <- readr::read_csv("arquivo.csv", locale = readr::locale(encoding = "latin1"))'},
 {t:"note",title:"Ao salvar",html:"<p>Na hora de exportar resultado, force o encoding para o Excel abrir certo:</p>"},
 {t:"code",cap:"Escrevendo de volta",code:'write.csv(tabela, "tabela_cerebelo_Ctrl_vs_D14.csv",\n          row.names = FALSE, fileEncoding = "UTF-8")\n\n# Para o Excel em português, o formato com ; e vírgula decimal:\nwrite.csv2(tabela, "tabela.csv", row.names = FALSE)'},
 {t:"p",html:"Você não tem <code class=\"i\">openxlsx</code> nem <code class=\"i\">writexl</code> instalados — por isso as saídas vão em CSV. Se quiser planilha formatada no estilo Progenesis, <code class=\"i\">install.packages(\"openxlsx\")</code> resolve, e aí dá para escrever a linha-título “Normalized Log2 Intensities” mesclada sobre as colunas de amostra."}
],
ex:[
 {type:"code", q:"Escreva o comando que lê <code>teste2.csv</code> com separador ponto e vírgula e decimal vírgula, preservando os nomes das colunas.",
  ans:["read.csv(\"teste2.csv\", sep = \";\", dec = \",\", check.names = FALSE)",
       "read.csv2(\"teste2.csv\", check.names = FALSE)",
       "sky <- read.csv(\"teste2.csv\", sep = \";\", dec = \",\", check.names = FALSE)"],
  ph:'read.csv("teste2.csv", sep = ..., dec = ..., ...)',
  why:"Acertar na leitura evita conserto coluna a coluna depois.",
  hint:"Três argumentos: <code>sep</code>, <code>dec</code> e <code>check.names</code>."},
 {type:"mc", q:"<code>str()</code> mostra a coluna de intensidade como <code>chr</code> com valores tipo <code>\"1234,5\"</code>. Qual o efeito se você não corrigir?",
  opts:["Nenhum, o R converte na hora da conta","Toda operação numérica falha ou gera NA silenciosamente","Só afeta os gráficos","O arquivo não abre"],
  correct:1, why:"<code>log2()</code> dá erro; <code>as.numeric()</code> devolve NA com um mero warning. É o pior caso: você perde os dados sem receber um erro."}
]}
]});

TRILHA.push({n:"4", title:"dplyr: manipular tabelas", lessons:[

{id:"4.1", min:"10", title:"O pipe: ler código da esquerda para a direita", goal:"Escrever cadeias de operações que se leem como frases, em vez de parênteses aninhados.",
blocks:[
 {t:"p",html:"Sem pipe, uma sequência de operações fica aninhada de dentro para fora — você lê ao contrário. O pipe inverte isso."},
 {t:"code",cap:"O mesmo cálculo, três formas",code:'# 1) Aninhado: lê-se de dentro para fora\nround(median(log2(abund), na.rm = TRUE), 2)\n\n# 2) Passo a passo: claro, mas cria objetos descartáveis\nl <- log2(abund)\nm <- median(l, na.rm = TRUE)\nround(m, 2)\n\n# 3) Com pipe: lê-se na ordem em que acontece\nabund |> log2() |> median(na.rm = TRUE) |> round(2)'},
 {t:"p",html:"Leia <code class=\"i\">|&gt;</code> como <b>“e então”</b>: pega <code class=\"i\">abund</code>, e então tira log2, e então calcula a mediana, e então arredonda."},
 {t:"h",text:"|> ou %>%?"},
 {t:"table",head:["","<code>|&gt;</code> (base R)","<code>%&gt;%</code> (magrittr/tidyverse)"],rows:[
  ["Precisa de pacote","Não (R ≥ 4.1)","Sim — vem com dplyr"],
  ["Ponto <code>.</code> como marcador","Não (usa <code>_</code> com argumento nomeado)","Sim, em qualquer posição"],
  ["Recomendação","Use este por padrão","Use quando precisar do <code>.</code> no meio"]
 ]},
 {t:"code",cap:"Quando a posição do argumento importa",code:'library(dplyr)\n\n# O pipe joga o valor no PRIMEIRO argumento:\nprog |> filter(`Anova (p)` < 0.05)     # = filter(prog, ...)\n\n# Se precisar em outra posição, com %>% use o ponto:\nvalores %>% sub(",", ".", ., fixed = TRUE)'},
 {t:"note",title:"Atalho",html:"<p><code class=\"i\">Ctrl+Shift+M</code> insere o pipe. Em <b>Tools → Global Options → Code</b>, marque <i>Use native pipe operator</i> para o atalho inserir <code class=\"i\">|&gt;</code>.</p>"},
 {t:"h",text:"Por que isso muda a sua vida"},
 {t:"code",cap:"Um pipeline legível",code:'resultado <- prog |>\n  filter(!grepl("^CON__|^REV__", Accession)) |>\n  filter(Accession != "P00924") |>\n  select(Accession, Gene, ctrl_1:D28_12) |>\n  mutate(across(where(is.numeric), log2))'},
 {t:"p",html:"Cinco linhas, cinco etapas, na ordem em que acontecem. Daqui a seis meses você lê isso e entende — e é isso que separa script que você mantém de script que você reescreve."}
],
ex:[
 {type:"code", q:"Reescreva com pipe nativo: <code>round(mean(x, na.rm = TRUE), 2)</code>",
  ans:["x |> mean(na.rm = TRUE) |> round(2)","x |> mean(na.rm=TRUE) |> round(2)","x %>% mean(na.rm = TRUE) %>% round(2)"],
  ph:"x |> mean(...) |> round(...)",
  why:"O valor da esquerda entra como primeiro argumento da função da direita.",
  hint:"Comece pelo dado e vá encadeando na ordem em que as coisas acontecem."},
 {type:"mc", q:"<code>dados |> filter(p &lt; 0.05)</code> é equivalente a:",
  opts:["<code>filter(p &lt; 0.05, dados)</code>","<code>filter(dados, p &lt; 0.05)</code>","<code>dados$filter(p &lt; 0.05)</code>","<code>filter(dados)</code>"],
  correct:1, why:"O pipe insere o valor no primeiro argumento. Todas as funções do dplyr recebem o data.frame como primeiro argumento justamente para funcionarem bem em pipe."}
]},

{id:"4.2", min:"14", title:"filter, select, arrange", goal:"Os três verbos que você mais vai usar: escolher linhas, escolher colunas, ordenar.",
blocks:[
 {t:"p",html:"O dplyr tem poucos verbos, cada um com um trabalho só. <code class=\"i\">filter</code> mexe em <b>linhas</b>, <code class=\"i\">select</code> em <b>colunas</b>, <code class=\"i\">arrange</code> na <b>ordem</b>."},
 {t:"code",cap:"filter: escolher linhas",code:'library(dplyr)\n\n# Uma condição\nprog |> filter(`Anova (p)` < 0.05)\n\n# Duas condições (vírgula = E)\nprog |> filter(`Anova (p)` < 0.05, `Peptide count` >= 2)\n\n# OU\nprog |> filter(Gene == "Alb" | Gene == "Krt1")\n\n# Negando um padrão de texto\nprog |> filter(!grepl("^CON__|^REV__", Accession))\n\n# Removendo o spike-in\nprog |> filter(Accession != "P00924")'},
 {t:"warn",title:"filter e NA",html:"<p><code class=\"i\">filter()</code> descarta linhas em que a condição dá <code class=\"i\">NA</code>. Isso costuma ser o que você quer, mas fique atento: se a coluna <code class=\"i\">Anova (p)</code> tem NA, essas proteínas somem silenciosamente. Para mantê-las: <code class=\"i\">filter(is.na(p) | p &lt; 0.05)</code>.</p>"},
 {t:"code",cap:"select: escolher colunas",code:'prog |> select(Accession, Gene)                 # só essas\nprog |> select(Accession, ctrl_1:D28_12)        # intervalo por nome\nprog |> select(-`Confidence score`)             # tudo menos essa\nprog |> select(starts_with("ctrl"))             # por prefixo\nprog |> select(contains("dias"))                # por trecho\nprog |> select(where(is.numeric))               # por tipo\n\n# Renomear na hora de selecionar:\nprog |> select(accession = Accession, p = `Anova (p)`)'},
 {t:"code",cap:"arrange: ordenar",code:'prog |> arrange(`Anova (p)`)                     # crescente\nprog |> arrange(desc(`Max fold change`))         # decrescente\nprog |> arrange(Gene, `Anova (p)`)               # por gene, depois por p'},
 {t:"h",text:"Encadeando: uma tarefa real"},
 {t:"code",cap:"As 20 proteínas mais significativas, limpas",code:'top20 <- prog |>\n  filter(!grepl("^CON__|^REV__", Accession)) |>\n  filter(Accession != "P00924") |>\n  filter(`Peptide count` >= 2) |>\n  arrange(`Anova (p)`) |>\n  select(Accession, Gene, `Anova (p)`, `Max fold change`) |>\n  head(20)\n\ntop20'},
 {t:"key",title:"Filtro de 2 peptídeos",html:"<p><code class=\"i\">Peptide count &gt;= 2</code> é uma decisão de rigor, não de código: proteína identificada por um único peptídeo (<i>one-hit wonder</i>) é menos confiável. No projeto do pâncreas você viu que boa parte da contagem “crua” do PLGS era redundância e one/two-hit — filtrar por evidência única derrubou 1.381–4.180 para 281–807 por corrida. Deixe esse filtro explícito e documentado no script.</p>"},
 {t:"h",text:"count e distinct: conferências rápidas"},
 {t:"code",cap:"Conferindo",code:'prog |> count(Gene, sort = TRUE) |> head()     # genes repetidos?\nprog |> distinct(Accession) |> nrow()          # accessions únicos\nprog |> filter(duplicated(Gene))               # quais duplicam'}
],
ex:[
 {type:"code", q:"Escreva o pipeline que, a partir de <code>prog</code>, mantém só as linhas com <code>Peptide count</code> ≥ 2 e ordena por <code>Anova (p)</code> crescente.",
  ans:["re:prog\\s*\\|>\\s*filter\\(\\s*`Peptide count`\\s*>=\\s*2\\s*\\)\\s*\\|>\\s*arrange\\(\\s*`Anova \\(p\\)`\\s*\\)",
       "re:prog\\s*%>%\\s*filter\\(\\s*`Peptide count`\\s*>=\\s*2\\s*\\)\\s*%>%\\s*arrange\\(\\s*`Anova \\(p\\)`\\s*\\)"],
  ph:"prog |> filter(...) |> arrange(...)",
  why:"Nomes com espaço vão entre crases. Sem <code>desc()</code>, arrange é crescente — que é o que você quer para p-valor.",
  hint:"Dois verbos encadeados por pipe; use crase nos nomes com espaço/parêntese."},
 {type:"mc", q:"Sua tabela tem 290 proteínas. Depois de <code>filter(`Anova (p)` &lt; 0.05)</code> sobraram 40, mas você sabe que 12 proteínas têm p = NA. Onde elas foram parar?",
  opts:["Estão entre as 40","Foram descartadas — <code>NA &lt; 0.05</code> não é TRUE","Viraram p = 1","Deram erro"],
  correct:1, why:"<code>filter()</code> só mantém o que é explicitamente TRUE. Como <code>NA &lt; 0.05</code> devolve NA, essas linhas caem. Se importarem, use <code>filter(is.na(p) | p &lt; 0.05)</code>."}
]},

{id:"4.3", min:"14", title:"mutate e across: criar e transformar colunas", goal:"Aplicar log2 em 12 colunas de uma vez, e criar as colunas derivadas que você precisa.",
blocks:[
 {t:"p",html:"<code class=\"i\">mutate()</code> cria ou modifica colunas. A coluna nova tem o mesmo comprimento da tabela — vetorização de novo."},
 {t:"code",cap:"mutate básico",code:'library(dplyr)\n\nres <- res |>\n  mutate(\n    log_p    = -log10(p_val),                       # eixo Y do volcano\n    sig      = p_adj < 0.05 & abs(diff) > 0.585,    # o critério do add_rejections\n    direcao  = case_when(\n      diff >  0.585 & p_adj < 0.05 ~ "up",\n      diff < -0.585 & p_adj < 0.05 ~ "down",\n      TRUE                          ~ "ns"\n    )\n  )'},
 {t:"p",html:"<code class=\"i\">case_when()</code> é o if/else vetorizado: testa as condições na ordem, a primeira que der TRUE vence, e <code class=\"i\">TRUE ~ ...</code> no fim é o “caso contrário”. É como você monta as três cores do volcano."},
 {t:"h",text:"across: a mesma transformação em várias colunas"},
 {t:"code",cap:"log2 em 12 colunas numa linha",code:'# Todas as colunas numéricas\nprog_log <- prog |> mutate(across(where(is.numeric), log2))\n\n# Só as colunas de amostra, por intervalo\nprog_log <- prog |> mutate(across(ctrl_1:D28_12, log2))\n\n# Só as que começam com um prefixo\nprog_log <- prog |> mutate(across(starts_with("D"), log2))\n\n# Criando colunas NOVAS em vez de sobrescrever\nprog_log <- prog |>\n  mutate(across(ctrl_1:D28_12, log2, .names = "log2_{.col}"))'},
 {t:"warn",title:"log2 de zero e de NA",html:"<p><code class=\"i\">log2(0)</code> devolve <code class=\"i\">-Inf</code>, que estraga médias e gráficos. Em proteômica label-free, zero geralmente significa “não detectado” — trate como NA <b>antes</b> do log:</p>"},
 {t:"code",cap:"Zeros viram NA antes do log",code:'prog_log <- prog |>\n  mutate(across(ctrl_1:D28_12, ~ ifelse(.x <= 0, NA, log2(.x))))\n\n# Confirme que não sobrou infinito:\nsum(is.infinite(as.matrix(prog_log[, 5:16])))   # deve ser 0'},
 {t:"p",html:"O <code class=\"i\">~ .x</code> é a forma curta de escrever uma função: leia como “para cada coluna <code class=\"i\">.x</code>, faça isso”. Você vai reencontrar essa notação no purrr, na aula 9.2."},
 {t:"h",text:"Colunas derivadas úteis no seu contexto"},
 {t:"code",cap:"Métricas por proteína",code:'library(dplyr)\n\nprog2 <- prog_log |>\n  rowwise() |>\n  mutate(\n    n_valid = sum(!is.na(c_across(ctrl_1:D28_12))),\n    media   = mean(c_across(ctrl_1:D28_12), na.rm = TRUE),\n    cv      = sd(c_across(ctrl_1:D28_12), na.rm = TRUE) / media\n  ) |>\n  ungroup()'},
 {t:"note",title:"rowwise é lento",html:"<p>Para tabelas de centenas de linhas, tudo bem. Para milhares, prefira as funções matriciais: <code class=\"i\">rowSums(!is.na(mat))</code> e <code class=\"i\">rowMeans(mat, na.rm = TRUE)</code> fazem o mesmo em uma fração do tempo. Não esqueça o <code class=\"i\">ungroup()</code> depois do <code class=\"i\">rowwise()</code>.</p>"}
],
ex:[
 {type:"code", q:"Escreva o <code>mutate</code> que aplica log2 a todas as colunas de <code>ctrl_1</code> até <code>D28_12</code> do objeto <code>prog</code>.",
  ans:["re:prog\\s*\\|>\\s*mutate\\(\\s*across\\(\\s*ctrl_1:D28_12\\s*,\\s*log2\\s*\\)\\s*\\)",
       "re:mutate\\(\\s*prog\\s*,\\s*across\\(\\s*ctrl_1:D28_12\\s*,\\s*log2\\s*\\)\\s*\\)",
       "re:prog\\s*%>%\\s*mutate\\(\\s*across\\(\\s*ctrl_1:D28_12\\s*,\\s*log2\\s*\\)\\s*\\)"],
  ph:"prog |> mutate(across(...))",
  why:"<code>across()</code> dentro de <code>mutate()</code> é o padrão para transformar várias colunas de uma vez.",
  hint:"<code>across(intervalo_de_colunas, funcao)</code> dentro do <code>mutate()</code>."},
 {type:"mc", q:"Por que trocar zero por NA antes do log2?",
  opts:["Para deixar a tabela mais limpa","Porque <code>log2(0)</code> é <code>-Inf</code>, e infinito estraga média, sd, PCA e gráficos","Porque o DEP2 não aceita zeros","Não é necessário"],
  correct:1, why:"<code>-Inf</code> se propaga silenciosamente: <code>mean()</code> vira <code>-Inf</code>, o eixo do gráfico explode e o PCA falha. E conceitualmente zero em label-free significa 'não detectado' = missing, não 'abundância zero'."}
]},

{id:"4.4", min:"14", title:"group_by e summarise: resumir por grupo", goal:"Calcular mediana por amostra e CV por grupo — as duas métricas centrais do seu QC.",
blocks:[
 {t:"p",html:"<code class=\"i\">group_by()</code> não muda os dados: ele marca a tabela para que a próxima operação aconteça <b>dentro de cada grupo</b>. <code class=\"i\">summarise()</code> então colapsa cada grupo em uma linha."},
 {t:"code",cap:"O padrão",code:'library(dplyr)\n\n# long: uma linha por proteína x amostra\nlongo |>\n  group_by(amostra) |>\n  summarise(\n    n_prot  = sum(!is.na(log2_int)),\n    mediana = median(log2_int, na.rm = TRUE),\n    .groups = "drop"\n  )\n\n# amostra   n_prot  mediana\n# ctrl_1       287    11.05\n# ctrl_5       285    10.90\n# ctrl_9       262     8.94   <- destoa nas duas métricas'},
 {t:"key",title:"As duas métricas do QC",html:"<p>Número de proteínas e mediana log2, por amostra. A <code class=\"i\">ctrl_9</code> destoa nas duas — por isso ela é <b>amostra ruim de verdade</b> (input real baixo), e não um problema de escala que a normalização resolveria. Se destoasse só na mediana, seria escala.</p>"},
 {t:"h",text:"CV intragrupo"},
 {t:"code",cap:"Coeficiente de variação por grupo",code:'cv_tab <- longo |>\n  group_by(proteina, condicao) |>\n  summarise(\n    media = mean(intensidade, na.rm = TRUE),\n    dp    = sd(intensidade, na.rm = TRUE),\n    n     = sum(!is.na(intensidade)),\n    .groups = "drop"\n  ) |>\n  filter(n >= 2) |>\n  mutate(cv = 100 * dp / media)\n\n# Resumo por grupo:\ncv_tab |>\n  group_by(condicao) |>\n  summarise(cv_mediano = median(cv, na.rm = TRUE), .groups = "drop")'},
 {t:"warn",title:"CV se calcula na escala linear",html:"<p>CV = desvio/média só faz sentido na escala <b>original</b>, não em log2 (onde a média pode ser próxima de zero e o CV explode). Na escala log, a métrica equivalente é o desvio padrão do log2, que aproxima o CV relativo. Escolha uma e diga qual no eixo do gráfico.</p>"},
 {t:"key",title:"Por que o CV do seu controle importa tanto",html:"<p>No cerebelo, a variância intragrupo do controle era <b>0,860</b> contra <b>0,088</b> do grupo 3 dias — quase 10× maior. Esse número é a explicação de todo o quebra-cabeça “4 grupos dá significativo, 2 grupos não”: o limma junta (pooled) a variância dos grupos, e os grupos homogêneos mascaravam o controle bagunçado. Uma linha de <code class=\"i\">group_by + summarise</code> revela isso.</p>"},
 {t:"h",text:"count, n() e o .groups"},
 {t:"code",cap:"Detalhes que evitam avisos",code:'longo |> count(condicao)                  # atalho para group_by + tally\n\nlongo |>\n  group_by(condicao) |>\n  summarise(n = n(), .groups = "drop")     # n() conta linhas do grupo\n\n# Sem .groups = "drop", o resultado continua agrupado e o dplyr avisa.\n# Agrupamento esquecido é fonte clássica de resultado errado depois.'},
 {t:"note",title:"mutate depois de group_by",html:"<p><code class=\"i\">summarise()</code> colapsa; <code class=\"i\">mutate()</code> depois de <code class=\"i\">group_by()</code> <b>mantém</b> todas as linhas e adiciona a estatística do grupo repetida. É assim que se centraliza por amostra: <code class=\"i\">group_by(amostra) |&gt; mutate(centrado = log2_int - median(log2_int, na.rm = TRUE))</code>.</p>"}
],
ex:[
 {type:"code", q:"A partir da tabela longa <code>longo</code> (colunas <code>amostra</code> e <code>log2_int</code>), escreva o pipeline que calcula a mediana de <code>log2_int</code> por amostra.",
  ans:["re:longo\\s*\\|>\\s*group_by\\(\\s*amostra\\s*\\)\\s*\\|>\\s*summarise\\(\\s*mediana\\s*=\\s*median\\(\\s*log2_int\\s*,\\s*na\\.rm\\s*=\\s*TRUE\\s*\\).*\\)",
       "re:longo\\s*%>%\\s*group_by\\(\\s*amostra\\s*\\)\\s*%>%\\s*summarise\\(\\s*mediana\\s*=\\s*median\\(\\s*log2_int\\s*,\\s*na\\.rm\\s*=\\s*TRUE\\s*\\).*\\)"],
  ph:"longo |> group_by(...) |> summarise(mediana = ...)",
  why:"Esse vetor de medianas é exatamente o insumo do median-centering da aula 7.2.",
  hint:"<code>group_by(amostra)</code> e depois <code>summarise()</code> com <code>median(..., na.rm = TRUE)</code>."},
 {type:"mc", q:"O CV mediano do grupo controle é 45% e o dos demais grupos é 12%. O que isso indica para a sua análise diferencial?",
  opts:["Nada, CV alto é normal em proteômica","O controle é heterogêneo — o limma vai juntar variâncias e isso pode mascarar ou inventar significância; investigue amostra ruim antes de testar","Deve-se aumentar o alfa","Deve-se remover o grupo controle"],
  correct:1, why:"Foi exatamente o caso do cerebelo. Limpar o controle (remover a ctrl_9, normalizar do raw) foi o que fez os modelos convergirem — a decisão certa não era escolher entre 2 e 4 grupos."}
]},

{id:"4.5", min:"12", title:"Joins: colar anotação nos resultados", goal:"Juntar duas tabelas pela chave certa, sem perder nem duplicar linhas.",
blocks:[
 {t:"p",html:"Você quase sempre tem duas tabelas: a de resultados (accession + estatística) e a de anotação (accession + gene + descrição). Join junta as duas pela chave comum."},
 {t:"table",head:["Join","Mantém","Use quando"],rows:[
  ["<code>left_join(a, b)</code>","Todas as linhas de <b>a</b>","Padrão. Você quer enriquecer <code>a</code> sem perder nada dela."],
  ["<code>inner_join(a, b)</code>","Só o que está nas duas","Você quer apenas o que tem anotação"],
  ["<code>anti_join(a, b)</code>","O de <b>a</b> que <b>não</b> está em b","Diagnóstico: quem ficou sem anotação"],
  ["<code>full_join(a, b)</code>","Tudo dos dois","Raro; útil para unir corridas diferentes"]
 ]},
 {t:"code",cap:"left_join na prática",code:'library(dplyr)\n\nres  <- data.frame(accession = c("Q8R5L1","P62259","A0A8I6ART9"),\n                   p_adj     = c(0.001, 0.20, 0.03))\n\nanot <- data.frame(accession = c("Q8R5L1","P62259","P00924"),\n                   gene      = c("Slc25a22","Ywhae","ENO1_YEAST"),\n                   descricao = c("mito carrier","14-3-3 epsilon","enolase (spike-in)"))\n\nres |> left_join(anot, by = "accession")\n#    accession p_adj      gene      descricao\n# 1     Q8R5L1 0.001  Slc25a22   mito carrier\n# 2     P62259 0.200     Ywhae 14-3-3 epsilon\n# 3 A0A8I6ART9 0.030      <NA>           <NA>   <- sem anotação'},
 {t:"code",cap:"Quando as colunas-chave têm nomes diferentes",code:'res |> left_join(anot, by = c("accession" = "Protein.ID"))'},
 {t:"h",text:"O erro que passa despercebido: duplicação"},
 {t:"warn",title:"Chave duplicada multiplica linhas",html:"<p>Se a tabela de anotação tem o mesmo accession duas vezes, o join <b>duplica</b> a linha do resultado. Sua tabela sai com mais linhas do que entrou, e você faz estatística em dado repetido. Confira sempre:</p>"},
 {t:"code",cap:"Checagens obrigatórias em torno de um join",code:'nrow(res)                          # antes\nsum(duplicated(anot$accession))    # a chave é única na anotação? deve ser 0\n\njuntou <- left_join(res, anot, by = "accession")\nnrow(juntou)                       # depois — TEM que ser igual ao antes\n\n# Quem ficou sem anotação:\nanti_join(res, anot, by = "accession")\n\n# Se a anotação tem duplicatas legítimas, colapse antes:\nanot_u <- anot |> distinct(accession, .keep_all = TRUE)'},
 {t:"key",title:"No seu caso",html:"<p>Isso resolve o problema da <b>medula, que não tem coluna Gene</b> — só <code class=\"i\">Protein.ID</code>. Em vez de mudar o pipeline (você já usa <code class=\"i\">make_unique(name = Protein.ID)</code> lá), dá para buscar os símbolos por accession no UniProt e colar com <code class=\"i\">left_join</code> na hora de montar a tabela final. O <code class=\"i\">protti::fetch_uniprot()</code> faz esse download.</p>"},
 {t:"code",cap:"Anotação vinda do UniProt",code:'# library(protti)\n# anot <- fetch_uniprot(res$accession,\n#                       columns = c("accession","gene_names","protein_name"))\n# res <- left_join(res, anot, by = c("accession" = "accession"))\n\n# Confira os argumentos com ?fetch_uniprot — a assinatura muda entre versões.'},
 {t:"h",text:"bind_rows: empilhar, não juntar"},
 {t:"code",cap:"Juntando os três tecidos numa tabela só",code:'todos <- bind_rows(\n  cerebelo  |> mutate(tecido = "cerebelo"),\n  hipocampo |> mutate(tecido = "hipocampo"),\n  medula    |> mutate(tecido = "medula")\n)'},
 {t:"p",html:"<b>Join</b> junta lado a lado, por chave. <b>bind_rows</b> empilha em cima, exigindo colunas com o mesmo nome. Marcar a origem com <code class=\"i\">mutate()</code> antes de empilhar é o que permite facetar o gráfico por tecido depois."}
],
ex:[
 {type:"code", q:"Junte a anotação <code>anot</code> à tabela <code>res</code> pela coluna <code>accession</code>, mantendo todas as linhas de <code>res</code>.",
  ans:["res |> left_join(anot, by = \"accession\")","left_join(res, anot, by = \"accession\")","res %>% left_join(anot, by = \"accession\")"],
  ph:'res |> left_join(anot, by = "accession")',
  why:"<code>left_join</code> preserva a tabela da esquerda — o que não tiver anotação recebe NA em vez de sumir.",
  hint:"<code>left_join(x, y, by = \"chave\")</code>."},
 {type:"mc", q:"Depois de um <code>left_join</code>, sua tabela passou de 290 para 315 linhas. O que houve?",
  opts:["O join adicionou proteínas novas","A tabela de anotação tem chaves duplicadas e multiplicou linhas","É o comportamento normal do left_join","Faltou <code>by</code>"],
  correct:1, why:"<code>left_join</code> nunca acrescenta linhas por conta própria — cada duplicata da chave na tabela da direita vira uma linha extra. Rode <code>sum(duplicated(anot$accession))</code> e use <code>distinct()</code>."}
]}
]});

TRILHA.push({n:"5", title:"Wide e long: a virada de chave", lessons:[

{id:"5.1", min:"10", title:"Por que existem dois formatos", goal:"Reconhecer qual formato cada ferramenta quer — e parar de brigar com isso.",
blocks:[
 {t:"p",html:"Os mesmos dados podem ser arrumados de duas formas. Nenhuma é melhor; cada ferramenta quer uma."},
 {t:"h",text:"Wide: uma coluna por amostra"},
 {t:"table",head:["accession","ctrl_1","ctrl_5","D3_2"],rows:[
  ["Q8R5L1","11.05","10.90","10.99"],
  ["P62259","13.20","13.10","13.44"]
 ]},
 {t:"h",text:"Long: uma linha por medida"},
 {t:"table",head:["accession","amostra","log2_int"],rows:[
  ["Q8R5L1","ctrl_1","11.05"],
  ["Q8R5L1","ctrl_5","10.90"],
  ["Q8R5L1","D3_2","10.99"],
  ["P62259","ctrl_1","13.20"],
  ["…","…","…"]
 ]},
 {t:"table",head:["Formato","Quem quer","Por quê"],rows:[
  ["<b>Wide</b>","DEP2, limma, vsn, prcomp, heatmap","São operações de <b>matriz</b>: linhas × colunas"],
  ["<b>Long</b>","protti, ggplot2, dplyr (group_by)","Cada linha é uma observação com seus rótulos — é o formato 'tidy'"]
 ]},
 {t:"key",title:"É por isso que os seus dois pacotes parecem incompatíveis",html:"<p>O <b>protti</b> foi desenhado em cima de dado longo — por isso <code class=\"i\">qc_cvs()</code>, <code class=\"i\">qc_pca()</code> e as funções de intensidade pedem colunas de amostra, agrupamento e intensidade separadas. O <b>DEP2</b> trabalha com <code class=\"i\">SummarizedExperiment</code>, que é wide por construção. Você não precisa escolher: precisa saber converter, e são duas funções.</p>"},
 {t:"note",title:"A regra prática",html:"<p>Guarde os dados em <b>long</b> enquanto está explorando, limpando e plotando. Converta para <b>wide</b> só na hora de entregar à estatística. Voltar sempre é possível.</p>"}
],
ex:[
 {type:"mc", q:"Você quer fazer um boxplot da distribuição de intensidade por amostra no ggplot2. Qual formato precisa?",
  opts:["Wide — uma coluna por amostra","Long — colunas amostra e intensidade","Tanto faz","Matriz"],
  correct:1, why:"ggplot mapeia colunas para eixos: precisa de uma coluna <code>amostra</code> (eixo x) e uma <code>intensidade</code> (eixo y). Em wide, cada amostra é uma coluna diferente e não há como mapear."},
 {type:"mc", q:"E para rodar <code>prcomp()</code> ou entregar ao limma?",
  opts:["Long","Wide (matriz)","Lista","Factor"],
  correct:1, why:"Álgebra matricial exige matriz numérica: proteínas × amostras. É o mesmo motivo de o SummarizedExperiment guardar o assay assim."}
]},

{id:"5.2", min:"13", title:"pivot_longer: de wide para long", goal:"Converter a sua matriz de intensidades para o formato que o protti e o ggplot pedem.",
blocks:[
 {t:"p",html:"<code class=\"i\">pivot_longer()</code> pega várias colunas e as empilha em duas: uma com o <b>nome</b> da coluna, outra com o <b>valor</b>."},
 {t:"code",cap:"A conversão",code:'library(tidyr)\nlibrary(dplyr)\n\nlongo <- prog_log |>\n  pivot_longer(\n    cols      = ctrl_1:D28_12,   # quais colunas empilhar\n    names_to  = "amostra",       # nome da coluna que guarda os nomes\n    values_to = "log2_int"       # nome da coluna que guarda os valores\n  )\n\ndim(prog_log)   # 290 x 16\ndim(longo)      # 3480 x 5   (290 proteínas x 12 amostras)\nhead(longo, 3)'},
 {t:"h",text:"Formas de dizer quais colunas"},
 {t:"code",cap:"cols aceita as mesmas seleções do select()",code:'pivot_longer(prog_log, cols = ctrl_1:D28_12,  ...)      # intervalo\npivot_longer(prog_log, cols = -c(Accession, Gene), ...)  # tudo menos essas\npivot_longer(prog_log, cols = where(is.numeric), ...)    # por tipo\npivot_longer(prog_log, cols = starts_with("D"),  ...)    # por prefixo'},
 {t:"warn",title:"NA no longo",html:"<p>Por padrão as linhas com NA são mantidas. <code class=\"i\">values_drop_na = TRUE</code> as descarta — ótimo para plotar, <b>perigoso</b> para contar. Se você descarta os NA e depois conta linhas por amostra, o número que sai é “proteínas detectadas”, não “proteínas na tabela”. Saiba qual dos dois você quer.</p>"},
 {t:"h",text:"O que fica fácil depois de converter"},
 {t:"code",cap:"QC em três pipelines curtos",code:'library(ggplot2)\n\n# 1) Distribuição por amostra\nggplot(longo, aes(x = amostra, y = log2_int)) +\n  geom_boxplot() +\n  theme(axis.text.x = element_text(angle = 45, hjust = 1))\n\n# 2) Proteínas detectadas por amostra\nlongo |>\n  group_by(amostra) |>\n  summarise(n = sum(!is.na(log2_int)), .groups = "drop")\n\n# 3) Mediana por amostra\nlongo |>\n  group_by(amostra) |>\n  summarise(mediana = median(log2_int, na.rm = TRUE), .groups = "drop")'},
 {t:"key",title:"Esses são três dos oito painéis do seu qc_proteomica.R",html:"<p>Distribuições antes/depois da normalização, número de proteínas por amostra e CV intragrupo saem todos de dado longo com <code class=\"i\">group_by + summarise</code> e um <code class=\"i\">ggplot</code>. Entendendo esta aula e a 6.2, você consegue reescrever aquele script do zero — e adaptá-lo a qualquer estudo novo.</p>"},
 {t:"h",text:"Entrando no protti"},
 {t:"code",cap:"Formato que o protti espera",code:'# O protti trabalha com dado longo, com colunas explícitas de\n# amostra, agrupamento (proteína/precursor) e intensidade.\n\nlongo_protti <- longo |>\n  mutate(condicao = sub("_[0-9]+$", "", amostra))\n\n# library(protti)\n# qc_cvs(longo_protti, grouping = accession, condition = condicao,\n#        intensity = log2_int, plot = TRUE)\n\n# Confira os argumentos com ?qc_cvs antes de rodar.'}
],
ex:[
 {type:"code", q:"Converta <code>prog_log</code> para longo, empilhando as colunas de <code>ctrl_1</code> a <code>D28_12</code> em <code>amostra</code> e <code>log2_int</code>.",
  ans:["re:pivot_longer\\(\\s*(prog_log\\s*,\\s*)?cols\\s*=\\s*ctrl_1:D28_12\\s*,\\s*names_to\\s*=\\s*\"amostra\"\\s*,\\s*values_to\\s*=\\s*\"log2_int\"\\s*\\)",
       "re:prog_log\\s*(\\|>|%>%)\\s*pivot_longer\\(\\s*cols\\s*=\\s*ctrl_1:D28_12\\s*,\\s*names_to\\s*=\\s*\"amostra\"\\s*,\\s*values_to\\s*=\\s*\"log2_int\"\\s*\\)"],
  ph:'prog_log |> pivot_longer(cols = ..., names_to = ..., values_to = ...)',
  why:"290 × 12 = 3.480 linhas. Os nomes em <code>names_to</code> e <code>values_to</code> vão entre aspas — são nomes novos, ainda não existem.",
  hint:"Três argumentos: <code>cols</code>, <code>names_to</code> e <code>values_to</code>."},
 {type:"mc", q:"Uma tabela wide com 290 proteínas e 12 amostras vira, em long, quantas linhas?",
  opts:["290","12","3480","302"],
  correct:2, why:"290 × 12 = 3.480. Uma linha por combinação proteína–amostra, incluindo as que são NA (a menos que você use <code>values_drop_na = TRUE</code>)."}
]},

{id:"5.3", min:"12", title:"pivot_wider e a volta para a matriz", goal:"Fechar o ciclo: do longo tratado de volta à matriz que o DEP2 e o limma consomem.",
blocks:[
 {t:"p",html:"Depois de limpar, normalizar e filtrar em formato longo, você precisa voltar para wide."},
 {t:"code",cap:"pivot_wider",code:'library(tidyr)\n\nwide <- longo |>\n  pivot_wider(\n    id_cols     = accession,   # o que identifica a linha\n    names_from  = amostra,     # o que vira nome de coluna\n    values_from = log2_norm    # o que preenche as células\n  )\n\ndim(wide)   # 290 x 13  (accession + 12 amostras)'},
 {t:"warn",title:"O aviso de list-column",html:"<p>Se aparecer <i>“Values are not uniquely identified”</i> e as células virarem listas, é porque existe mais de um valor para a mesma combinação proteína × amostra. Em proteômica isso acontece quando você ainda está no nível de peptídeo ou precursor. Agregue antes:</p>"},
 {t:"code",cap:"Agregando antes de alargar",code:'library(dplyr)\n\nlongo_prot <- longo_precursor |>\n  group_by(accession, amostra) |>\n  summarise(intensidade = sum(intensidade, na.rm = TRUE), .groups = "drop")\n\n# Depois disso o pivot_wider funciona.'},
 {t:"key",title:"É exatamente o seu skyline_to_dep2.R",html:"<p>Aquele script soma as cargas do mesmo peptídeo, aplica <b>Hi3</b> (média dos três peptídeos mais intensos) e só então monta a matriz proteína × amostra. Sem essa agregação, o <code class=\"i\">pivot_wider</code> reclamaria — e com razão: haveria vários precursores por proteína e amostra.</p>"},
 {t:"h",text:"De data.frame para matriz com nomes de linha"},
 {t:"code",cap:"O último passo antes da estatística",code:'library(tibble)\n\nmat <- wide |>\n  column_to_rownames("accession") |>\n  as.matrix()\n\ndim(mat)\nclass(mat[1, 1])   # confira: tem que ser "numeric"\n\n# E a volta:\ndf <- mat |> as.data.frame() |> rownames_to_column("accession")'},
 {t:"h",text:"Montando o arquivo de entrada do DEP2"},
 {t:"code",cap:"input_dep2_*.txt",code:'entrada <- wide |>\n  dplyr::left_join(anot, by = "accession") |>\n  dplyr::select(Gene, Protein.ID = accession, dplyr::everything())\n\nwrite.table(entrada, "input_dep2_cerebelo_raw.txt",\n            sep = "\\t", row.names = FALSE, quote = FALSE, na = "")'},
 {t:"note",title:"Cuidado com os nomes das amostras",html:"<p>É aqui que se decide o que o <code class=\"i\">make_se_parse(mode = \"delim\")</code> vai entender. Ele quebra pelo delimitador e assume que o <b>primeiro token é a condição</b>: <code class=\"i\">ctrl_all_9</code> vira condition = <code class=\"i\">ctrl</code>, replicate = <code class=\"i\">all_9</code>. Se você quer condições limpas, nomeie as amostras já no padrão <code class=\"i\">Ctrl_1</code>, <code class=\"i\">D3_2</code>, <code class=\"i\">D14_3</code>. Um minuto aqui economiza um <code class=\"i\">recode</code> depois.</p>"}
],
ex:[
 {type:"code", q:"Converta o data.frame <code>wide</code> em matriz, usando a coluna <code>accession</code> como nome das linhas.",
  ans:["re:wide\\s*(\\|>|%>%)\\s*column_to_rownames\\(\\s*\"accession\"\\s*\\)\\s*(\\|>|%>%)\\s*as\\.matrix\\(\\)",
       "re:as\\.matrix\\(\\s*column_to_rownames\\(\\s*wide\\s*,\\s*\"accession\"\\s*\\)\\s*\\)"],
  ph:'wide |> column_to_rownames("accession") |> as.matrix()',
  why:"Sem os nomes de linha você perde a identidade das proteínas na primeira operação matricial.",
  hint:"<code>column_to_rownames()</code> do tibble, e então <code>as.matrix()</code>."},
 {type:"mc", q:"<code>pivot_wider</code> avisa <i>“Values are not uniquely identified”</i> e as células viram listas. O que fazer?",
  opts:["Ignorar o aviso","Agregar antes com <code>group_by(proteina, amostra) |> summarise(...)</code>","Usar <code>pivot_longer</code> em vez disso","Remover os NA"],
  correct:1, why:"O aviso diz que há mais de um valor por célula — típico de dado ainda em nível de peptídeo/precursor. Decida a regra de agregação (soma, Hi3, mediana) e aplique explicitamente."}
]},

{id:"5.4", min:"15", title:"Montar o desenho experimental a partir dos nomes", goal:"Extrair condição, réplica e lote dos nomes das amostras — a tabela que alimenta todo o resto.",
blocks:[
 {t:"p",html:"O <code class=\"i\">colData</code> do SummarizedExperiment, o <code class=\"i\">design</code> do limma e a cor do seu PCA vêm todos da mesma tabela: uma linha por amostra, com as variáveis experimentais. Quase sempre ela é extraível dos próprios nomes."},
 {t:"code",cap:"Separando por delimitador",code:'library(tidyr)\nlibrary(dplyr)\n\namostras <- c("ctrl_1","3dias_2","14dias_3","28dias_4",\n              "ctrl_5","3dias_6","14dias_7","28dias_8",\n              "ctrl_9","3dias_10","14dias_11","28dias_12")\n\ndesign <- data.frame(label = amostras) |>\n  separate(label, into = c("condicao", "replicata"),\n           sep = "_", remove = FALSE)\n\nhead(design, 4)\n#      label condicao replicata\n# 1   ctrl_1     ctrl         1\n# 2  3dias_2    3dias         2'},
 {t:"p",html:"É a mesma lógica do <code class=\"i\">make_se_parse(mode = \"delim\")</code>: quebra no delimitador, primeiro token vira condição. Agora você entende por que <code class=\"i\">ctrl_all_9</code> vira condition = <code class=\"i\">ctrl</code> e replicate = <code class=\"i\">all_9</code>."},
 {t:"code",cap:"Padronizando os rótulos",code:'design <- design |>\n  mutate(\n    condicao = recode(condicao,\n      "ctrl" = "Ctrl", "3dias" = "D3", "14dias" = "D14", "28dias" = "D28"),\n    condicao = factor(condicao, levels = c("Ctrl","D3","D14","D28")),\n    replicata = as.integer(replicata)\n  )\n\nlevels(design$condicao)   # "Ctrl" "D3" "D14" "D28" — Ctrl é a referência\ntable(design$condicao)     # 3 amostras por grupo'},
 {t:"h",text:"Quando o nome não tem delimitador"},
 {t:"code",cap:"Extraindo por padrão de texto",code:'# Nomes tipo "IC_TALITA_01", "IC_TALITA_02", ...\nn <- c("IC_TALITA_01","IC_TALITA_02","IC_TALITA_03","IC_TALITA_04")\n\n# Número no fim do nome:\nidx <- as.integer(sub(".*_", "", n))\nidx\n# [1] 1 2 3 4\n\n# Grupo pelo ciclo de 4 (C, I, E, F):\ngrupo <- c("C","I","E","F")[((idx - 1) %% 4) + 1]\ngrupo\n# [1] "C" "I" "E" "F"'},
 {t:"key",title:"O desenho do pâncreas",html:"<p>São 24 amostras em 4 grupos alternados: C = {1,5,9,13,17,21}, I = {2,6,10,14,18,22}, E = {3,7,11,15,19,23}, F = {4,8,12,16,20,24}. O truque do módulo 4 acima (<code class=\"i\">%%</code> é o resto da divisão) gera isso automaticamente a partir do índice — sem digitar 24 rótulos à mão e sem risco de errar um.</p><p>Duas coisas para conferir <b>antes</b> de confiar: a amostra <b>15</b> foi assumida como E pelo padrão, e só 22 das 24 pastas foram importadas no Skyline. Vale checar as duas.</p>"},
 {t:"h",text:"Variáveis que não estão no nome"},
 {t:"code",cap:"Ordem de injeção e lote entram à mão",code:'design <- design |>\n  mutate(\n    ordem_injecao = c(3,1,4,2,7,5,8,6,11,9,12,10),\n    lote          = c(rep("L1", 6), rep("L2", 6))\n  )\n\n# E aí você pode colorir o PCA por lote e por ordem:\n# se a separação seguir o lote e não a condição, é efeito técnico.'},
 {t:"warn",title:"Cuidado: nem toda separação é lote",html:"<p>No estudo do Rogério, a separação que aparece no PCA (~22% da variância) entre as amostras 33–38 e 1–32 é diferença de <b>tecido</b> — saliva versus polpa — e não artefato técnico. E as amostras 33–38 são <b>pools dos mesmos pacientes</b> de 1–32, ou seja, não são independentes: nunca devem entrar no mesmo modelo estatístico que 1–32. O desenho experimental é conhecimento que você tem e o R não — ele precisa estar escrito nessa tabela, com um comentário explicando.</p>"},
 {t:"code",cap:"Documentando o desenho no próprio script",code:'# DESENHO (confirmado com o pesquisador em 2026-07-22):\n#   1-16  ctrl1 : saliva individual, um paciente por amostra\n#   17-32 pulp1 : saliva individual, um paciente por amostra\n#   33-35 ctrl2 : POOL de tecido pulpar dos pacientes 1-16\n#   36-38 pulp2 : POOL de cone de papel dos pacientes 17-32\n# => Análise principal: saliva 1-32 (n=16 vs 16).\n# => 33-38 NAO entram no mesmo modelo (não são independentes de 1-32).\n\ndesign_saliva <- design |> filter(amostra_num <= 32)'}
],
ex:[
 {type:"code", q:"A partir do data.frame <code>d</code> com a coluna <code>label</code> (ex.: <code>ctrl_1</code>), escreva o comando que separa em <code>condicao</code> e <code>replicata</code> pelo underscore, mantendo a coluna original.",
  ans:["re:separate\\(\\s*(d\\s*,\\s*)?label\\s*,\\s*into\\s*=\\s*c\\(\\s*\"condicao\"\\s*,\\s*\"replicata\"\\s*\\)\\s*,\\s*sep\\s*=\\s*\"_\"\\s*,\\s*remove\\s*=\\s*FALSE\\s*\\)",
       "re:d\\s*(\\|>|%>%)\\s*separate\\(\\s*label\\s*,\\s*into\\s*=\\s*c\\(\\s*\"condicao\"\\s*,\\s*\"replicata\"\\s*\\)\\s*,\\s*sep\\s*=\\s*\"_\"\\s*,\\s*remove\\s*=\\s*FALSE\\s*\\)"],
  ph:'d |> separate(label, into = c(...), sep = "_", remove = FALSE)',
  why:"<code>remove = FALSE</code> preserva o label original — você vai precisar dele para casar com os nomes das colunas da matriz.",
  hint:"<code>separate()</code> com <code>into</code>, <code>sep</code> e <code>remove</code>."},
 {type:"mc", q:"Por que as amostras 33–38 do estudo de pulpite não podem entrar no mesmo modelo que as 1–32?",
  opts:["Porque foram processadas em outro lote","Porque são pools dos mesmos pacientes de 1–32, então as observações não são independentes","Porque têm mais missing values","Porque são de outro instrumento"],
  correct:1, why:"Independência é premissa do teste. Pool dos mesmos indivíduos é a mesma informação contada duas vezes — infla o n e subestima o erro. Além disso, comparar 36-38 com 33-35 confunde doença com método de coleta (cone versus tecido direto)."},
 {type:"do", q:"Faça na sua máquina:", q2:"Montei a tabela de desenho experimental de um dos meus estudos a partir dos nomes das amostras, com <code>condicao</code> como factor e a referência correta no primeiro nível."}
]}
]});

TRILHA.push({n:"6", title:"ggplot2 de verdade", lessons:[

{id:"6.1", min:"12", title:"A gramática dos gráficos", goal:"Entender as três peças de todo gráfico — e parar de decorar receitas.",
blocks:[
 {t:"p",html:"Todo ggplot tem três partes. Sabendo isso, você constrói qualquer gráfico em vez de procurar um exemplo parecido na internet."},
 {t:"table",head:["Peça","Função","Responde"],rows:[
  ["<b>data</b>","<code>ggplot(dados)</code>","De onde vêm os números? (formato long)"],
  ["<b>aes</b>","<code>aes(x =, y =, color =)</code>","Qual coluna vira qual propriedade visual?"],
  ["<b>geom</b>","<code>geom_point()</code>, <code>geom_boxplot()</code>","Que forma os dados tomam?"]
 ]},
 {t:"code",cap:"O esqueleto",code:'library(ggplot2)\n\nggplot(longo, aes(x = amostra, y = log2_int)) +\n  geom_boxplot()'},
 {t:"warn",title:"O + e o |>",html:"<p>Camadas de ggplot se somam com <code class=\"i\">+</code>, não com pipe. O pipe leva os dados <b>até</b> o ggplot; o <code class=\"i\">+</code> empilha camadas <b>dentro</b> dele. E o <code class=\"i\">+</code> tem que ficar no <b>fim</b> da linha, nunca no começo da seguinte — senão o R acha que o comando terminou.</p>"},
 {t:"h",text:"Camadas: cada uma acrescenta"},
 {t:"code",cap:"Empilhando",code:'ggplot(longo, aes(x = amostra, y = log2_int, fill = condicao)) +\n  geom_boxplot(outlier.size = 0.6) +\n  geom_hline(yintercept = median(longo$log2_int, na.rm = TRUE),\n             linetype = "dashed", linewidth = 0.4) +\n  labs(title = "Distribuição de intensidade por amostra",\n       subtitle = "Cerebelo — abundância bruta, log2",\n       x = NULL, y = "log2(intensidade)", fill = "Grupo") +\n  theme_bw(base_size = 11) +\n  theme(axis.text.x = element_text(angle = 45, hjust = 1))'},
 {t:"h",text:"Dentro ou fora do aes(): a confusão número um"},
 {t:"code",cap:"A regra",code:'# DENTRO do aes: a propriedade DEPENDE de uma coluna\nggplot(d, aes(x = a, y = b, color = condicao)) + geom_point()\n\n# FORA do aes: valor fixo, igual para todos os pontos\nggplot(d, aes(x = a, y = b)) + geom_point(color = "red", size = 2)\n\n# ERRO COMUM — isto não pinta de vermelho:\nggplot(d, aes(x = a, y = b, color = "red")) + geom_point()\n# o ggplot cria uma categoria chamada "red" e escolhe a cor dela sozinho'},
 {t:"h",text:"Salvando"},
 {t:"code",cap:"ggsave: sempre com dimensão e dpi explícitos",code:'p <- ggplot(longo, aes(x = amostra, y = log2_int)) + geom_boxplot()\n\nggsave("distribuicao_cerebelo.png", plot = p,\n       width = 9, height = 5, units = "in", dpi = 300)\n\n# Para figura de artigo, vetorial:\nggsave("distribuicao_cerebelo.pdf", plot = p, width = 9, height = 5)'},
 {t:"key",title:"No seu caso",html:"<p>Seus painéis de QC saem em PNG 300 dpi — <code class=\"i\">ggsave</code> com <code class=\"i\">dpi = 300</code> e dimensão fixa é o que garante reprodutibilidade do tamanho da fonte. Sem <code class=\"i\">width</code>/<code class=\"i\">height</code>, o ggplot usa o tamanho da janela do RStudio e a figura sai diferente a cada vez.</p>"},
 {t:"note",title:"Guardar o gráfico num objeto",html:"<p><code class=\"i\">p &lt;- ggplot(...)</code> não desenha nada; só monta. O desenho acontece quando você digita <code class=\"i\">p</code>. Isso é ótimo: dá para montar a lista de gráficos num loop e salvar todos depois — é o que você faz com os 12 volcanos.</p>"}
],
ex:[
 {type:"mc", q:"Você quer que <b>todos</b> os pontos sejam azuis, independentemente dos dados. Onde vai o <code>color = \"blue\"</code>?",
  opts:["Dentro do <code>aes()</code>","Dentro do <code>geom_point()</code>, fora do <code>aes()</code>","No <code>theme()</code>","No <code>labs()</code>"],
  correct:1, why:"Dentro do <code>aes()</code> o ggplot trata <code>\"blue\"</code> como uma categoria de dados e escolhe a cor sozinho — geralmente vermelho, para desespero geral."},
 {type:"code", q:"Escreva o comando ggplot que faz um boxplot de <code>log2_int</code> (eixo y) por <code>amostra</code> (eixo x), a partir da tabela <code>longo</code>.",
  ans:["re:ggplot\\(\\s*longo\\s*,\\s*aes\\(\\s*x\\s*=\\s*amostra\\s*,\\s*y\\s*=\\s*log2_int\\s*\\)\\s*\\)\\s*\\+\\s*geom_boxplot\\(\\s*\\)"],
  ph:"ggplot(longo, aes(...)) + geom_boxplot()",
  why:"Três peças: dados, mapeamento estético e geometria.",
  hint:"<code>ggplot(dados, aes(x = , y = )) + geom_boxplot()</code>"}
]},

{id:"6.2", min:"14", title:"Painel de normalização: antes e depois", goal:"Reproduzir com as próprias mãos o gráfico que decide se a sua normalização funcionou.",
blocks:[
 {t:"p",html:"O gráfico mais importante do QC: distribuição de intensidade por amostra, antes e depois de normalizar. Se as caixas não se alinham depois, a normalização não fez o trabalho."},

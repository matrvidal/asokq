function hoje(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function ontem(){ var d=new Date(Date.now()-864e5); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function tickDia(){
  var h = hoje();
  if(st.dia !== h){
    st.ofensiva = (st.dia === ontem()) ? (st.ofensiva||0)+1 : 1;
    st.dia = h; st.hojeN = 0;
  }
  if(!st.ofensiva) st.ofensiva = 1;
}
function contaCard(){
  tickDia();
  var antes = st.hojeN||0;
  st.hojeN = antes + 1;
  save(); pintaStreak();
  if(antes < META && st.hojeN >= META) toast("Meta do dia batida — " + META + " cards. Tudo daqui é lucro.");
}
function pintaStreak(){
  tickDia();
  var n = st.hojeN||0, pct = Math.min(100, Math.round(100*n/META));
  document.getElementById("streak").innerHTML =
    "<b>&#9679;</b> " + (st.ofensiva||1) + '<span class="s-w">' +
      (st.ofensiva===1?" dia":" dias") + '</span>' +
    ' <span class="s-sep">&nbsp;·&nbsp;</span> ' + n + '<span class="s-w"> hoje</span>' +
    '<span class="goalbar"><i style="width:'+pct+'%"></i></span>';
}

/* agrupa os blocos da aula em cards: um parágrafo curto gruda no bloco seguinte */
function montaCards(l){
  var cards = [], i = 0, bs = l.blocks;
  while(i < bs.length){
    var b = bs[i];
    if(b.t === "h" && i+1 < bs.length){ cards.push([b, bs[i+1]]); i += 2; continue; }
    if(b.t === "p" && b.html.length < 260 && i+1 < bs.length && bs[i+1].t !== "p" && bs[i+1].t !== "h"){
      cards.push([b, bs[i+1]]); i += 2; continue;
    }
    cards.push([b]); i += 1;
  }
  return cards;
}

function renderCards(id){
  var f = FLAT[idx(id)], l = f.l, m = f.m;
  var wrap = document.getElementById("wrap");
  var cards = montaCards(l);
  var total = cards.length + (l.ex ? l.ex.length : 0) + 1;   /* +1 = card final */
  var pos = Math.min(st.card[id] || 0, total - 1);

  wrap.innerHTML = "";

  var head = el('<div class="cardhead"><div class="cardsegs"></div>'+
    '<span class="cardn">'+(pos+1)+'/'+total+'</span></div>');
  var segs = head.querySelector(".cardsegs");
  for(var s = 0; s < total; s++){
    var seg = el('<div class="cseg'+(s <= pos ? " on" : "")+'"></div>');
    segs.appendChild(seg);
  }
  wrap.appendChild(head);

  var card = el('<div class="card"></div>');

  if(pos === 0){
    card.appendChild(el('<div class="crumb">Módulo '+esc(m.n)+' <b>&rsaquo;</b> '+esc(m.title)+'</div>'));
    card.appendChild(el('<h2 class="title">'+esc(l.title)+'</h2>'));
    card.appendChild(el('<div class="goal">'+l.goal+'</div>'));
  }

  if(pos < cards.length){
    card.appendChild(el('<div>'+renderBlocks(cards[pos])+'</div>'));
  } else if(pos < cards.length + (l.ex ? l.ex.length : 0)){
    var ei = pos - cards.length;
    card.appendChild(el('<div class="cardq">Sua vez</div>'));
    card.appendChild(renderEx(l.ex[ei], l.id, ei));
  } else {
    tickDia();
    var i2 = idx(id);
    var prox = i2 < FLAT.length - 1 ? FLAT[i2+1].l : null;
    card.appendChild(el(
      '<div class="win"><div class="win-k">Destravado</div>'+
      '<div class="win-t">'+esc(WINS[id] || l.title)+'</div>'+
      '<div class="win-s">'+(prox ? "Próxima: <b>"+esc(prox.title)+"</b> · "+esc(prox.min)+" min" : "Você chegou ao fim da trilha.")+'</div>'+
      '<div class="win-stats">'+
        '<div><div class="win-n">'+(st.hojeN||0)+'</div><div class="win-l">cards hoje</div></div>'+
        '<div><div class="win-n">'+(st.ofensiva||1)+'</div><div class="win-l">dias seguidos</div></div>'+
        '<div><div class="win-n">'+FLAT.filter(function(x){return st.done[x.l.id];}).length+'</div><div class="win-l">aulas</div></div>'+
      '</div></div>'));
    if(!st.done[id]){ st.done[id] = true; save(); buildSide(); buildSpec(); }

    var nt2 = el('<div class="notes" style="margin-top:30px"><div class="notes-h">Ficou alguma dúvida nesta aula?</div>'+
      '<textarea placeholder="Escreva aqui. Vai direto para o relatório do botão Feedback."></textarea></div>');
    var ta2 = nt2.querySelector("textarea");
    ta2.value = st.notes[l.id] || "";
    ta2.addEventListener("input", function(){ st.notes[l.id] = ta2.value; save(); });
    card.appendChild(nt2);
  }
  wrap.appendChild(card);

  var ultimo = pos === total - 1;
  var btn = el('<button class="next">'+(ultimo ? "Começar a próxima →" : "Continuar")+'</button>');
  btn.addEventListener("click", function(){
    contaCard();
    if(ultimo){
      var i3 = idx(id);
      if(i3 < FLAT.length-1){ st.card[FLAT[i3+1].l.id] = 0; go(FLAT[i3+1].l.id); }
      else toast("Trilha concluída. Manda o feedback.");
    } else {
      st.card[id] = pos + 1; save(); renderCards(id);
      document.querySelector(".main").scrollIntoView({block:"start"}); window.scrollTo(0,0);
    }
  });
  wrap.appendChild(btn);

  var foot = el('<div class="cardfoot"></div>');
  if(pos > 0){
    var vb = el('<button class="mini">← voltar</button>');
    vb.addEventListener("click", function(){ st.card[id] = pos-1; save(); renderCards(id); });
    foot.appendChild(vb);
  }
  var fb2 = el('<button class="mini">ver a aula inteira</button>');
  fb2.addEventListener("click", function(){ st.modo = "full"; save(); go(id); });
  foot.appendChild(fb2);
  wrap.appendChild(foot);

  if(pos === 0 && total > 3){
    wrap.appendChild(el('<div class="cardfoot" style="margin-top:18px">'+
      '<span class="mini" style="text-decoration:none;cursor:default">'+total+' cards · uns '+esc(l.min)+' min · dá para parar em qualquer um</span></div>'));
  }

  bindCopy(wrap);
}

function bindCopy(scope){
  scope.querySelectorAll("[data-copy]").forEach(function(b){
    b.addEventListener("click", function(){ copy(b.getAttribute("data-copy"), "Código copiado — cole no RStudio"); });
  });
}

function go(id){
  st.cur = id; save();
  if(st.modo === "full") renderFull(id); else renderCards(id);
  document.getElementById("btnMode").textContent = (st.modo === "full") ? "Modo foco" : "Aula inteira";
  buildSide(); buildSpec(); pintaStreak();
  document.getElementById("side").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
  document.querySelector(".main").scrollIntoView({block:"start"});
  window.scrollTo(0,0);
}

/* ============ feedback ============ */
function buildFeedback(){
  var doneN = FLAT.filter(function(f){ return st.done[f.l.id]; }).length;
  var out = ["# Feedback do curso R para Proteômica","",
    "Progresso: "+doneN+"/"+FLAT.length+" aulas ("+Math.round(100*doneN/FLAT.length)+"%)",
    "Aula atual: "+st.cur+" — "+FLAT[idx(st.cur)].l.title,
    "Ritmo: "+(st.hojeN||0)+" cards hoje, "+(st.ofensiva||1)+" dia(s) seguidos, modo "+(st.modo==="full"?"aula inteira":"foco"),""];

  var erros = Object.keys(st.tries).filter(function(k){ return st.tries[k]==="erro"||st.tries[k]==="solucao"; });
  if(erros.length){
    out.push("## Exercícios que travaram");
    erros.forEach(function(k){
      var lid = k.split("#")[0];
      var f = FLAT[idx(lid)];
      out.push("- "+lid+" ("+f.l.title+") — "+(st.tries[k]==="solucao"?"precisei ver a solução":"errei"));
    });
    out.push("");
  }
  var ns = Object.keys(st.notes).filter(function(k){ return (st.notes[k]||"").trim(); });
  if(ns.length){
    out.push("## Minhas anotações");
    ns.sort().forEach(function(k){
      out.push("**"+k+" — "+FLAT[idx(k)].l.title+"**"); out.push(st.notes[k].trim()); out.push("");
    });
  }
  if(!erros.length && !ns.length) out.push("_Sem anotações nem erros registrados ainda._");
  return out.join("\n");
}

/* ============ eventos ============ */
document.getElementById("btnFb").addEventListener("click", function(){
  document.getElementById("fbText").value = buildFeedback();
  document.getElementById("modal").classList.add("on");
  document.getElementById("scrim").classList.add("on");
});
function closeModal(){
  document.getElementById("modal").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
  document.getElementById("side").classList.remove("on");
}
document.getElementById("btnCloseFb").addEventListener("click", closeModal);
document.getElementById("scrim").addEventListener("click", closeModal);
document.getElementById("btnCopyFb").addEventListener("click", function(){
  copy(document.getElementById("fbText").value, "Relatório copiado — cole no chat");
});
document.getElementById("btnReset").addEventListener("click", function(){
  if(confirm("Isso apaga progresso, respostas e anotações deste navegador. Continuar?")){
    st = {done:{}, notes:{}, tries:{}, cur:"B.1",
          modo:"card", card:{}, dia:null, hojeN:0, ofensiva:0};
    save(); closeModal(); go("B.1");
  }
});
document.getElementById("menu").addEventListener("click", function(){
  document.getElementById("side").classList.toggle("on");
  document.getElementById("scrim").classList.toggle("on");
});
/* deslizar entre cards no celular */
(function(){
  var x0 = null, y0 = null, ok = false;
  var main = document.querySelector(".main");
  main.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ ok = false; return; }
    /* ignora se o toque começou num bloco que rola na horizontal */
    ok = !e.target.closest("pre, .tblw, textarea, input");
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  main.addEventListener("touchend", function(e){
    if(!ok || x0 === null || st.modo === "full") return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 65 || Math.abs(dy) > 45) return;
    if(dx < 0){ var n = document.querySelector(".next"); if(n) n.click(); }
    else {
      var v = document.querySelector(".cardfoot .mini");
      if(v && v.textContent.indexOf("voltar") >= 0) v.click();
    }
  }, {passive:true});
})();

document.getElementById("btnMode").addEventListener("click", function(){
  st.modo = (st.modo === "full") ? "card" : "full"; save(); go(st.cur);
});
document.addEventListener("keydown", function(e){
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(e.key==="Escape"){ closeModal(); return; }
  if(st.modo !== "full"){
    if(e.key==="ArrowRight" || e.key===" "){
      e.preventDefault();
      var b = document.querySelector(".next"); if(b) b.click();
      return;
    }
    if(e.key==="ArrowLeft"){
      var v = document.querySelector(".cardfoot .mini"); if(v && v.textContent.indexOf("voltar")>=0) v.click();
      return;
    }
    return;
  }
  var i = idx(st.cur);
  if(e.key==="ArrowRight" && i<FLAT.length-1) go(FLAT[i+1].l.id);
  if(e.key==="ArrowLeft"  && i>0)             go(FLAT[i-1].l.id);
});

go(st.cur && FLAT.some(function(f){ return f.l.id === st.cur; }) ? st.cur : "B.1");
})();
</script>

]},

{id:"7.3", min:"16", title:"Filtro e imputação: as decisões que mais mudam o resultado", goal:"Definir critério de filtro por grupo e escolher o método de imputação com base no diagnóstico, não no default.",
blocks:[
 {t:"p",html:"Nenhuma outra etapa muda tanto o número final de significativas. E as duas são decisões suas — o software só executa."},
 {t:"h",text:"Filtro: quantos valores válidos exigir"},
 {t:"code",cap:"Três critérios, do mais frouxo ao mais rigoroso",code:'# A) Presente em pelo menos metade das amostras (global)\nkeep_a <- rowSums(!is.na(mat)) >= ncol(mat) / 2\n\n# B) Completo em pelo menos UM grupo — o critério mais usado\ngrupos <- design$condicao\nvalid_por_grupo <- sapply(levels(grupos), function(g) {\n  rowSums(!is.na(mat[, grupos == g, drop = FALSE]))\n})\nn_por_grupo <- table(grupos)\nkeep_b <- apply(valid_por_grupo, 1, function(v) any(v == n_por_grupo))\n\n# C) Pelo menos 70% de válidos em TODOS os grupos — o seu alvo\nkeep_c <- apply(valid_por_grupo, 1, function(v) all(v >= 0.7 * n_por_grupo))\n\nc(A = sum(keep_a), B = sum(keep_b), C = sum(keep_c))\nmat_f <- mat[keep_c, ]'},
 {t:"key",title:"Por que “por grupo” e não global",html:"<p>Uma proteína presente nas 6 amostras do tratado e ausente nas 6 do controle tem 50% de válidos globalmente — passaria num filtro global de 50%, mas é justamente o caso mais interessante (provável MNAR biológico). Já uma com 6 buracos espalhados aleatoriamente é ruído. O filtro por grupo distingue os dois; o global não.</p>"},
 {t:"h",text:"O diagnóstico antes de imputar"},
 {t:"code",cap:"MNAR deixa assinatura",code:'library(ggplot2); library(dplyr)\n\ndiag <- data.frame(\n  media  = rowMeans(mat, na.rm = TRUE),\n  n_na   = rowSums(is.na(mat))\n)\n\nggplot(diag, aes(x = media, y = n_na)) +\n  geom_point(alpha = 0.4, size = 1) +\n  geom_smooth(method = "loess", se = FALSE) +\n  labs(x = "intensidade média (log2)", y = "nº de valores faltantes") +\n  theme_bw()'},
 {t:"table",head:["O gráfico mostra","Diagnóstico","Imputação"],rows:[
  ["Faltantes concentrados na <b>baixa</b> intensidade","MNAR — limite de detecção","<code>MinProb</code>, <code>man</code>, ou tratar como ausência"],
  ["Faltantes espalhados por toda a faixa","MAR","<code>knn</code>, <code>MLE</code>, <code>bpca</code>"],
  ["Faltantes concentrados numa <b>amostra</b>","Problema de corrida","Investigar a amostra; talvez removê-la"],
  ["Faltantes concentrados num <b>grupo</b> inteiro","MNAR biológico","Não imputar — reportar como presença/ausência"]
 ]},
 {t:"code",cap:"Imputação no DEP2",code:'# Sempre com prefixo explícito — MSnbase/QFeatures também definem impute()\nse_imp <- DEP2::impute(se, fun = "MinProb", q = 0.01)   # MNAR\nse_imp <- DEP2::impute(se, fun = "knn", k = 10)         # MAR\nse_imp <- DEP2::impute(se, fun = "man", shift = 1.8, scale = 0.3)   # manual'},
 {t:"warn",title:"Imputação inventa dado",html:"<p>Todo valor imputado é <b>invenção informada</b>. Duas regras: (1) imputar depois de filtrar, nunca antes — senão você imputa proteína que ia sair de qualquer jeito; (2) reportar quantos valores foram imputados e por qual método. Um resultado que só existe com imputação e some sem ela é frágil, e o revisor vai perguntar.</p>"},
 {t:"key",title:"A sua configuração atual",html:"<p>O <code class=\"i\">run_dep2_batch.R</code> hoje roda <b>sem filtro e sem imputação</b>, com normalização por mediana. Isso é uma escolha conservadora e defensável: nenhum dado inventado, e o limma lida com NA descartando a proteína do contraste. O custo é perder proteínas com poucos buracos. O passo que você tem em vista — filtro de ≥70% de válidos por grupo antes do VSN — é a melhoria natural: recupera poder sem inventar número.</p>"},
 {t:"h",text:"Uma checagem honesta"},
 {t:"code",cap:"O resultado sobrevive sem imputação?",code:'res_sem <- rodar_de(se_filtrado)          # sem imputar\nres_com <- rodar_de(DEP2::impute(se_filtrado, fun = "MinProb"))\n\nsig_sem <- res_sem$name[res_sem$significant]\nsig_com <- res_com$name[res_com$significant]\n\nlength(intersect(sig_sem, sig_com))   # as robustas\nsetdiff(sig_com, sig_sem)             # existem SÓ por causa da imputação'},
 {t:"p",html:"Rodar as duas versões e reportar a interseção é um argumento forte no artigo, e custa uma linha."}
],
ex:[
 {type:"mc", q:"O gráfico de intensidade média × número de faltantes mostra os NAs concentrados nas proteínas de baixa intensidade. Qual imputação?",
  opts:["knn, que estima pelos vizinhos","MinProb ou man, que colocam valores baixos","Média do grupo","Não imputar nunca"],
  correct:1, why:"Esse é o retrato de MNAR: faltou porque está abaixo do limite de detecção. knn estimaria pelos vizinhos e inflaria o valor — enterrando um sinal real de baixa abundância."},
 {type:"code", q:"Escreva o comando que conta, para cada proteína da matriz <code>mat</code>, quantas amostras têm valor válido (não-NA).",
  ans:["rowSums(!is.na(mat))"], ph:"rowSums(...)",
  why:"É a base de qualquer filtro: <code>mat[rowSums(!is.na(mat)) >= 8, ]</code> mantém proteínas com pelo menos 8 valores válidos.",
  hint:"Combine <code>rowSums()</code>, <code>!</code> e <code>is.na()</code>."},
 {type:"do", q:"Faça na sua máquina:", q2:"Gerei o gráfico de intensidade média × nº de faltantes para um dos meus datasets e classifiquei o padrão como MAR ou MNAR."}
]},

{id:"7.4", min:"18", title:"Do t-teste ao limma", goal:"Entender a design matrix, os contrastes e o eBayes — e por que 4 grupos deram resultado diferente de 2.",
blocks:[
 {t:"p",html:"O limma é o motor por baixo do <code class=\"i\">test_diff()</code> do DEP2. Ele faz três coisas: ajusta um modelo linear por proteína, define quais comparações extrair, e <b>modera a variância</b> emprestando informação entre proteínas."},
 {t:"h",text:"Começando pelo t-teste"},
 {t:"code",cap:"Uma proteína, dois grupos",code:'ctrl <- c(11.05, 10.90, 11.20)\nd14  <- c( 9.80,  9.75,  9.60)\n\nt.test(d14, ctrl, var.equal = TRUE)\n# t = -12.3, df = 4, p-value = 0.00025\n\nmean(d14) - mean(ctrl)   # -1.333  <- é isto que vira a coluna _diff'},
 {t:"p",html:"Funciona, mas com n = 3 a estimativa de variância é péssima. Uma proteína que por acaso teve variância pequena vira “altamente significativa”. É esse o problema que o limma resolve."},
 {t:"h",text:"A design matrix"},
 {t:"code",cap:"Traduzindo o desenho para álgebra",code:'library(limma)\n\ncond <- factor(design$condicao, levels = c("Ctrl","D3","D14","D28"))\n\n# Sem intercepto: uma coluna por grupo — mais fácil para contrastes\ndesign_mat <- model.matrix(~ 0 + cond)\ncolnames(design_mat) <- levels(cond)\n\ndesign_mat\n#    Ctrl D3 D14 D28\n# 1     1  0   0   0\n# 2     0  1   0   0\n# ...'},
 {t:"p",html:"Cada linha é uma amostra, cada coluna um grupo. O <code class=\"i\">~ 0 +</code> remove o intercepto: assim cada coeficiente é a <b>média do grupo</b>, e os contrastes ficam explícitos. Com intercepto (<code class=\"i\">~ cond</code>), o primeiro nível vira a referência e os demais coeficientes já são diferenças — daí a importância da ordem dos níveis do factor (aula 2.3)."},
 {t:"h",text:"Contrastes: o que você quer comparar"},
 {t:"code",cap:"makeContrasts",code:'cont <- makeContrasts(\n  Ctrl_vs_D3  = D3  - Ctrl,\n  Ctrl_vs_D14 = D14 - Ctrl,\n  Ctrl_vs_D28 = D28 - Ctrl,\n  D3_vs_D14   = D14 - D3,\n  D3_vs_D28   = D28 - D3,\n  D14_vs_D28  = D28 - D14,\n  levels = design_mat\n)'},
 {t:"p",html:"Seis contrastes de 4 grupos — exatamente os que o <code class=\"i\">test_diff(type = \"all\")</code> gera. E repare no sinal: <code class=\"i\">D14 - Ctrl</code> positivo significa <b>maior em D14</b>. Se você escrever <code class=\"i\">Ctrl - D14</code>, todo o volcano espelha."},
 {t:"code",cap:"O ajuste",code:'fit  <- lmFit(mat_norm, design_mat)\nfit2 <- contrasts.fit(fit, cont)\nfit3 <- eBayes(fit2)\n\ntopTable(fit3, coef = "Ctrl_vs_D14",\n         adjust.method = "BH", number = Inf, sort.by = "P") |> head()\n#            logFC  AveExpr      t   P.Value adj.P.Val\n# Slc25a22   -1.33    10.42  -12.3  0.000025    0.0072'},
 {t:"h",text:"eBayes: a moderação de variância"},
 {t:"p",html:"Este é o coração do limma. Com n = 3, a variância de cada proteína é mal estimada. O eBayes puxa cada estimativa individual na direção da <b>variância típica do conjunto</b> — proteínas com variância absurdamente pequena são penalizadas, as com variância grande são amaciadas. O resultado é um t moderado, com mais graus de liberdade e muito mais estável."},
 {t:"key",title:"Isto explica o seu enigma dos 4 grupos vs 2 grupos",html:"<p>No cerebelo, ~3 proteínas davam significativas comparando os 4 grupos e sumiam comparando só 2, com p ~10× maior no modelo de 2 grupos.</p><p><b>Causa:</b> a variância intragrupo do controle era 0,860 contra 0,088 do grupo D3 — razão de 9,8×. O limma <b>junta</b> (pool) a variância de todos os grupos do modelo. Com 4 grupos, o sigma baixo dos grupos-dia homogêneos “resgatava” o contraste que envolvia o controle bagunçado: graus de liberdade 10,6 (4 grupos) contra ~6 (2 grupos), e p menor.</p><p><b>Conclusão:</b> aquela significância era <b>artificial</b> — o pooled sigma estava mascarando um controle ruim. A solução certa não era escolher entre 2 e 4 grupos, e sim limpar o controle: remover a ctrl_9 e normalizar do raw. Feito isso, os modelos convergem. Removendo a ctrl_9 do cerebelo, os q &lt; 0,05 saltaram de 3 para 30 — a amostra ruim estava inflando a variância e <b>mascarando sinal real</b>.</p>"},
 {t:"warn",title:"A lição transferível",html:"<p>Se dois modelos válidos discordam muito, não escolha o que dá o resultado que você quer. Descubra <b>por que</b> discordam. A discordância é o diagnóstico.</p>"},
 {t:"h",text:"Covariáveis: lote e pareamento"},
 {t:"code",cap:"Quando há efeito técnico conhecido",code:'# Ajustando para lote (efeito aditivo)\ndesign_mat <- model.matrix(~ 0 + cond + lote)\n\n# Amostras pareadas (mesmo paciente, dois tecidos):\n# duplicateCorrelation trata paciente como efeito aleatório\ncorfit <- duplicateCorrelation(mat_norm, design_mat, block = design$paciente)\nfit <- lmFit(mat_norm, design_mat, block = design$paciente,\n             correlation = corfit$consensus)'},
 {t:"note",title:"Relevante para o estudo de pulpite",html:"<p>As amostras 33–38 são pools dos mesmos pacientes de 1–32. Se algum dia você quiser usar as duas fontes num modelo, é um caso de <b>pareamento</b>, não de grupos independentes — e a análise principal continua sendo a saliva 1–32 (n = 16 vs 16), que é limpa e tem poder.</p>"}
],
ex:[
 {type:"code", q:"Escreva a design matrix sem intercepto para o factor <code>cond</code>.",
  ans:["model.matrix(~ 0 + cond)","model.matrix(~0+cond)","design_mat <- model.matrix(~ 0 + cond)"],
  ph:"model.matrix(~ 0 + cond)",
  why:"Sem intercepto, cada coluna é um grupo e cada coeficiente é a média do grupo — o formato que <code>makeContrasts</code> espera.",
  hint:"Fórmula com <code>~ 0 +</code> na frente da variável."},
 {type:"mc", q:"Por que o eBayes é especialmente importante em proteômica?",
  opts:["Porque acelera o cálculo","Porque com n pequeno (3 a 6) a variância por proteína é mal estimada, e ele estabiliza emprestando informação de todas as proteínas","Porque corrige múltiplos testes","Porque normaliza os dados"],
  correct:1, why:"É o ganho central do limma sobre t-testes independentes. Correção de múltiplos testes é outra etapa (aula 7.5), e normalização vem antes."},
 {type:"mc", q:"O contraste é <code>D14 - Ctrl</code> e a proteína tem <code>diff = -1.33</code>. O que isso significa?",
  opts:["Ela está 1,33× menor em D14","Ela está <b>menor em D14</b> que no Ctrl, por um fator de 2^1.33 ≈ 2,5×","Ela está maior em D14","O sinal não tem interpretação"],
  correct:1, why:"Negativo = menor no primeiro termo do contraste (D14). E o valor está em log2, então o fator é 2^1.33 ≈ 2,5×, não 1,33×."}
]},

{id:"7.5", min:"14", title:"p, q e correção de múltiplos testes", goal:"Entender por que 70 p-valores brutos viram 8 significativas — e por que BH é a escolha certa.",
blocks:[
 {t:"p",html:"Você testa 290 proteínas. Com α = 0,05, mesmo que <b>nenhuma</b> mude de verdade, cerca de 14 dariam p &lt; 0,05 por acaso. Correção de múltiplos testes é o que separa achado de sorte."},
 {t:"code",cap:"A demonstração",code:'set.seed(1)\n# 290 proteínas SEM nenhuma diferença real\np_falso <- replicate(290, t.test(rnorm(3), rnorm(3))$p.value)\n\nsum(p_falso < 0.05)                                  # ~14 "significativas"\nsum(p.adjust(p_falso, method = "BH") < 0.05)         # 0 — correto'},
 {t:"h",text:"FWER vs FDR"},
 {t:"table",head:["","Bonferroni (FWER)","Benjamini-Hochberg (FDR)"],rows:[
  ["Controla","Probabilidade de <b>qualquer</b> falso positivo","<b>Proporção</b> esperada de falsos entre os positivos"],
  ["Rigor","Muito conservador","Equilibrado"],
  ["Interpretação de q = 0,05","5% de chance de haver um erro em toda a lista","5% da sua lista de significativas são falsos"],
  ["Uso em ômicas","Raro","<b>Padrão da área</b>"]
 ]},
 {t:"code",cap:"Aplicando",code:'res$p_adj <- p.adjust(res$p_val, method = "BH")\n\n# Métodos disponíveis:\np.adjust.methods\n# "holm" "hochberg" "hommel" "bonferroni" "BH" "BY" "fdr" "none"\n# ("fdr" é sinônimo de "BH")'},
 {t:"h",text:"Os quatro fdr.type do DEP2"},
 {t:"table",head:["fdr.type","O que faz","Comportamento"],rows:[
  ["<code>\"BH\"</code>","Benjamini-Hochberg clássico","Padrão da área, estável com n pequeno"],
  ["<code>\"Storey's qvalue\"</code>","Estima π₀ (proporção de nulas verdadeiras)","Mais poder se π₀ &lt; 1; precisa de muitos testes"],
  ["<code>\"Strimmer's qvalue(p)\"</code>","fdrtool sobre os p-valores","<b>Anti-conservador com n pequeno</b>"],
  ["<code>\"Strimmer's qvalue(t)\"</code>","fdrtool sobre as estatísticas t","Idem"]
 ]},
 {t:"key",title:"O caso que você viveu",html:"<p>Você estranhou 30 proteínas diferenciais no cerebelo. O diagnóstico mostrou que quase todas vinham de <b>um único contraste</b> (D3_vs_D14), e o culpado era o <code class=\"i\">Strimmer's qvalue(p)</code>: o <code class=\"i\">fdrtool</code> estima η₀ baixo demais quando há poucos testes, e fica anti-conservador.</p><p>No contraste D3_vs_D14: Strimmer dava 30 com q &lt; 0,05, BH dava <b>8</b>. Na união dos 6 contrastes: Strimmer 30 (23 com FC), BH <b>8</b>. O BH bateu com a sua análise manual e é o padrão da área — por isso o <code class=\"i\">run_dep2_batch.R</code> passou a usar <code class=\"i\">FDR_TYPE = \"BH\"</code>.</p><p><b>Resultado final:</b> cerebelo 8, hipocampo 0, medula 0. Contra 70/18/60 com p bruto — a diferença é exatamente o preço dos múltiplos testes.</p>"},
 {t:"h",text:"Quando o q dá zero significativas"},
 {t:"p",html:"Hipocampo e medula com 0 é um resultado, não uma falha. As opções honestas:"},
 {t:"list",items:[
  "<b>Reportar 0</b> e discutir poder estatístico. Com n = 3 e ~290 proteínas, poder para efeitos moderados é baixo.",
  "<b>Reportar p bruto explicitamente rotulado</b> como exploratório, nunca como confirmado.",
  "<b>Reduzir o número de testes</b> com hipótese a priori: testar só um contraste, ou só um conjunto de proteínas de interesse. Menos testes, menos penalidade.",
  "<b>Melhorar o dado</b>: mais réplicas, melhor normalização, remover amostras ruins — foi o que multiplicou por 4 o achado no cerebelo.",
  "<b>Análise de conjuntos</b> (GSEA, enriquecimento), que ganha poder ao agregar proteínas relacionadas."
 ]},
 {t:"warn",title:"O que não fazer",html:"<p>Escolher o método de FDR que dá mais significativas <b>depois</b> de ver os resultados. Isso é p-hacking, ainda que involuntário. Decida o método antes — e se mudar, mude por razão metodológica (como você fez: Strimmer é anti-conservador com n pequeno) e registre a razão no script.</p>"},
 {t:"code",cap:"Documentando a decisão no script",code:'# FDR: BH.\n# Strimmer\'s qvalue(p) foi testado e descartado: com n=3 o fdrtool\n# estima eta0 baixo e fica anti-conservador (30 vs 8 no contraste\n# D3_vs_D14). BH bate com a análise manual e é o padrão da área.\nFDR_TYPE <- "BH"'}
],
ex:[
 {type:"code", q:"Escreva o comando que corrige o vetor de p-valores <code>p_val</code> pelo método de Benjamini-Hochberg.",
  ans:["p.adjust(p_val, method = \"BH\")","p.adjust(p_val, \"BH\")","p.adjust(p_val, method = \"fdr\")"],
  ph:'p.adjust(p_val, method = "BH")',
  why:'<code>"fdr"</code> é sinônimo de <code>"BH"</code> no R.',
  hint:"<code>p.adjust()</code> com o argumento <code>method</code>."},
 {type:"mc", q:"Você tem 60 proteínas com p &lt; 0,05 e nenhuma com q &lt; 0,05. Qual a leitura mais honesta?",
  opts:["Há 60 proteínas diferenciais","Não há evidência que sobreviva à correção; 60 é compatível com o esperado ao acaso em ~290 testes","O teste está errado","Deve-se usar um método de FDR menos conservador"],
  correct:1, why:"Com 290 testes e α = 0,05, cerca de 14 falsos positivos são esperados — e o BH não achou estrutura suficiente para separar sinal de ruído. Trocar de método para conseguir significância é p-hacking."},
 {type:"mc", q:"Por que o Strimmer's qvalue se mostrou anti-conservador nos seus dados?",
  opts:["Porque usa Bonferroni por dentro","Porque o fdrtool estima π₀ (proporção de hipóteses nulas) baixo demais quando há poucos testes","Porque ignora o fold change","Porque só funciona com dados normalizados"],
  correct:1, why:"Métodos que estimam π₀ ganham poder quando há muitos testes e sinal claro. Com poucas centenas de proteínas e n = 3, a estimativa é instável e o q sai otimista demais."}
]}
]});

TRILHA.push({n:"8", title:"DEP2 e protti, agora entendendo cada linha", lessons:[

{id:"8.1", min:"16", title:"Anatomia do pipeline DEP2", goal:"Ler o seu run_dep2_batch.R função por função, sabendo o que cada uma faz e o que ela decide por você.",
blocks:[
 {t:"p",html:"O DEP2 é uma sequência de funções, cada uma transformando o objeto <code class=\"i\">se</code>. Você já rodou todas — agora vai saber o que acontece dentro."},
 {t:"code",cap:"O pipeline inteiro",code:'library(DEP2)\n\n# 1) Ler\ndados <- read.delim("input_dep2_cerebelo_raw.txt", check.names = FALSE)\n\n# 2) Nomes únicos por proteína\ndados_u <- make_unique(dados, names = "Gene", ids = "Protein.ID")\n\n# 3) Montar o SummarizedExperiment\ncols <- grep("^(Ctrl|D3|D14|D28)_", names(dados_u))\nse <- make_se_parse(dados_u, columns = cols, mode = "delim")\n\n# 4) Filtro (opcional)\n# se <- filter_missval(se, thr = 1)\n\n# 5) Normalização\nse <- normalize_vsn(se)          # ou median-centering na mão\n\n# 6) Imputação (opcional)\n# se <- DEP2::impute(se, fun = "MinProb", q = 0.01)\n\n# 7) Teste\nse <- test_diff(se, type = "all", fdr.type = "BH")\n\n# 8) Chamada de significância\nse <- add_rejections(se, alpha = 0.05, lfc = log2(1.5))'},
 {t:"h",text:"O que cada passo faz — e decide"},
 {t:"table",head:["Função","Faz","Decide por você"],rows:[
  ["<code>make_unique</code>","Resolve nomes duplicados de gene","Como desempatar. Sem coluna Gene, use <code>name = \"Protein.ID\"</code>"],
  ["<code>make_se_parse</code>","Monta assay + rowData + colData","Deriva condição e réplica <b>do nome da coluna</b>"],
  ["<code>filter_missval</code>","Remove proteínas com muitos NA","O limiar <code>thr</code>: nº máximo de grupos com faltantes"],
  ["<code>normalize_vsn</code>","Aplica VSN","Ajuste por máxima verossimilhança, sem parâmetro seu"],
  ["<code>impute</code>","Preenche NA","O método — a decisão de maior impacto"],
  ["<code>test_diff</code>","limma: design, contrastes, eBayes","Quais contrastes (<code>type</code>) e qual FDR (<code>fdr.type</code>)"],
  ["<code>add_rejections</code>","Marca <code>_significant</code>","Os cortes <code>alpha</code> e <code>lfc</code>"]
 ]},
 {t:"h",text:"make_se_parse: onde mora a pegadinha"},
 {t:"warn",title:"Confirmado nos seus dados",html:"<p>Com <code class=\"i\">mode = \"delim\"</code>, o parser quebra o nome no delimitador e assume que o <b>primeiro token é a condição</b>. Logo <code class=\"i\">ctrl_all_9</code> vira condition = <code class=\"i\">ctrl</code>, replicate = <code class=\"i\">all_9</code>. E nome começando com dígito ganha <code class=\"i\">X</code> (<code class=\"i\">X3dias</code>), exigindo o <code class=\"i\">recode</code> para <code class=\"i\">Ctrl/D3/D14/D28</code>.</p><p>Confira <b>sempre</b> logo depois:</p>"},
 {t:"code",cap:"A conferência de 10 segundos",code:'SummarizedExperiment::colData(se)\ntable(SummarizedExperiment::colData(se)$condition)\n# Ctrl D3 D14 D28\n#    3  3   3   3    <- se não for isto, pare e corrija os nomes'},
 {t:"h",text:"Escolhendo os contrastes"},
 {t:"code",cap:"type",code:'test_diff(se, type = "all")                          # todos contra todos (6, com 4 grupos)\ntest_diff(se, type = "control", control = "Ctrl")    # todos contra o controle (3)\ntest_diff(se, type = "manual",\n          test = c("D14_vs_Ctrl", "D28_vs_Ctrl"))     # só os que interessam'},
 {t:"key",title:"Menos contrastes, mais poder",html:"<p><code class=\"i\">type = \"all\"</code> gera 6 contrastes de 4 grupos. Se a sua pergunta é “o que muda ao longo do tempo <b>em relação ao controle</b>”, <code class=\"i\">type = \"control\"</code> gera 3 — metade dos testes, menos penalidade de FDR, mais poder. Isso é ganho estatístico grátis, obtido só por fazer a pergunta certa.</p>"},
 {t:"h",text:"add_rejections: o corte"},
 {t:"code",cap:"Os dois critérios",code:'se <- add_rejections(se, alpha = 0.05, lfc = log2(1.5))\n\n# Cria, para cada contraste:\n#   <contraste>_significant  = p.adj < alpha & abs(diff) > lfc\n# e a coluna global:\n#   significant              = TRUE em pelo menos um contraste'},
 {t:"note",title:"Onde ler o resultado",html:"<p>Tudo em <code class=\"i\">rowData(se)</code>. Um <code class=\"i\">as.data.frame(rowData(se))</code> e você tem a tabela completa — é o que a próxima aula faz.</p>"}
],
ex:[
 {type:"mc", q:"Seu <code>colData(se)</code> mostra condition com valores <code>ctrl</code>, <code>X3dias</code>, <code>X14dias</code>, <code>X28dias</code>. O que fazer?",
  opts:["Rodar assim mesmo, os nomes não importam","Corrigir os níveis com <code>recode</code>/<code>factor</code> antes de testar, garantindo Ctrl como referência","Reinstalar o DEP2","Usar <code>mode = \"char\"</code>"],
  correct:1, why:"O X vem de nome começar com dígito. Além da estética, a ordem dos níveis define a referência e a direção do fold change — corrija antes de testar."},
 {type:"code", q:"Escreva a chamada do <code>add_rejections</code> com alfa 0,05 e corte de fold change de 1,5×.",
  ans:["add_rejections(se, alpha = 0.05, lfc = log2(1.5))","se <- add_rejections(se, alpha = 0.05, lfc = log2(1.5))","add_rejections(se, alpha = 0.05, lfc = 0.585)"],
  ph:"add_rejections(se, alpha = ..., lfc = ...)",
  why:"Escrever <code>log2(1.5)</code> em vez de <code>0.585</code> deixa a intenção explícita para quem lê o script.",
  hint:"O <code>lfc</code> está em log2 — converta 1,5×."},
 {type:"mc", q:"Sua pergunta é 'o que muda em cada tempo em relação ao controle'. Qual <code>type</code> usar?",
  opts:['<code>"all"</code> — sempre melhor ter tudo','<code>"control"</code> com <code>control = "Ctrl"</code>','<code>"manual"</code> listando os 6','Tanto faz'],
  correct:1, why:"3 contrastes em vez de 6 = metade dos testes = penalidade de FDR menor = mais poder. Testar o que não interessa custa significância no que interessa."}
]},

{id:"8.2", min:"14", title:"Extrair a tabela de resultados", goal:"Sair do objeto se com a tabela pronta para o pesquisador — sem depender de função de exportação pronta.",
blocks:[
 {t:"p",html:"O <code class=\"i\">rowData</code> guarda tudo, mas em formato largo e com nomes longos. Montar a tabela final é um exercício de <code class=\"i\">grep</code> + <code class=\"i\">select</code>."},
 {t:"code",cap:"Vendo o que existe",code:'library(SummarizedExperiment)\n\nrd <- as.data.frame(rowData(se))\nnames(rd)\n# "name" "ID" "Ctrl_vs_D14_p.val" "Ctrl_vs_D14_p.adj" "Ctrl_vs_D14_diff"\n# "Ctrl_vs_D14_CI.L" "Ctrl_vs_D14_CI.R" "Ctrl_vs_D14_significant" ...\n\n# Quais contrastes foram calculados:\nunique(sub("_(p.val|p.adj|diff|CI.L|CI.R|significant)$", "",\n           grep("_p.val$|_diff$", names(rd), value = TRUE)))'},
 {t:"code",cap:"Tabela de UM contraste",code:'library(dplyr)\n\ntabela_contraste <- function(se, contraste, alpha = 0.05, lfc = log2(1.5)) {\n  rd <- as.data.frame(SummarizedExperiment::rowData(se))\n  m  <- as.data.frame(SummarizedExperiment::assay(se))\n\n  out <- data.frame(\n    Gene        = rd$name,\n    UniProt_ID  = rd$ID,\n    log2FC      = round(rd[[paste0(contraste, "_diff")]],  4),\n    p_value     = signif(rd[[paste0(contraste, "_p.val")]], 3),\n    q_value     = signif(rd[[paste0(contraste, "_p.adj")]], 3)\n  )\n  out$p_significant <- ifelse(!is.na(out$p_value) & out$p_value < alpha &\n                              abs(out$log2FC) > lfc, "x", "")\n  out$q_significant <- ifelse(!is.na(out$q_value) & out$q_value < alpha &\n                              abs(out$log2FC) > lfc, "x", "")\n\n  cbind(out, round(m, 4))\n}\n\ntab <- tabela_contraste(se, "Ctrl_vs_D14")\nhead(tab)'},
 {t:"key",title:"É o formato que você já entrega",html:"<p>Colunas <code class=\"i\">Gene</code>, <code class=\"i\">UniProt ID</code>, <i>p-value significant</i>, <i>q-value significant</i>, e as intensidades log2-normalizadas arredondadas em 4 casas, sob a linha-título “Normalized Log2 Intensities”. Agora essa tabela é uma função sua, que você adapta a qualquer estudo.</p>"},
 {t:"h",text:"Só as amostras dos dois grupos comparados"},
 {t:"code",cap:"O flag so_grupos_do_par",code:'amostras_do_par <- function(se, contraste) {\n  grupos <- strsplit(contraste, "_vs_", fixed = TRUE)[[1]]\n  cd <- SummarizedExperiment::colData(se)\n  rownames(cd)[cd$condition %in% grupos]\n}\n\namostras_do_par(se, "Ctrl_vs_D14")\n# "Ctrl_1" "Ctrl_5" "D14_3" "D14_7" "D14_11"'},
 {t:"h",text:"Uma tabela por contraste, de uma vez"},
 {t:"code",cap:"Gerando as 6",code:'contrastes <- c("Ctrl_vs_D3","Ctrl_vs_D14","Ctrl_vs_D28",\n                "D3_vs_D14","D3_vs_D28","D14_vs_D28")\n\ndir.create("tabelas", showWarnings = FALSE)\n\nfor (ct in contrastes) {\n  tab <- tabela_contraste(se, ct)\n  write.csv(tab, file.path("tabelas", paste0("tabela_cerebelo_", ct, ".csv")),\n            row.names = FALSE, fileEncoding = "UTF-8")\n}\n\nlist.files("tabelas")'},
 {t:"h",text:"O resumo que você olha primeiro"},
 {t:"code",cap:"Quantas significativas por contraste",code:'sapply(contrastes, function(ct) {\n  s <- rd[[paste0(ct, "_significant")]]\n  sum(s, na.rm = TRUE)\n})\n# Ctrl_vs_D3 Ctrl_vs_D14 Ctrl_vs_D28 D3_vs_D14 D3_vs_D28 D14_vs_D28\n#          0           2           1         5         0          0'},
 {t:"warn",title:"Um contraste concentrando quase tudo é sinal de alerta",html:"<p>Foi assim que você achou o problema do Strimmer: 30 significativas, quase todas em D3_vs_D14. Quando um contraste domina, investigue — pode ser biologia real, mas também pode ser variância mal estimada num grupo específico.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que transforma o <code>rowData</code> do objeto <code>se</code> num data.frame chamado <code>rd</code>.",
  ans:["rd <- as.data.frame(rowData(se))","as.data.frame(rowData(se))","rd <- as.data.frame(SummarizedExperiment::rowData(se))"],
  ph:"rd <- as.data.frame(rowData(se))",
  why:"<code>rowData</code> devolve um DataFrame do S4; converter para data.frame comum deixa dplyr e write.csv funcionarem.",
  hint:"<code>as.data.frame()</code> em volta de <code>rowData()</code>."},
 {type:"code", q:"Escreva a expressão que extrai a coluna de q-valor do contraste guardado na variável <code>ct</code>, a partir do data.frame <code>rd</code>.",
  ans:["rd[[paste0(ct, \"_p.adj\")]]","rd[[paste0(ct,\"_p.adj\")]]"],
  ph:'rd[[paste0(ct, "_p.adj")]]',
  why:"<code>paste0</code> monta o nome e o colchete duplo aceita nome dinâmico — <code>rd$ct</code> não funcionaria, procuraria uma coluna literalmente chamada 'ct'.",
  hint:"Monte o nome com <code>paste0()</code> e acesse com <code>[[ ]]</code>."}
]},

{id:"8.3", min:"13", title:"protti: QC em formato longo", goal:"Usar o protti para o que ele é bom — e saber como preparar o dado para ele.",
blocks:[
 {t:"p",html:"O protti é a caixa de ferramentas de QC. Ele trabalha em <b>formato longo</b> e cobre desde o nível de precursor até o de proteína. Você já usou CVs, PCA, medianas e intensidades por corrida."},
 {t:"code",cap:"Preparando o dado",code:'library(protti); library(dplyr); library(tidyr)\n\nlongo <- prog_log |>\n  pivot_longer(cols = Ctrl_1:D28_12,\n               names_to = "sample", values_to = "intensity_log2") |>\n  mutate(condition = sub("_[0-9]+$", "", sample))\n\nhead(longo, 3)\n#   accession  sample  intensity_log2  condition\n# 1    Q8R5L1  Ctrl_1           11.05       Ctrl'},
 {t:"h",text:"As funções de QC"},
 {t:"code",cap:"Os painéis principais",code:'# Nº de identificações por corrida\nqc_ids(longo, sample = sample, grouping = accession,\n       intensity = intensity_log2, condition = condition, plot = TRUE)\n\n# Distribuição de intensidade\nqc_intensity_distribution(longo, sample = sample, grouping = accession,\n                          intensity_log2 = intensity_log2,\n                          plot_style = "boxplot")\n\n# Mediana por corrida\nqc_median_intensities(longo, sample = sample, grouping = accession,\n                      intensity = intensity_log2)\n\n# CV intragrupo\nqc_cvs(longo, grouping = accession, condition = condition,\n       intensity = intensity_log2, plot = TRUE)\n\n# PCA\nqc_pca(longo, sample = sample, grouping = accession,\n       intensity = intensity_log2, condition = condition)'},
 {t:"warn",title:"Confira a assinatura",html:"<p>Os argumentos do protti mudam entre versões — alguns querem <code class=\"i\">intensity</code>, outros <code class=\"i\">intensity_log2</code>. Rode <code class=\"i\">?qc_cvs</code> antes e confirme. Isso vale para qualquer pacote em evolução: a documentação instalada é a fonte da verdade, não o exemplo da internet.</p>"},
 {t:"h",text:"Os gráficos são ggplot"},
 {t:"code",cap:"Customizando a saída do protti",code:'p <- qc_cvs(longo, grouping = accession, condition = condition,\n            intensity = intensity_log2, plot = TRUE)\n\np +\n  labs(title = "Cerebelo — CV intragrupo") +\n  coord_cartesian(ylim = c(0, 60)) +\n  tema_prot\n\nggsave("cv_cerebelo.png", p, width = 7, height = 5, dpi = 300)'},
 {t:"p",html:"Como as funções devolvem objetos ggplot, tudo do módulo 6 se aplica: você acrescenta camadas, troca o tema e salva do seu jeito. Não precisa aceitar o visual padrão."},
 {t:"h",text:"O caminho completo do protti"},
 {t:"code",cap:"Análise diferencial dentro do protti",code:'res <- longo |>\n  normalise(sample = sample, intensity_log2 = intensity_log2, method = "median") |>\n  assign_missingness(sample = sample, condition = condition,\n                     grouping = accession, intensity = normalised_intensity_log2,\n                     ref_condition = "Ctrl") |>\n  calculate_diff_abundance(sample = sample, condition = condition,\n                           grouping = accession,\n                           intensity_log2 = normalised_intensity_log2,\n                           comparison = comparison, method = "moderated_t-test")\n\nvolcano_plot(res, grouping = accession, log2FC = diff,\n             significance = adj_pval, method = "target")'},
 {t:"key",title:"DEP2 ou protti?",html:"<p>Os dois usam limma por baixo e chegam a resultados equivalentes. A diferença é ergonômica: <b>DEP2</b> tem o Shiny e o objeto <code class=\"i\">se</code>, bom para o fluxo padrão; <b>protti</b> é modular e em formato longo, bom para QC detalhado e para casos fora do padrão. Escolha um como principal e use o outro para conferir — resultados que batem nos dois são resultados em que você confia.</p>"},
 {t:"warn",title:"Não carregue os dois na mesma sessão sem cuidado",html:"<p>É a fonte do seu problema com <code class=\"i\">impute()</code>. Se precisar dos dois, use prefixo explícito (<code class=\"i\">DEP2::</code>, <code class=\"i\">protti::</code>) em <b>tudo</b>, ou rode em scripts separados.</p>"}
],
ex:[
 {type:"mc", q:"Por que o protti precisa dos dados em formato longo?",
  opts:["Porque é mais rápido","Porque as funções recebem os nomes das colunas (amostra, agrupamento, intensidade) como argumentos — o que exige uma coluna para cada papel","Porque não aceita matriz","Porque usa ggplot"],
  correct:1, why:"É a mesma lógica do ggplot: cada papel (amostra, proteína, intensidade, condição) precisa ser uma coluna própria para poder ser referenciado por nome."},
 {type:"do", q:"Faça na sua máquina:", q2:"Rodei <code>?qc_cvs</code> e conferi a assinatura exata na versão do protti que tenho instalada."}
]},

{id:"8.4", min:"12", title:"Conflitos de pacote e sessão limpa", goal:"Diagnosticar e prevenir o problema que mais te fez perder tempo.",
blocks:[
 {t:"p",html:"Quando dois pacotes definem a mesma função, o último carregado vence. Em proteômica isso é frequente: <code class=\"i\">impute</code>, <code class=\"i\">normalize</code>, <code class=\"i\">filter</code>, <code class=\"i\">select</code>, <code class=\"i\">count</code> são definidos em vários lugares."},
 {t:"code",cap:"O diagnóstico",code:'find("impute")\n# [1] "package:MsCoreUtils" "package:DEP2"\n# o primeiro da lista é o que responde\n\nconflicts(detail = TRUE)$`package:DEP2`\n\nsearch()        # ordem dos pacotes carregados\nsessionInfo()   # versões e ordem'},
 {t:"table",head:["Função","Também definida em"],rows:[
  ["<code>impute</code>","DEP2, MSnbase, QFeatures, MsCoreUtils, impute"],
  ["<code>filter</code>","dplyr, stats"],
  ["<code>select</code>","dplyr, MASS, AnnotationDbi"],
  ["<code>count</code>","dplyr, plyr, matrixStats"],
  ["<code>normalize</code>","DEP2, BiocGenerics, protti (<code>normalise</code>)"],
  ["<code>rename</code>","dplyr, plyr, S4Vectors"]
 ]},
 {t:"h",text:"Três defesas"},
 {t:"code",cap:"1) Prefixo explícito — o mais seguro",code:'DEP2::impute(se, fun = "MinProb")\ndplyr::filter(dados, p < 0.05)\nstats::filter(x, rep(1/3, 3))'},
 {t:"code",cap:"2) O pacote conflicted",code:'# install.packages("conflicted")\nlibrary(conflicted)\n\n# Agora usar uma função ambígua dá ERRO em vez de silêncio:\n# Error: [conflicted] impute found in 2 packages.\n\n# Você declara a preferência uma vez, no topo do script:\nconflicts_prefer(DEP2::impute)\nconflicts_prefer(dplyr::filter)'},
 {t:"code",cap:"3) Sessão limpa via Rscript",code:'# No cmd/PowerShell, não no console do R:\n# "C:/Program Files/R/R-4.6.0/bin/Rscript.exe" run_dep2_batch.R\n\n# Dentro do RStudio, reinicie a sessão: Ctrl+Shift+F10'},
 {t:"key",title:"O seu caso, explicado",html:"<p>O erro <i>“Please specify an imputation method”</i> aparece quando <code class=\"i\">MSnbase</code>/<code class=\"i\">QFeatures</code>/<code class=\"i\">MsCoreUtils</code> foi carregado <b>depois</b> do DEP2 — típico de uma sessão que já tinha rodado o DEP2shiny. O <code class=\"i\">impute()</code> capturado não conhece o argumento <code class=\"i\">fun</code> e reclama que falta o método. Por isso o <code class=\"i\">qc_proteomica.R</code> usa <code class=\"i\">DEP2::</code> em <b>todas</b> as chamadas, e roda via Rscript.</p>"},
 {t:"h",text:"O cabeçalho defensivo"},
 {t:"code",cap:"Como começar todo script de análise",code:'# ---- qc_proteomica.R ----------------------------------------------\n# Rodar em sessão LIMPA:\n#   "C:/Program Files/R/R-4.6.0/bin/Rscript.exe" qc_proteomica.R\n\nsuppressPackageStartupMessages({\n  library(dplyr)\n  library(tidyr)\n  library(ggplot2)\n  library(SummarizedExperiment)\n})\n# DEP2 NÃO é carregado com library() — chamado sempre como DEP2::\n\ncat("R:", R.version.string, "\\n")\ncat("Pacotes:\\n"); print(sessionInfo()$otherPkgs |> names())'},
 {t:"h",text:"Reprodutibilidade de versão"},
 {t:"code",cap:"Registrando o ambiente",code:'sessionInfo()                     # imprima ao fim de todo script\nwriteLines(capture.output(sessionInfo()), "sessionInfo.txt")\n\npackageVersion("DEP2")\npackageVersion("limma")'},
 {t:"note",title:"Por que salvar o sessionInfo",html:"<p>Daqui a um ano, quando o resultado não reproduzir, a primeira pergunta será “qual versão dos pacotes?”. Um arquivo de três linhas responde. É o custo mais baixo com maior retorno em toda a análise.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que mostra todos os pacotes carregados que definem uma função chamada <code>impute</code>.",
  ans:["find(\"impute\")"], ph:'find("impute")',
  why:"O primeiro da lista é o que responde. Se não for o DEP2, use prefixo explícito.",
  hint:"É uma função de quatro letras que procura objetos no caminho de busca."},
 {type:"mc", q:"Qual a defesa mais robusta contra conflito de pacote num script de produção?",
  opts:["Carregar os pacotes na ordem certa","Usar prefixo explícito <code>pacote::funcao()</code> nas chamadas críticas","Não usar library()","Reiniciar o R sempre"],
  correct:1, why:"Ordem de carregamento é frágil — basta alguém acrescentar um <code>library()</code> depois. O prefixo explícito não depende de contexto nenhum e ainda documenta de onde a função vem."}
]}
]});

TRILHA.push({n:"9", title:"Virar autor dos seus scripts", lessons:[

{id:"9.1", min:"14", title:"Escrever a sua própria função", goal:"Transformar o bloco que você copia e cola em uma função com nome, argumentos e default.",
blocks:[
 {t:"p",html:"Regra prática: se você copiou o mesmo bloco de código três vezes, ele deveria ser uma função. O ganho não é digitar menos — é ter <b>um único lugar para corrigir</b>."},
 {t:"code",cap:"Anatomia",code:'nome_da_funcao <- function(argumento1, argumento2 = valor_padrao) {\n  # corpo: faz o trabalho\n  resultado <- argumento1 + argumento2\n  resultado          # a última expressão é o valor devolvido\n}\n\nnome_da_funcao(10, 5)   # 15\nnome_da_funcao(10)      # usa o default'},
 {t:"h",text:"Um exemplo real: normalizar pela mediana"},
 {t:"code",cap:"De bloco copiado a função",code:'normaliza_mediana <- function(mat, recentrar = TRUE) {\n  med <- apply(mat, 2, median, na.rm = TRUE)\n  out <- sweep(mat, 2, med, FUN = "-")\n  if (recentrar) out <- out + median(med, na.rm = TRUE)\n  out\n}\n\nmat_norm <- normaliza_mediana(mat_log2)\nmat_c    <- normaliza_mediana(mat_log2, recentrar = FALSE)'},
 {t:"h",text:"Validar a entrada"},
 {t:"code",cap:"Falhar cedo, com mensagem útil",code:'normaliza_mediana <- function(mat, recentrar = TRUE) {\n  if (!is.matrix(mat))\n    stop("mat precisa ser uma matriz. Use as.matrix() antes.")\n  if (!is.numeric(mat))\n    stop("mat precisa ser numérica — alguma coluna de texto entrou na conversão?")\n  if (any(is.infinite(mat)))\n    warning("Há valores infinitos (log2 de zero?). Converta zeros em NA antes.")\n\n  med <- apply(mat, 2, median, na.rm = TRUE)\n  out <- sweep(mat, 2, med, FUN = "-")\n  if (recentrar) out <- out + median(med, na.rm = TRUE)\n  out\n}'},
 {t:"key",title:"Por que isso vale ouro",html:"<p>Você mesmo achou um bug assim: em <code class=\"i\">fazer_plot</code>, a <code class=\"i\">variab_long</code> era chamada sem repassar o argumento <code class=\"i\">metric</code> — e o gráfico de CV saía idêntico ao de variância. Uma verificação de entrada (<i>metric precisa ser \"cv\" ou \"var\"</i>) teria dado erro imediato em vez de produzir um gráfico errado que parecia certo. <b>Erro barulhento é melhor que resultado silenciosamente errado.</b></p>"},
 {t:"h",text:"Escopo: o que a função enxerga"},
 {t:"code",cap:"A regra",code:'x <- 10\n\nf <- function() {\n  x <- 99      # cria um x LOCAL, não mexe no de fora\n  x\n}\n\nf()   # 99\nx     # 10 — intacto'},
 {t:"warn",title:"O perigo do inverso",html:"<p>Uma função <b>lê</b> variáveis de fora se não as encontrar dentro. Isso faz código funcionar por acidente — e quebrar quando você roda em sessão limpa. Regra: <b>tudo que a função usa deve entrar por argumento</b>. Teste reiniciando o R e rodando só a função.</p>"},
 {t:"code",cap:"Documentando",code:'#\' Normaliza uma matriz log2 centrando cada amostra pela mediana.\n#\'\n#\' @param mat matriz numérica em log2, proteínas nas linhas, amostras nas colunas\n#\' @param recentrar se TRUE, soma de volta a mediana global (só cosmético)\n#\' @return matriz das mesmas dimensões, normalizada\n#\' @examples\n#\'   mat_norm <- normaliza_mediana(mat_log2)\nnormaliza_mediana <- function(mat, recentrar = TRUE) { ... }'},
 {t:"note",title:"Onde guardar",html:"<p>Crie um arquivo <code class=\"i\">funcoes_proteomica.R</code> com as suas funções e carregue com <code class=\"i\">source(\"funcoes_proteomica.R\")</code> no topo dos scripts de análise. É o passo antes de virar pacote — e para o seu uso, geralmente suficiente.</p>"}
],
ex:[
 {type:"code", q:"Escreva uma função <code>log2_seguro</code> que recebe <code>x</code>, transforma valores ≤ 0 em NA e devolve o log2.",
  ans:["re:log2_seguro\\s*<-\\s*function\\(\\s*x\\s*\\)\\s*\\{?\\s*log2\\(\\s*ifelse\\(\\s*x\\s*<=\\s*0\\s*,\\s*NA\\s*,\\s*x\\s*\\)\\s*\\)\\s*\\}?",
       "re:log2_seguro\\s*<-\\s*function\\(\\s*x\\s*\\)\\s*\\{?\\s*ifelse\\(\\s*x\\s*<=\\s*0\\s*,\\s*NA\\s*,\\s*log2\\(\\s*x\\s*\\)\\s*\\)\\s*\\}?"],
  ph:"log2_seguro <- function(x) log2(ifelse(x <= 0, NA, x))",
  why:"Evita o <code>-Inf</code> que estraga médias, PCA e gráficos. Vale usar em todo o pipeline.",
  hint:"<code>function(x)</code> e dentro um <code>ifelse()</code> combinado com <code>log2()</code>."},
 {type:"mc", q:"Sua função usa o objeto <code>design</code> sem recebê-lo como argumento. Funciona no seu console. Qual o risco?",
  opts:["Nenhum, o R resolve","Ela depende de um objeto do ambiente global e vai quebrar em sessão limpa, via Rscript ou na máquina de outra pessoa","Fica mais lenta","Consome mais memória"],
  correct:1, why:"É a receita do 'funciona aqui e não lá'. Tudo que a função usa deve entrar por argumento — teste reiniciando o R (Ctrl+Shift+F10) e rodando só a função."}
]},

{id:"9.2", min:"15", title:"Repetir sem copiar: for, lapply e purrr", goal:"Rodar os três tecidos, os seis contrastes e os doze volcanos sem duplicar uma linha de código.",
blocks:[
 {t:"p",html:"Três formas de repetir. Comece pelo <code class=\"i\">for</code>, que é o mais explícito, e migre para <code class=\"i\">lapply</code>/<code class=\"i\">map</code> quando quiser coletar resultados."},
 {t:"code",cap:"for: para efeitos colaterais (salvar arquivos, gráficos)",code:'tecidos <- c("cerebelo", "hipocampo", "medula")\n\nfor (tec in tecidos) {\n  cat("Processando", tec, "...\\n")\n\n  arq <- paste0("input_dep2_", tec, "_raw.txt")\n  dados <- read.delim(arq, check.names = FALSE)\n\n  dir.create(paste0("resultados_", tec), showWarnings = FALSE)\n  # ... análise ...\n  write.csv(tab, file.path(paste0("resultados_", tec), "tabela.csv"),\n            row.names = FALSE)\n}'},
 {t:"code",cap:"lapply: para coletar resultados numa lista",code:'resultados <- lapply(tecidos, function(tec) {\n  arq <- paste0("input_dep2_", tec, "_raw.txt")\n  dados <- read.delim(arq, check.names = FALSE)\n  # ... análise ...\n  list(tecido = tec, n_prot = nrow(dados), n_sig = sum(tab$q_significant == "x"))\n})\n\nnames(resultados) <- tecidos\n\n# Virando tabela:\ndo.call(rbind, lapply(resultados, as.data.frame))\n#            tecido n_prot n_sig\n# cerebelo  cerebelo    290     8\n# hipocampo hipocampo   287     0\n# medula       medula   261     0'},
 {t:"code",cap:"purrr: a versão tidyverse",code:'library(purrr)\n\nresumo <- map_dfr(tecidos, function(tec) {\n  # ... análise ...\n  tibble::tibble(tecido = tec, n_prot = nrow(dados), n_sig = n_sig)\n})\n\n# walk = map sem devolver nada (para salvar arquivos)\nwalk(tecidos, function(tec) {\n  ggsave(paste0("volcano_", tec, ".png"), plot_de(tec), width = 7, height = 6, dpi = 300)\n})'},
 {t:"table",head:["","Use quando"],rows:[
  ["<code>for</code>","O objetivo é efeito colateral: salvar arquivo, imprimir, gerar gráfico"],
  ["<code>lapply</code>/<code>map</code>","Você quer coletar os resultados numa lista"],
  ["<code>sapply</code>/<code>map_dbl</code>","Cada iteração devolve um número — sai um vetor"],
  ["<code>map_dfr</code>/<code>bind_rows</code>","Cada iteração devolve uma linha ou tabela — sai um data.frame"],
  ["<code>walk</code>","Como o map, mas sem devolver nada"]
 ]},
 {t:"key",title:"É a estrutura do seu run_dep2_batch.R",html:"<p>Ele já roda os três tecidos com nomes de arquivo paralelos e salva em <code class=\"i\">resultados_&lt;tecido&gt;/</code>. O padrão <code class=\"i\">paste0(\"input_dep2_\", tec, \"_raw.txt\")</code> é o que torna isso possível — e é por isso que <b>nomear arquivos de forma consistente é decisão de engenharia</b>, não de organização.</p>"},
 {t:"h",text:"Iterando sobre os contrastes"},
 {t:"code",cap:"Os 12 volcanos, sem repetir código",code:'library(purrr); library(ggplot2)\n\ncontrastes <- c("Ctrl_vs_D3","Ctrl_vs_D14","Ctrl_vs_D28",\n                "D3_vs_D14","D3_vs_D28","D14_vs_D28")\n\ndir.create("volcanos", showWarnings = FALSE)\n\nwalk(contrastes, function(ct) {\n  p <- faz_volcano(se, ct)              # a sua função da aula 6.4\n  ggsave(file.path("volcanos", paste0("volcano_", ct, ".png")),\n         p, width = 7, height = 6, dpi = 300)\n})'},
 {t:"h",text:"Duas variáveis ao mesmo tempo"},
 {t:"code",cap:"map2 e expand.grid",code:'# Todas as combinações tecido x contraste:\ncombos <- expand.grid(tecido = tecidos, contraste = contrastes,\n                      stringsAsFactors = FALSE)\nnrow(combos)   # 18\n\npurrr::pwalk(combos, function(tecido, contraste) {\n  # roda para cada combinação\n})'},
 {t:"warn",title:"Uma armadilha do for",html:"<p>Não faça <code class=\"i\">resultado &lt;- c(resultado, novo)</code> dentro de um <code class=\"i\">for</code>: a cada volta o R recria o vetor inteiro, e com muitas iterações fica lento. Prealoque (<code class=\"i\">vector(\"list\", n)</code>) ou, melhor, use <code class=\"i\">lapply</code>, que já resolve isso.</p>"},
 {t:"note",title:"Se der erro no meio",html:"<p>Envolva o corpo em <code class=\"i\">tryCatch()</code> para que uma falha num tecido não derrube o lote inteiro:</p>"},
 {t:"code",cap:"tryCatch",code:'for (tec in tecidos) {\n  tryCatch({\n    processa(tec)\n  }, error = function(e) {\n    message("FALHOU em ", tec, ": ", conditionMessage(e))\n  })\n}'}
],
ex:[
 {type:"code", q:"Escreva o <code>for</code> que percorre o vetor <code>tecidos</code> imprimindo o nome de cada tecido com <code>cat()</code>.",
  ans:["re:for\\s*\\(\\s*tec\\s+in\\s+tecidos\\s*\\)\\s*\\{?\\s*cat\\(\\s*tec\\s*,?.*\\)",
       "re:for\\s*\\(\\s*t\\s+in\\s+tecidos\\s*\\)\\s*\\{?\\s*cat\\(\\s*t\\s*,?.*\\)"],
  ph:'for (tec in tecidos) cat(tec, "\\n")',
  why:"A variável do loop assume cada valor do vetor, um por vez.",
  hint:"<code>for (variavel in vetor) { ... }</code>"},
 {type:"mc", q:"Você quer rodar a mesma análise em 3 tecidos e coletar o número de proteínas significativas de cada um numa tabela. Qual ferramenta?",
  opts:["<code>for</code> com <code>c(resultado, novo)</code> dentro","<code>map_dfr()</code> ou <code>lapply()</code> + <code>bind_rows()</code>","<code>walk()</code>","<code>apply()</code>"],
  correct:1, why:"Você quer <b>coletar</b> resultados, então precisa de algo que devolva valores. <code>walk</code> não devolve nada; o <code>for</code> com concatenação funciona mas é o padrão mais lento e mais fácil de errar."}
]},

{id:"9.3", min:"13", title:"A estrutura de um script reprodutível", goal:"Organizar o script para que outra pessoa — ou você daqui a seis meses — consiga rodar sem te perguntar nada.",
blocks:[
 {t:"p",html:"Todo script de análise seu deveria ter a mesma anatomia. A ideia central: <b>todas as decisões num bloco só, no topo</b>. O resto é execução."},
 {t:"code",cap:"O esqueleto",code:'# =====================================================================\n# qc_proteomica.R — QC de proteômica label-free\n# Autor: ...   |   Última alteração: 2026-07-28\n# Rodar em sessão limpa:\n#   "C:/Program Files/R/R-4.6.0/bin/Rscript.exe" qc_proteomica.R\n# =====================================================================\n\n# ---- 1. CONFIGURAÇÃO -------------------------------------------------\nINPUT         <- "input_dep2_cerebelo_raw.txt"\nOUTDIR        <- "resultados_cerebelo"\nCOLS_AMOSTRA  <- 5:16\n\nf_condicao    <- function(x) sub("_[0-9]+$", "", x)\nf_replicata   <- function(x) sub(".*_", "", x)\nf_lote        <- function(x) rep(c("L1","L2"), each = 6)\nORDEM_INJECAO <- c(3,1,4,2,7,5,8,6,11,9,12,10)\n\nNORMALIZACAO  <- "mediana"      # "mediana" | "vsn" | "nenhuma"\nFILTRO_MIN    <- 0.70           # fração mínima de válidos por grupo\nIMPUTACAO     <- "nenhuma"      # "nenhuma" | "MinProb" | "knn"\nALPHA         <- 0.05\nLFC           <- log2(1.5)\nFDR_TYPE      <- "BH"\nREMOVER       <- c("ctrl_all_9")   # amostras fora da DE\nDPI           <- 300\n\n# ---- 2. PACOTES ------------------------------------------------------\nsuppressPackageStartupMessages({\n  library(dplyr); library(tidyr); library(ggplot2)\n  library(SummarizedExperiment)\n})\n\n# ---- 3. FUNÇÕES ------------------------------------------------------\nsource("funcoes_proteomica.R")\n\n# ---- 4. LEITURA ------------------------------------------------------\nstopifnot(file.exists(INPUT))\ndados <- read.delim(INPUT, check.names = FALSE)\ncat("Lidas", nrow(dados), "proteínas x", length(COLS_AMOSTRA), "amostras\\n")\n\n# ---- 5. ANÁLISE ------------------------------------------------------\n# ...\n\n# ---- 6. SAÍDAS -------------------------------------------------------\ndir.create(OUTDIR, showWarnings = FALSE, recursive = TRUE)\n# ggsave(file.path(OUTDIR, "normalizacao.png"), ..., dpi = DPI)\n\n# ---- 7. REGISTRO -----------------------------------------------------\nwriteLines(capture.output(sessionInfo()), file.path(OUTDIR, "sessionInfo.txt"))\ncat("Concluído em", format(Sys.time()), "\\n")'},
 {t:"key",title:"Você já faz isso",html:"<p>O bloco CONFIGURAÇÃO no topo do <code class=\"i\">qc_proteomica.R</code> é exatamente essa ideia: para reusar num estudo novo, você só mexe ali. O que esta aula acrescenta é <b>generalizar o padrão</b> — todo script novo nasce com esse esqueleto.</p>"},
 {t:"h",text:"Regras que evitam retrabalho"},
 {t:"list",items:[
  "<b>Nenhum número mágico no meio do código.</b> Se <code class=\"i\">0.585</code> aparece na linha 140, ele deveria ser <code class=\"i\">LFC</code>, definido no topo.",
  "<b>Nenhum caminho absoluto.</b> Project + caminho relativo.",
  "<b>Saída em pasta própria</b>, criada pelo script com <code class=\"i\">dir.create()</code>.",
  "<b>Nunca sobrescreva a entrada.</b> Dados brutos são somente-leitura, sempre.",
  "<b>Imprima o que está acontecendo</b> com <code class=\"i\">cat()</code>. Rodando via Rscript, essas mensagens são a sua única janela.",
  "<b>Falhe cedo</b> com <code class=\"i\">stopifnot()</code>: melhor parar na linha 10 do que produzir tabela errada na linha 300.",
  "<b>Salve o sessionInfo</b> junto com os resultados."
 ]},
 {t:"h",text:"Comentar o porquê, não o quê"},
 {t:"code",cap:"A diferença",code:'# Ruim — repete o que o código já diz:\nFDR_TYPE <- "BH"   # define o tipo de FDR\n\n# Bom — registra a decisão e a evidência:\n# FDR = BH. Strimmer\'s qvalue(p) foi testado e descartado: com n=3 o\n# fdrtool estima eta0 baixo e fica anti-conservador (30 vs 8 significativas\n# no contraste D3_vs_D14). BH bate com a análise manual e é o padrão da área.\nFDR_TYPE <- "BH"'},
 {t:"p",html:"Daqui a um ano, o que você não vai lembrar é <b>por que</b> escolheu BH — o código já mostra que escolheu. Comentário é onde mora o raciocínio."},
 {t:"h",text:"Organização de pastas"},
 {t:"code",cap:"Uma estrutura que escala",code:'Dados_Rafael_UFPA/\n├── Dados_Rafael_UFPA.Rproj\n├── dados/                     # SOMENTE LEITURA\n│   ├── input_dep2_cerebelo_raw.txt\n│   ├── input_dep2_hipocampo_raw.txt\n│   └── input_dep2_medula_raw.txt\n├── R/\n│   ├── funcoes_proteomica.R\n│   ├── qc_proteomica.R\n│   └── run_dep2_batch.R\n├── resultados_cerebelo/\n│   ├── tabelas/\n│   ├── volcanos/\n│   └── sessionInfo.txt\n└── README.md                  # o que é o estudo, o desenho, como rodar'}
],
ex:[
 {type:"mc", q:"Qual destes comentários é mais útil daqui a um ano?",
  opts:['<code># remove a amostra ctrl_9</code>','<code># ctrl_9 removida: mediana log2 8,94 vs ~11 das demais, Spearman média 0,80 (resto ≥0,91), outgroup no dendrograma. Input real baixo, não é escala.</code>','<code># limpeza</code>','<code># ver linha 45</code>'],
  correct:1, why:"O código já mostra que a amostra foi removida. O que se perde com o tempo é a <b>evidência</b> que justificou a decisão — e é ela que você vai precisar quando o revisor perguntar."},
 {type:"do", q:"Faça na sua máquina:", q2:"Peguei um script meu e movi todas as constantes espalhadas (caminhos, cortes, cores) para um bloco CONFIGURAÇÃO no topo."}
]},

{id:"9.4", min:"12", title:"Depurar sozinho", goal:"Ter um método para achar o erro em vez de tentar coisas ao acaso.",
blocks:[
 {t:"p",html:"Depurar não é adivinhar. É reduzir o problema até ele caber num pedaço pequeno onde você consegue olhar."},
 {t:"h",text:"O método"},
 {t:"list",items:[
  "<b>Leia a mensagem inteira.</b> Última linha = o erro; o <code class=\"i\">in ...</code> = onde.",
  "<b>Rode a linha em pedaços.</b> Três funções aninhadas? Rode a mais interna sozinha e olhe o resultado.",
  "<b>Inspecione o objeto.</b> <code class=\"i\">str()</code>, <code class=\"i\">dim()</code>, <code class=\"i\">class()</code>, <code class=\"i\">head()</code>, <code class=\"i\">summary()</code>.",
  "<b>Reduza os dados.</b> Rode com 10 linhas em vez de 3.000 — o erro aparece igual e você enxerga tudo.",
  "<b>Compare com o que funciona.</b> Funciona no cerebelo e falha na medula? A diferença está nos dados, não no código."
 ]},
 {t:"code",cap:"O caso real da medula",code:'# Erro em make_unique(dados, names = "Gene", ids = "Protein.ID")\n\nnames(dados)\n# "Protein.ID" "Ctrl_1" "D3_2" ...     <- não existe coluna "Gene"!\n\n# Comparando os três:\nlapply(c("cerebelo","hipocampo","medula"), function(t) {\n  names(read.delim(paste0("input_dep2_", t, "_raw.txt"), nrows = 1))[1:3]\n})\n# medula não tem Gene -> use make_unique(dados, name = "Protein.ID")'},
 {t:"h",text:"As ferramentas"},
 {t:"code",cap:"print, traceback, browser",code:'# 1) print/cat: o mais simples e frequentemente o melhor\nprocessa <- function(mat) {\n  cat("dim:", dim(mat), "| NAs:", sum(is.na(mat)), "\\n")\n  # ...\n}\n\n# 2) traceback(): logo após um erro, mostra a cadeia de chamadas\ntraceback()\n\n# 3) browser(): pausa e abre um console DENTRO da função\nprocessa <- function(mat) {\n  browser()      # a execução para aqui\n  med <- apply(mat, 2, median, na.rm = TRUE)\n  sweep(mat, 2, med, FUN = "-")\n}\n# no prompt Browse[1]> :  n = próxima linha, c = continuar, Q = sair\n\n# 4) debug(): abre o browser toda vez que a função for chamada\ndebug(processa); processa(mat); undebug(processa)'},
 {t:"h",text:"Verificações no meio do caminho"},
 {t:"code",cap:"stopifnot: o custo é zero, o retorno é alto",code:'stopifnot(\n  is.matrix(mat),\n  is.numeric(mat),\n  ncol(mat) == nrow(design),\n  all(colnames(mat) == design$label)\n)'},
 {t:"key",title:"A verificação mais valiosa do seu pipeline",html:"<p><code class=\"i\">all(colnames(mat) == design$label)</code>. Se as colunas da matriz e as linhas do desenho estiverem desalinhadas, <b>tudo roda sem erro</b> e o resultado inteiro é lixo: você atribui a condição errada a cada amostra. Não existe mensagem de erro para isso — só essa checagem.</p>"},
 {t:"warn",title:"Os nomes com X",html:"<p>É aqui que o seu truque <code class=\"i\">sub(\"^X\", \"\", nomes)</code> entra: amostras que começam com dígito ganham o prefixo na leitura, e o casamento com a tabela de desenho falha silenciosamente. Padronize os nomes dos dois lados <b>antes</b> de comparar.</p>"},
 {t:"code",cap:"Casando nomes com segurança",code:'norm_nome <- function(x) sub("^X", "", x)\n\nstopifnot(setequal(norm_nome(colnames(mat)), norm_nome(design$label)))\n\n# E então reordene o desenho para bater com a matriz:\ndesign <- design[match(norm_nome(colnames(mat)), norm_nome(design$label)), ]'},
 {t:"note",title:"Reproduzir antes de consertar",html:"<p>Se o erro é intermitente, a primeira tarefa é torná-lo constante: <code class=\"i\">set.seed()</code> se houver aleatoriedade (imputação knn, por exemplo), sessão limpa, dados mínimos. Erro que você não consegue reproduzir você não consegue consertar.</p>"}
],
ex:[
 {type:"code", q:"Escreva a verificação que garante que o número de colunas da matriz <code>mat</code> é igual ao número de linhas da tabela <code>design</code>, parando o script se não for.",
  ans:["stopifnot(ncol(mat) == nrow(design))","stopifnot(ncol(mat)==nrow(design))"],
  ph:"stopifnot(...)",
  why:"Uma linha que evita a pior classe de erro: a que não gera mensagem nenhuma e produz resultado errado.",
  hint:"<code>stopifnot()</code> com a comparação entre <code>ncol()</code> e <code>nrow()</code>."},
 {type:"mc", q:"O script funciona no cerebelo e falha na medula. Qual o primeiro passo?",
  opts:["Reescrever o script","Comparar a estrutura dos dois arquivos de entrada — <code>names()</code>, <code>dim()</code>, <code>str()</code>","Reinstalar os pacotes","Testar com outro R"],
  correct:1, why:"Mesmo código, dados diferentes: a diferença está nos dados. Foi assim que apareceu a ausência da coluna Gene na medula."}
]},

{id:"9.5", min:"12", title:"Reprodutibilidade: renv, Quarto e RDS", goal:"Garantir que a análise de hoje rode igual daqui a um ano — na sua máquina ou na de outra pessoa.",
blocks:[
 {t:"p",html:"Reprodutibilidade tem três camadas: os <b>dados</b>, o <b>código</b> e o <b>ambiente</b>. Você já cuida das duas primeiras."},
 {t:"h",text:"renv: congelar as versões dos pacotes"},
 {t:"code",cap:"Três comandos",code:'# install.packages("renv")\n\nrenv::init()       # cria a biblioteca do projeto e o renv.lock\nrenv::snapshot()   # registra as versões atuais no renv.lock\nrenv::restore()    # reinstala exatamente essas versões (em outra máquina)'},
 {t:"p",html:"O <code class=\"i\">renv.lock</code> é um arquivo de texto com pacote e versão exata. Versionado junto com o script, ele torna a análise reinstalável. Para uma revisão de artigo dois anos depois, é a diferença entre reproduzir e não reproduzir."},
 {t:"h",text:"Salvar objetos intermediários"},
 {t:"code",cap:"RDS: um objeto por arquivo",code:'saveRDS(se, file.path(OUTDIR, "se_normalizado.rds"))\nse <- readRDS(file.path(OUTDIR, "se_normalizado.rds"))\n\n# Vários objetos de uma vez:\nsave(se, design, mat_norm, file = "etapa2.RData")\nload("etapa2.RData")'},
 {t:"note",title:"Prefira RDS",html:"<p><code class=\"i\">saveRDS</code>/<code class=\"i\">readRDS</code> guardam <b>um</b> objeto e você escolhe o nome ao carregar. <code class=\"i\">save</code>/<code class=\"i\">load</code> recriam os nomes originais e podem sobrescrever objetos da sua sessão sem avisar. Para etapas caras (VSN, imputação), salvar em RDS economiza muito tempo de reprocessamento.</p>"},
 {t:"h",text:"Quarto/R Markdown: código e texto juntos"},
 {t:"code",cap:"A estrutura de um .qmd",code:'---\ntitle: "Cerebelo — análise diferencial"\nauthor: "..."\ndate: today\nformat:\n  html:\n    toc: true\n    code-fold: true\n---\n\n## Dados\n\nExport do Progenesis (abundância bruta), 12 amostras, 4 grupos.\n\n```{r}\n#| label: leitura\n#| message: false\nlibrary(dplyr)\ndados <- read.delim("dados/input_dep2_cerebelo_raw.txt", check.names = FALSE)\ndim(dados)\n```\n\nA amostra `ctrl_9` foi removida (mediana log2 8,94 vs ~11).\n\n```{r}\n#| label: volcano\n#| fig-width: 7\n#| fig-height: 6\nfaz_volcano(se, "Ctrl_vs_D14")\n```'},
 {t:"key",title:"Por que isso resolve um problema seu",html:"<p>Hoje você gera PDFs e CSVs separados e monta a explicação em outro lugar. Um documento Quarto entrega <b>texto, código, gráfico e tabela juntos</b>, sempre em sincronia com os dados atuais — e o pesquisador recebe um HTML único, navegável, que se atualiza sozinho quando você reprocessa. Com <code class=\"i\">code-fold: true</code>, o código fica escondido por padrão e disponível para quem quiser auditar.</p>"},
 {t:"h",text:"Aleatoriedade"},
 {t:"code",cap:"set.seed",code:'set.seed(42)\n# knn e MinProb têm componente aleatório: sem semente, cada rodada\n# dá valores imputados ligeiramente diferentes e a contagem de\n# significativas pode mudar.'},

          modo:"card", card:{}, dia:null, hojeN:0, ofensiva:0};

var FLAT = [];
TRILHA.forEach(function(m){ m.lessons.forEach(function(l){ FLAT.push({m:m, l:l}); }); });
function idx(id){ for(var i=0;i<FLAT.length;i++){ if(FLAT[i].l.id===id) return i; } return 0; }

/* ============ util ============ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function el(h){ var d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild; }

function hi(code){
  var s = esc(code);
  s = s.replace(/(#[^\n]*)/g, '<span class="c">$1</span>');
  s = s.replace(/(&quot;[^&]*?&quot;)/g, '<span class="s">$1</span>');
  s = s.replace(/\b(function|if|else|for|while|return|TRUE|FALSE|NULL|NA|NaN|Inf|library|in|repeat|next|break)\b/g, '<span class="k">$1</span>');
  s = s.replace(/([a-zA-Z_][a-zA-Z0-9_.]*)\(/g, '<span class="f">$1</span>(');
  s = s.replace(/(&lt;-|\|&gt;|%&gt;%|~|\+)/g, '<span class="o">$1</span>');
  return s;
}

function toast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("on"); },1900);
}
function copy(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg||"Copiado"); },function(){ fallback(text,msg); });
  } else fallback(text,msg);
}
function fallback(text,msg){
  var ta=document.createElement("textarea"); ta.value=text;
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); toast(msg||"Copiado"); }catch(e){ toast("Copie manualmente"); }
  document.body.removeChild(ta);
}
function norm(s){
  return String(s).replace(/[‘’“”]/g,'"').replace(/'/g,'"')
    .replace(/\s+/g,"").replace(/;+$/,"").trim();
}

/* ============ sidebar ============ */
function buildSide(){
  var side=document.getElementById("side"); side.innerHTML="";
  TRILHA.forEach(function(m){
    var doneN = m.lessons.filter(function(l){ return st.done[l.id]; }).length;
    var open = m.lessons.some(function(l){ return l.id===st.cur; });
    var box = el('<div class="mod'+(open?" open":"")+'" data-m="'+m.n+'"></div>');
    var h = el('<button class="mod-h"><span class="mod-n">'+esc(m.n)+'</span>'+
      '<span class="mod-t">'+esc(m.title)+'</span>'+
      '<span class="mod-c">'+doneN+'/'+m.lessons.length+'</span></button>');
    h.addEventListener("click", function(){ box.classList.toggle("open"); });
    box.appendChild(h);
    var ul = el('<div class="mod-l"></div>');
    m.lessons.forEach(function(l){
      var b = el('<button class="lnk'+(l.id===st.cur?" here":"")+(st.done[l.id]?" done":"")+'">'+
        '<span class="lnk-n">'+esc(l.id)+'</span><span>'+esc(l.title)+'</span></button>');
      b.addEventListener("click", function(){ go(l.id); });
      ul.appendChild(b);
    });
    box.appendChild(ul);
    side.appendChild(box);
  });
}

/* ============ espectro ============ */
function buildSpec(){
  var sp=document.getElementById("spectrum"); sp.innerHTML="";
  TRILHA.forEach(function(m,mi){
    if(mi>0) sp.appendChild(el('<div class="spec-gap"></div>'));
    m.lessons.forEach(function(l){
      var cls = st.done[l.id] ? "done" : "";
      if(l.id===st.cur) cls = "here";
      var b = el('<button class="tick '+cls+'" title="'+esc(l.id+" "+l.title)+'" aria-label="'+esc(l.id)+'"></button>');
      b.addEventListener("click", function(){ go(l.id); });
      sp.appendChild(b);
    });
  });
  var d = FLAT.filter(function(f){ return st.done[f.l.id]; }).length;
  document.getElementById("pct").textContent = Math.round(100*d/FLAT.length)+"%";
}

/* ============ render ============ */
function renderBlocks(bs){
  return bs.map(function(b){
    if(b.t==="p")    return '<p>'+b.html+'</p>';
    if(b.t==="h")    return '<h3>'+esc(b.text)+'</h3>';
    if(b.t==="list") return '<ul>'+b.items.map(function(i){ return '<li>'+i+'</li>'; }).join("")+'</ul>';
    if(b.t==="note") return '<div class="note"><span class="note-t">'+esc(b.title||"Nota")+'</span>'+b.html+'</div>';
    if(b.t==="warn") return '<div class="warn"><span class="note-t">'+esc(b.title||"Cuidado")+'</span>'+b.html+'</div>';
    if(b.t==="key")  return '<div class="key"><span class="note-t">'+esc(b.title||"No seu caso")+'</span>'+b.html+'</div>';
    if(b.t==="porque") return '<div class="pq">'+
      '<div class="pq-r pq-1"><span class="pq-l">Por que isso existe</span><p>'+b.existe+'</p></div>'+
      '<div class="pq-r pq-2"><span class="pq-l">O que você consegue fazer com isso</span><ul>'+
        b.faz.map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ul></div>'+
      '<div class="pq-r pq-3"><span class="pq-l">Sem isso, você não conseguiria</span><p>'+b.sem+'</p></div>'+
      '</div>';
    if(b.t==="code") return '<div class="cbox"><div class="cbar"><span class="cbar-t">'+esc(b.cap||"R")+
      '</span><button class="cbar-b" data-copy="'+esc(b.code)+'">copiar</button></div><pre>'+hi(b.code)+'</pre></div>';
    if(b.t==="table") return '<div class="tblw"><table><thead><tr>'+
      b.head.map(function(h){ return '<th>'+h+'</th>'; }).join("")+'</tr></thead><tbody>'+
      b.rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+c+'</td>'; }).join("")+'</tr>'; }).join("")+
      '</tbody></table></div>';
    return "";
  }).join("");
}

function renderEx(ex, lid, i){
  var key = lid+"#"+i;
  var box = el('<div class="ex"></div>');
  box.appendChild(el('<div class="ex-q">'+ex.q+'</div>'));

  if(ex.type==="mc"){
    var opts = el('<div class="opts"></div>');
    ex.opts.forEach(function(o,oi){
      var b = el('<button class="opt">'+o+'</button>');
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(opts.children,function(c){ c.classList.remove("ok","no"); });
        if(oi===ex.correct){ b.classList.add("ok"); fbEl.className="fb show good"; fbEl.innerHTML="Isso. "+ex.why; st.tries[key]="ok"; }
        else { b.classList.add("no"); opts.children[ex.correct].classList.add("ok");
               fbEl.className="fb show bad"; fbEl.innerHTML="Não. "+ex.why; st.tries[key]="erro"; }
        save();
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
  }

  if(ex.type==="code"){
    var inp = el('<input class="ans" placeholder="'+esc(ex.ph||"escreva o código aqui")+'"'+
      ' spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="none"'+
      ' inputmode="text" enterkeyhint="done">');
    box.appendChild(inp);
    var row = el('<div class="ex-row"></div>');
    var bc = el('<button class="btn btn-solid">Conferir</button>');
    var bs = el('<button class="btn">Ver solução</button>');
    bc.addEventListener("click", function(){
      var v = norm(inp.value);
      var ok = ex.ans.some(function(a){
        if(a.indexOf("re:")===0) return new RegExp(a.slice(3)).test(inp.value.replace(/\s+/g," ").trim());
        return norm(a)===v;
      });
      if(ok){ fbEl.className="fb show good"; fbEl.innerHTML="Certo. "+(ex.why||""); st.tries[key]="ok"; }
      else  { fbEl.className="fb show bad";  fbEl.innerHTML=ex.hint||"Ainda não. Olhe a dica e tente de novo."; st.tries[key]="erro"; }
      save();
    });
    bs.addEventListener("click", function(){
      fbEl.className="fb show good";
      fbEl.innerHTML='<code class="i">'+esc(ex.ans[0])+'</code>'+(ex.why?"<br>"+ex.why:"");
      st.tries[key]="solucao"; save();
    });
    row.appendChild(bc); row.appendChild(bs); box.appendChild(row);
  }

  if(ex.type==="do"){
    var lab = el('<label class="chk"><input type="checkbox"><span>'+ex.q2+'</span></label>');
    var cb = lab.querySelector("input");
    cb.checked = st.tries[key]==="ok";
    cb.addEventListener("change", function(){ st.tries[key]= cb.checked?"ok":""; save(); });
    box.appendChild(lab);
  }

  var fbEl = el('<div class="fb"></div>');
  box.appendChild(fbEl);
  if(st.tries[key]==="ok" && ex.type!=="do"){ fbEl.className="fb show good"; fbEl.innerHTML="Você já acertou esta."; }
  return box;
}

function renderFull(id){
  var f = FLAT[idx(id)], l = f.l, m = f.m;
  var wrap = document.getElementById("wrap");
  wrap.innerHTML =
    '<div class="crumb">Módulo '+esc(m.n)+' <b>&rsaquo;</b> '+esc(m.title)+'</div>'+
    '<h2 class="title">'+esc(l.title)+'</h2>'+
    '<div class="goal">'+l.goal+'<span class="mins">'+esc(l.min||"10")+' min</span></div>'+
    renderBlocks(l.blocks);

  if(l.ex && l.ex.length){
    var exs = el('<div class="exs"><div class="exs-h">Pratique</div></div>');
    l.ex.forEach(function(e,i){ exs.appendChild(renderEx(e,l.id,i)); });
    wrap.appendChild(exs);
  }

  var nt = el('<div class="notes"><div class="notes-h">Suas anotações e dúvidas</div>'+
    '<textarea placeholder="O que não fez sentido? O que você quer ver aplicado nos seus dados? Isso entra no relatório de feedback."></textarea></div>');
  var ta = nt.querySelector("textarea");
  ta.value = st.notes[l.id]||"";
  ta.addEventListener("input", function(){ st.notes[l.id]=ta.value; save(); });
  wrap.appendChild(nt);

  var i = idx(id);
  var foot = el('<div class="foot"></div>');
  var db = el('<label class="donebtn'+(st.done[id]?" on":"")+'"><input type="checkbox"'+(st.done[id]?" checked":"")+'><span>Aula concluída</span></label>');
  db.querySelector("input").addEventListener("change", function(e){
    st.done[id] = e.target.checked; if(!e.target.checked) delete st.done[id];
    db.classList.toggle("on", !!st.done[id]); save(); buildSide(); buildSpec();
  });
  foot.appendChild(db);
  foot.appendChild(el('<span class="grow"></span>'));
  if(i>0){ var pb = el('<button class="btn">← Anterior</button>');
    pb.addEventListener("click", function(){ go(FLAT[i-1].l.id); }); foot.appendChild(pb); }
  if(i<FLAT.length-1){ var nb = el('<button class="btn btn-solid">Próxima →</button>');
    nb.addEventListener("click", function(){ if(!st.done[id]){ st.done[id]=true; } go(FLAT[i+1].l.id); }); foot.appendChild(nb); }
  wrap.appendChild(foot);

  bindCopy(wrap);
}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R para Proteomica</title>
<meta name="description" content="Curso de R do zero para proteomica: Progenesis, DEP2, protti, limma.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="pRoteomica">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141c1a" media="(prefers-color-scheme: dark)">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f1f3f1}
@media (prefers-color-scheme:dark){html,body{background:#0e1413}}
img{max-width:100%}
</style>
</head>
<body>
<style>
:root{
  --paper:#f1f3f1;
  --surface:#fbfcfb;
  --surface2:#e6eae7;
  --ink:#141a18;
  --ink2:#3f4b47;
  --ink3:#6e7a76;
  --line:#d2d9d5;
  --line2:#bcc6c1;
  --accent:#0d7c6e;
  --accent2:#0a5d53;
  --accent-soft:#d9ece8;
  --up:#b93a5c;
  --down:#2d6cb0;
  --warn:#9a6510;
  --warn-soft:#f6ecd8;
  --console:#131b19;
  --console-ink:#dfe9e5;
  --console-line:#26332f;
  --shadow:0 1px 2px rgba(20,26,24,.06),0 8px 24px -12px rgba(20,26,24,.18);
  --serif:Constantia,"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",Consolas,"Liberation Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0e1413;
    --surface:#141c1a;
    --surface2:#1c2624;
    --ink:#e4ebe8;
    --ink2:#a9b5b1;
    --ink3:#7b8783;
    --line:#28332f;
    --line2:#38443f;
    --accent:#3cc7b1;
    --accent2:#67d9c6;
    --accent-soft:#0f2e29;
    --up:#e8798f;
    --down:#6ea9e6;
    --warn:#d9a248;
    --warn-soft:#2a2317;
    --console:#0a100f;
    --console-ink:#dbe6e2;
    --console-line:#1e2a27;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1413;--surface:#141c1a;--surface2:#1c2624;--ink:#e4ebe8;--ink2:#a9b5b1;
  --ink3:#7b8783;--line:#28332f;--line2:#38443f;--accent:#3cc7b1;--accent2:#67d9c6;
  --accent-soft:#0f2e29;--up:#e8798f;--down:#6ea9e6;--warn:#d9a248;--warn-soft:#2a2317;
  --console:#0a100f;--console-ink:#dbe6e2;--console-line:#1e2a27;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --paper:#f1f3f1;--surface:#fbfcfb;--surface2:#e6eae7;--ink:#141a18;--ink2:#3f4b47;
  --ink3:#6e7a76;--line:#d2d9d5;--line2:#bcc6c1;--accent:#0d7c6e;--accent2:#0a5d53;
  --accent-soft:#d9ece8;--up:#b93a5c;--down:#2d6cb0;--warn:#9a6510;--warn-soft:#f6ecd8;
  --console:#131b19;--console-ink:#dfe9e5;--console-line:#26332f;
  --shadow:0 1px 2px rgba(20,26,24,.06),0 8px 24px -12px rgba(20,26,24,.18);
}

*{box-sizing:border-box}
body{margin:0}
.app{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- topo ---------- */
.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:18px;
  padding:10px 20px;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.menu{
  display:none;background:none;border:1px solid var(--line2);color:var(--ink);
  border-radius:6px;width:34px;height:32px;cursor:pointer;font-size:15px;line-height:1;
}
.brand{display:flex;flex-direction:column;gap:1px;flex:0 0 auto}
.brand-k{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);
}
.brand-t{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}

.spectrum{
  flex:1 1 auto;display:flex;align-items:flex-end;gap:1px;height:30px;
  min-width:0;overflow:hidden;padding:0 4px;
}
.spec-gap{width:7px;flex:0 0 auto}
.tick{
  flex:1 1 2px;min-width:2px;background:var(--line2);height:22%;
  border-radius:1px 1px 0 0;cursor:pointer;padding:0;border:0;
  transition:height .25s ease,background .25s ease;
}
.tick:hover{background:var(--ink3)}
.tick.done{background:var(--accent);height:78%}
.tick.here{background:var(--up);height:100%}
@media (prefers-reduced-motion:reduce){.tick{transition:none}}

.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pct{font-family:var(--mono);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.btn{
  font-family:var(--sans);font-size:12.5px;padding:6px 11px;border-radius:6px;
  border:1px solid var(--line2);background:var(--surface2);color:var(--ink);cursor:pointer;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-solid:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
:root[data-theme="dark"] .btn-solid,
:root[data-theme="dark"] .btn-solid:hover{color:#08201c}
@media (prefers-color-scheme:dark){.btn-solid,.btn-solid:hover{color:#08201c}}
:root[data-theme="light"] .btn-solid,:root[data-theme="light"] .btn-solid:hover{color:#fff}

/* ---------- corpo ---------- */
.body{display:grid;grid-template-columns:296px minmax(0,1fr);flex:1 1 auto;align-items:start}
.side{
  position:sticky;top:51px;height:calc(100vh - 51px);overflow-y:auto;
  border-right:1px solid var(--line);background:var(--surface);
  padding:18px 0 60px;
}
.mod{border-bottom:1px solid var(--line)}
.mod-h{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit;
  display:flex;gap:11px;align-items:baseline;padding:11px 18px;font-family:var(--sans);
}
.mod-h:hover{background:var(--surface2)}
.mod-n{font-family:var(--mono);font-size:11px;color:var(--accent);flex:0 0 auto;padding-top:2px}
.mod-t{font-size:13.5px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
.mod-c{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:auto;flex:0 0 auto;font-variant-numeric:tabular-nums}
.mod-l{display:none;padding:0 0 8px}
.mod.open .mod-l{display:block}
.lnk{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;color:var(--ink2);
  display:flex;gap:10px;align-items:baseline;padding:5px 18px 5px 30px;font-family:var(--sans);
  font-size:12.5px;line-height:1.4;border-left:2px solid transparent;
}
.lnk:hover{color:var(--ink);background:var(--surface2)}
.lnk.here{color:var(--accent);border-left-color:var(--accent);font-weight:600;background:var(--accent-soft)}
.lnk-n{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:0 0 26px;font-variant-numeric:tabular-nums}
.lnk.here .lnk-n{color:var(--accent)}
.lnk.done .lnk-n::after{content:" ●";color:var(--accent);font-size:8px}

.main{padding:34px 40px 100px;min-width:0}
.wrap{max-width:70ch;margin:0 auto}

/* ---------- aula ---------- */
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.crumb b{color:var(--accent);font-weight:400}
h2.title{font-family:var(--serif);font-size:31px;line-height:1.18;margin:0 0 12px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.goal{
  font-size:15px;color:var(--ink2);border-left:2px solid var(--accent);
  padding:2px 0 2px 14px;margin:0 0 26px;
}
.mins{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-left:8px}
.main p{margin:0 0 15px}
.main h3{font-family:var(--serif);font-size:19px;margin:30px 0 10px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.main a{color:var(--accent)}
code.i{
  font-family:var(--mono);font-size:.87em;background:var(--surface2);
  padding:1px 5px;border-radius:4px;border:1px solid var(--line);
}
.main ul{margin:0 0 15px;padding-left:20px}
.main li{margin-bottom:6px}

.cbox{margin:0 0 20px;border-radius:8px;overflow:hidden;background:var(--console);border:1px solid var(--console-line)}
.cbar{
  display:flex;align-items:center;gap:10px;padding:6px 10px 6px 12px;
  border-bottom:1px solid var(--console-line);
}
.cbar-t{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7d918b}
.cbar-b{
  margin-left:auto;background:none;border:1px solid #2f3f3a;color:#9db3ad;
  font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;
}
.cbar-b:hover{border-color:var(--accent);color:var(--accent2)}
pre{
  margin:0;padding:13px 15px;overflow-x:auto;
  font-family:var(--mono);font-size:13px;line-height:1.62;color:var(--console-ink);
  tab-size:2;
}
pre .c{color:#6f8a83;font-style:italic}
pre .f{color:#6fd3bd}
pre .s{color:#e2a56a}
pre .k{color:#e88aa2}
pre .o{color:#8fb4d8}

.note,.warn,.key{
  border-radius:8px;padding:13px 16px;margin:0 0 20px;font-size:14.5px;
  border:1px solid var(--line);background:var(--surface);
}
.note{border-left:3px solid var(--accent)}
.warn{border-left:3px solid var(--warn);background:var(--warn-soft)}
.key{border-left:3px solid var(--up)}
.note-t{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  display:block;margin-bottom:5px;color:var(--accent);
}
.warn .note-t{color:var(--warn)}
.key .note-t{color:var(--up)}
.note p:last-child,.warn p:last-child,.key p:last-child{margin-bottom:0}

/* ---------- painel por-que-existe ---------- */
.pq{border:1px solid var(--line);border-radius:9px;margin:0 0 20px;background:var(--surface);overflow:hidden}
.pq-r{padding:13px 16px;border-bottom:1px solid var(--line)}
.pq-r:last-child{border-bottom:0}
.pq-l{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  display:block;margin-bottom:6px;color:var(--ink3);
}
.pq-1 .pq-l{color:var(--warn)}
.pq-2 .pq-l{color:var(--accent)}
.pq-3 .pq-l{color:var(--up)}
.pq-r p{margin:0;font-size:14.5px}
.pq-r ul{margin:0;padding-left:18px;font-size:14.5px}
.pq-r li{margin-bottom:5px}
.pq-r li:last-child{margin-bottom:0}
.pq-r code{font-family:var(--mono);font-size:.87em;background:var(--surface2);padding:1px 5px;border-radius:4px}

.tblw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:400}
tr:last-child td{border-bottom:0}
td code{font-family:var(--mono);font-size:12.5px}

/* ---------- exercícios ---------- */
.exs{margin-top:38px;border-top:1px solid var(--line);padding-top:26px}
.exs-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:14px}
.ex-q{font-size:15px;margin:0 0 12px}
.ex-q code{font-family:var(--mono);font-size:.87em;background:var(--surface2);padding:1px 5px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  text-align:left;background:var(--paper);border:1px solid var(--line);color:var(--ink);
  border-radius:7px;padding:9px 12px;cursor:pointer;font-family:var(--sans);font-size:14px;line-height:1.45;
}
.opt code{font-family:var(--mono);font-size:.88em}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt.no{border-color:var(--up);opacity:.75}
.ans{
  width:100%;font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:7px;
  border:1px solid var(--line2);background:var(--console);color:var(--console-ink);
}
.ans::placeholder{color:#6b7d78}
.ex-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.fb{font-size:13.5px;margin-top:10px;padding:9px 12px;border-radius:7px;display:none}
.fb.show{display:block}
.fb.good{background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent)}
.fb.bad{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:14.5px}
.chk input{margin-top:5px;accent-color:var(--accent);width:15px;height:15px}

.notes{margin-top:30px}
.notes-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.notes textarea{
  width:100%;min-height:78px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);padding:11px 13px;font-family:var(--sans);
  font-size:14px;line-height:1.55;resize:vertical;
}
.notes textarea::placeholder{color:var(--ink3)}

.foot{display:flex;gap:10px;align-items:center;margin-top:34px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .grow{flex:1 1 auto}
.donebtn{
  display:flex;gap:9px;align-items:center;cursor:pointer;font-size:14px;
  border:1px solid var(--line2);border-radius:7px;padding:8px 13px;background:var(--surface);
}
.donebtn input{accent-color:var(--accent);width:15px;height:15px}
.donebtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,15,.55);z-index:60;display:none}
.scrim.on{display:block}
.modal{
  position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(680px,92vw);max-height:86vh;overflow:auto;background:var(--surface);
  border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px;display:none;
}
.modal.on{display:block}
.modal h3{font-family:var(--serif);font-size:21px;margin:0 0 6px;font-weight:600}
.modal p{font-size:14px;color:var(--ink2);margin:0 0 14px}
.modal textarea{
  width:100%;height:270px;font-family:var(--mono);font-size:12px;line-height:1.55;
  border-radius:8px;border:1px solid var(--line);background:var(--console);color:var(--console-ink);padding:12px;
}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:13.5px;
  z-index:90;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- modo card ---------- */
.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.cardsegs{display:flex;gap:2px;flex:1 1 auto}
.cseg{flex:1 1 auto;height:3px;border-radius:2px;background:var(--line);transition:background .25s}
.cseg.on{background:var(--accent)}
.cardn{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.card{animation:cardin .24s cubic-bezier(.2,.7,.3,1)}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card .cbox,.card .note,.card .warn,.card .key,.card .tblw{margin-bottom:0}
.card>*+*{margin-top:16px}
.card p{margin:0}
.card h3{margin:0}
.cardq{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:-4px;
}
.next{
  width:100%;padding:14px 18px;font-size:15px;font-family:var(--sans);font-weight:600;
  border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;
  margin-top:26px;transition:transform .12s;
}
.next:hover{background:var(--accent2)}
.next:active{transform:scale(.985)}
:root[data-theme="dark"] .next{color:#08201c}
@media (prefers-color-scheme:dark){.next{color:#08201c}}
:root[data-theme="light"] .next{color:#fff}
.cardfoot{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.mini{
  background:none;border:0;color:var(--ink3);font-family:var(--sans);font-size:12px;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px;
}
.mini:hover{color:var(--accent)}

.win{text-align:center;padding:34px 20px 10px}
.win-k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.win-t{font-family:var(--serif);font-size:27px;font-weight:600;margin:10px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.win-s{font-size:15px;color:var(--ink2);max-width:44ch;margin:0 auto}
.win-stats{display:flex;gap:26px;justify-content:center;margin:26px 0 4px}
.win-n{font-family:var(--mono);font-size:23px;color:var(--accent);font-variant-numeric:tabular-nums}
.win-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:3px}

.streak{
  font-family:var(--mono);font-size:11.5px;color:var(--ink2);flex:0 0 auto;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.streak b{color:var(--accent);font-weight:400}
.goalbar{width:46px;height:3px;border-radius:2px;background:var(--line);display:inline-block;vertical-align:middle;margin-left:5px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr)}
  .pct{display:none}
  #btnMode{display:none}
  .brand-k{display:none}
  .brand{min-width:0}
  .brand-t{font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .top{gap:10px;padding:9px 12px}
  .streak{font-size:11px}
  .streak .s-w{display:none}
  .streak .s-sep{opacity:.45}
  .goalbar{width:30px;margin-left:6px}
  .opt{padding:12px 13px;font-size:14.5px}
  .next{padding:17px 18px;font-size:16px}
  .ans{font-size:16px;padding:12px}
  .main{padding-bottom:40px}
  .menu{display:block}
  .side{
    position:fixed;top:51px;left:0;width:290px;z-index:50;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--shadow);
  }
  .side.on{transform:translateX(0)}
  .main{padding:24px 20px 90px}
  .spectrum{display:none}
  .brand-t{font-size:15px}
  h2.title{font-size:25px}
}
</style>

<div class="app">
  <header class="top">
    <button class="menu" id="menu" aria-label="Abrir trilha">☰</button>
    <div class="brand">
      <span class="brand-k">Trilha</span>
      <h1 class="brand-t">R para Proteômica</h1>
    </div>
    <div class="spectrum" id="spectrum" role="navigation" aria-label="Progresso"></div>
    <div class="top-actions">
      <span class="streak" id="streak"></span>
      <button class="btn" id="btnMode">Aula inteira</button>
      <span class="pct" id="pct">0%</span>

<script>
(function(){
"use strict";

var TRILHA = [];

TRILHA.push({n:"B", title:"Base: lógica de programação, do zero", lessons:[

{id:"B.1", min:"7", title:"O que é escrever código", goal:"Entender o que você está fazendo quando digita uma linha — antes de digitar qualquer linha.",
blocks:[
 {t:"p",html:"Programar é <b>escrever uma receita</b> para alguém que segue instruções ao pé da letra e não entende nada de contexto. Esse alguém é o R."},
 {t:"p",html:"Se você diz a um colega “tira a média das amostras controle”, ele entende. O R não. Ele precisa que você diga: <i>quais linhas</i>, <i>de qual objeto</i>, <i>o que fazer com os valores faltantes</i>. Toda a dificuldade inicial do R é essa: aprender a ser explícito."},
 {t:"code",cap:"Uma instrução",code:'media_ctrl <- mean(c(11.05, 10.90, 8.94))'},
 {t:"p",html:"Lendo em português: <i>“calcule a média destes três números e guarde o resultado com o nome <code class=\"i\">media_ctrl</code>”</i>. Três partes: um <b>nome</b>, uma <b>ação</b> e os <b>dados</b>. Toda linha de R que você vai escrever tem essa forma."},
 {t:"porque",
  existe:"Porque análise feita no braço, clicando em planilha, não deixa rastro. Ninguém — nem você daqui a um mês — consegue dizer o que foi feito, em que ordem, com quais critérios.",
  faz:["Refazer a mesma análise em 3 tecidos mudando uma palavra","Provar exatamente o que você fez, quando o revisor perguntar","Corrigir um erro de critério e reprocessar tudo em segundos","Aplicar em 290 proteínas a mesma decisão, sem cansar nem errar"],
  sem:"Você repetiria cliques a cada amostra nova, e não teria como demonstrar que o resultado de hoje veio do mesmo procedimento de ontem."},
 {t:"note",title:"O que esperar de você mesmo",html:"<p>Ninguém decora R. Você vai consultar, errar, ler mensagem de erro e ajustar — <b>para sempre</b>, inclusive quem programa há vinte anos. A meta não é saber de cabeça: é saber o que procurar e entender a resposta.</p>"}
],
ex:[
 {type:"mc", q:"Por que o R não entende “tira a média das controle”?",
  opts:["Porque não fala português","Porque ele não sabe quais linhas são controle nem o que fazer com valores faltantes — isso precisa estar escrito","Porque falta instalar um pacote","Porque a frase é longa demais"],
  correct:1, why:"Ser explícito é o trabalho. O R não infere contexto — e é justamente isso que torna a análise auditável."}
]},

{id:"B.2", min:"9", title:"Objeto: guardar um valor e dar nome a ele", goal:"O primeiro tijolo: por que a gente nomeia coisas em vez de repetir valores.",
blocks:[
 {t:"p",html:"Um <b>objeto</b> é um valor guardado com um nome. A seta <code class=\"i\">&lt;-</code> significa “recebe”."},
 {t:"code",cap:"Guardando",code:'corte_fc <- 0.585'},
 {t:"p",html:"A partir daí, escrever <code class=\"i\">corte_fc</code> é a mesma coisa que escrever <code class=\"i\">0.585</code> — com uma diferença enorme: o nome diz o que aquilo <b>significa</b>."},
 {t:"code",cap:"Compare",code:'# Sem nome — o que é 0.585? você lembra daqui a 3 meses?\nsig <- p < 0.05 & abs(diff) > 0.585\n\n# Com nome — a linha se explica sozinha\ncorte_fc <- log2(1.5)\ncorte_p  <- 0.05\nsig <- p < corte_p & abs(diff) > corte_fc'},
 {t:"porque",
  existe:"Porque um número solto no meio do código não diz o que é, e porque decisões (o corte de fold change, o alfa, o nome do arquivo) aparecem em vários lugares. Sem nome, mudar de ideia significa caçar o valor linha por linha.",
  faz:["Trocar o corte de 1,5× para 2× mexendo em <b>uma</b> linha, e todo o script obedece","Escrever no topo do script todas as decisões da análise, juntas e visíveis","Guardar um resultado demorado (VSN, imputação) e reusar sem recalcular","Dar nome ao raciocínio: <code>amostras_ruins</code> comunica mais que uma lista solta"],
  sem:"Você repetiria o mesmo valor em 10 lugares e, ao mudar de critério, esqueceria de um — e o script rodaria sem erro, com resultado inconsistente."},
 {t:"warn",title:"Duas regras dos nomes",html:"<p>Não podem começar com número (<code class=\"i\">3dias</code> é inválido — vira <code class=\"i\">X3dias</code>) e maiúscula importa: <code class=\"i\">Dados</code> e <code class=\"i\">dados</code> são dois objetos diferentes.</p>"}
],
ex:[
 {type:"code", q:"Guarde o valor 0.05 num objeto chamado <code>corte_p</code>.",
  ans:["corte_p <- 0.05","corte_p = 0.05"], ph:"corte_p <- ...",
  why:"Atalho no RStudio para a seta: <code>Alt</code> + <code>-</code>", hint:"Nome, seta <code>&lt;-</code>, valor."},
 {type:"mc", q:"Você escreveu <code>Corte_p <- 0.05</code> e depois usou <code>corte_p</code>. O que acontece?",
  opts:["Funciona, o R ignora maiúsculas","Erro: <code>object 'corte_p' not found</code> — são dois nomes diferentes","O R corrige sozinho","Cria um segundo objeto vazio"],
  correct:1, why:"É o erro número um de quem começa. Quando aparecer <i>object not found</i>, confira maiúsculas antes de qualquer outra coisa."}
]},

{id:"B.3", min:"10", title:"Função: a máquina que transforma", goal:"Entender o que são aqueles parênteses — e por que existe função em vez de você fazer a conta.",
blocks:[
 {t:"p",html:"<b>Função</b> é uma máquina: você põe algo dentro dos parênteses, ela devolve um resultado."},
 {t:"code",cap:"Entra, sai",code:'log2(1024)\n# [1] 10\n\nmean(c(11.05, 10.90, 8.94))\n# [1] 10.29667\n\nlength(c("ctrl_1", "ctrl_5", "ctrl_9"))\n# [1] 3'},
 {t:"p",html:"O que vai dentro dos parênteses chama-se <b>argumento</b>. Muitas funções aceitam mais de um, separados por vírgula — e cada um tem nome:"},
 {t:"code",cap:"Argumentos com nome",code:'round(10.5673, digits = 2)\n# [1] 10.57\n\nmean(c(11.05, NA, 8.94), na.rm = TRUE)\n# [1] 9.995\n#      ^^^^^^^^^^^^ "ignore os valores faltantes"'},
 {t:"p",html:"Argumento com nome é o que te permite <b>ajustar o comportamento</b> da máquina sem trocar de máquina. <code class=\"i\">mean()</code> continua sendo média; <code class=\"i\">na.rm = TRUE</code> só diz o que fazer com buraco."},
 {t:"porque",
  existe:"Porque as mesmas operações aparecem em toda análise do mundo — média, desvio, log, ordenar, contar. Alguém já escreveu, testou e otimizou cada uma. Função é trabalho de terceiros que você reaproveita.",
  faz:["Fazer numa linha o que seria uma página de conta","Trocar o comportamento por argumento: <code>median()</code> em vez de <code>mean()</code>, com o resto igual","Confiar na implementação — <code>sd()</code> está certo, não é você que vai errar a fórmula","Encadear máquinas: pegar o resultado de uma e jogar na próxima"],
  sem:"Você reescreveria a fórmula do desvio padrão toda vez que precisasse dele, com risco de errar — e o seu código teria 300 linhas em vez de 20."},
 {t:"key",title:"Onde você já viu isso",html:"<p><code class=\"i\">test_diff(se, type = \"all\", fdr.type = \"BH\")</code> é exatamente a mesma estrutura: uma máquina (<code class=\"i\">test_diff</code>), o que entra (<code class=\"i\">se</code>) e dois ajustes de comportamento. Não é diferente de <code class=\"i\">round(10.5, digits = 2)</code> — só é maior.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que calcula a média de <code>c(11.05, NA, 8.94)</code> ignorando o valor faltante.",
  ans:["mean(c(11.05, NA, 8.94), na.rm = TRUE)","mean(c(11.05,NA,8.94),na.rm=T)"],
  ph:"mean(c(11.05, NA, 8.94), ...)",
  why:"Em proteômica você vai escrever <code>na.rm = TRUE</code> mil vezes. Sem ele, o resultado é NA.",
  hint:"Um segundo argumento, com nome, separado por vírgula."},
 {type:"mc", q:"O que <code>digits = 2</code> faz dentro de <code>round()</code>?",
  opts:["Cria um objeto chamado digits","Ajusta o comportamento da função: arredondar com 2 casas decimais","Arredonda para o número 2","É opcional e não muda nada"],
  correct:1, why:"Argumento nomeado é o botão de ajuste da máquina. Cada função tem os seus — e é isso que a documentação lista."}
]},

{id:"B.4", min:"9", title:"Tipos: número, texto e sim/não", goal:"Por que o R faz questão de saber se algo é número ou texto — e o que quebra quando ele erra.",
blocks:[
 {t:"p",html:"Todo valor no R tem um <b>tipo</b>. Três importam para você:"},
 {t:"table",head:["Tipo","Exemplo","É o quê"],rows:[
  ["<code>numeric</code>","<code>11.05</code>","Número. Aceita conta."],
  ["<code>character</code>","<code>\"Q8R5L1\"</code>","Texto. Sempre entre aspas. Não aceita conta."],
  ["<code>logical</code>","<code>TRUE</code>","Sim ou não. Sem aspas, maiúsculo."]
 ]},
 {t:"code",cap:"O tipo decide o que é possível",code:'11.05 * 2        # 22.1     — número aceita conta\n"11.05" * 2      # Error: argument is not numeric\n\nclass(11.05)     # "numeric"\nclass("11.05")   # "character"   <- as aspas mudam tudo'},
 {t:"p",html:"Repare: <code class=\"i\">\"11.05\"</code> com aspas é <b>texto</b>. Parece número para você, mas para o R é uma palavra — e palavra não se multiplica."},
 {t:"porque",
  existe:"Porque somar dois textos não faz sentido, e o computador precisa de uma regra para decidir o que é permitido. O tipo é essa regra — e é o que permite o R te avisar em vez de produzir bobagem.",
  faz:["Descobrir na hora por que uma coluna não aceita conta (<code>str()</code> mostra o tipo)","Converter de propósito: <code>as.numeric()</code>, <code>as.character()</code>","Usar TRUE/FALSE como 1 e 0 e contar coisas com <code>sum()</code>","Confiar que uma coluna de intensidade é mesmo numérica antes de rodar estatística"],
  sem:"O R tentaria adivinhar, e um arquivo com decimal em vírgula viraria silenciosamente texto — todas as suas médias sairiam como NA sem nenhum erro na tela."},
 {t:"key",title:"Isso vai te acontecer",html:"<p>Export com decimal em vírgula (<code class=\"i\">\"1234,5\"</code>) é lido como <b>texto</b>. A coluna de intensidade inteira vira <code class=\"i\">character</code> e a análise falha lá na frente, longe da causa. O reflexo certo é rodar <code class=\"i\">str()</code> logo depois de ler qualquer arquivo.</p>"}
],
ex:[
 {type:"mc", q:"<code>str()</code> mostra a coluna de intensidade como <code>chr</code>. O que isso significa?",
  opts:["Está tudo certo","Ela foi lida como texto — provavelmente decimal com vírgula; nenhuma conta vai funcionar","Faltam valores","A coluna está vazia"],
  correct:1, why:"<code>chr</code> = character = texto. É o momento de voltar e corrigir a leitura, não de seguir adiante."},
 {type:"code", q:"Escreva o comando que mostra o tipo do valor <code>\"Q8R5L1\"</code>.",
  ans:["class(\"Q8R5L1\")","typeof(\"Q8R5L1\")"], ph:'class(...)',
  why:"Devolve <code>\"character\"</code>. Para um objeto inteiro, prefira <code>str()</code>, que mostra tudo de uma vez.",
  hint:"Uma função de 5 letras que responde 'que classe é isto?'."}
]},

{id:"B.5", min:"11", title:"Vetor: muitos valores num objeto só", goal:"A ideia que faz o R valer a pena — e que transforma 290 contas em uma linha.",
blocks:[
 {t:"p",html:"Até agora, um nome guardava um valor. Um <b>vetor</b> guarda vários, em ordem. Cria-se com <code class=\"i\">c()</code> (de <i>combine</i>)."},
 {t:"code",cap:"Um objeto, muitos valores",code:'medianas <- c(11.05, 10.90, 8.94, 10.99)\n\nmedianas\n# [1] 11.05 10.90  8.94 10.99\n\nlength(medianas)   # 4'},
 {t:"h",text:"A parte que importa"},
 {t:"p",html:"Quando você faz uma conta com um vetor, ela acontece em <b>todos</b> os valores de uma vez. Não existe repetição no seu código."},
 {t:"code",cap:"Uma linha, quatro contas",code:'medianas - 10\n# [1] 1.05 0.90 -1.06 0.99\n\nmedianas > 10\n# [1]  TRUE  TRUE FALSE  TRUE'},
 {t:"p",html:"Isso se chama <b>vetorização</b>, e é a diferença entre o R e a maioria das linguagens. É o motivo de <code class=\"i\">log2(matriz)</code> transformar 290 proteínas × 12 amostras numa linha só."},
 {t:"porque",
  existe:"Porque em ciência de dados você quase nunca tem um número — tem uma coluna inteira. A linguagem foi construída assumindo isso, então a operação padrão já age sobre o conjunto todo.",
  faz:["Aplicar log2 em toda a matriz de intensidades numa linha","Comparar as 12 medianas com um limiar de uma vez e ver quais amostras destoam","Somar, contar e resumir uma coluna inteira sem escrever repetição","Trabalhar com 290 proteínas com o mesmo esforço de trabalhar com 3"],
  sem:"Cada operação exigiria escrever uma repetição explícita, e o código ficaria longo, lento e cheio de lugares onde errar um índice."},
 {t:"warn",title:"Um vetor guarda um tipo só",html:"<p><code class=\"i\">c(11.05, \"ctrl\")</code> não dá erro: o R converte <b>tudo</b> para texto silenciosamente. É por isso que dados e anotação ficam separados — números de um lado, nomes do outro.</p>"}
],
ex:[
 {type:"code", q:"Crie um vetor chamado <code>medianas</code> com os valores 11.05, 10.90 e 8.94.",
  ans:["medianas <- c(11.05, 10.90, 8.94)","medianas <- c(11.05,10.90,8.94)","medianas = c(11.05, 10.90, 8.94)"],
  ph:"medianas <- c(...)", why:"O <code>c()</code> é a função mais usada do R inteiro.",
  hint:"Nome, seta, e <code>c()</code> com os valores separados por vírgula."},
 {type:"mc", q:"<code>intensidades / 1000</code>, onde <code>intensidades</code> tem 290 valores, devolve o quê?",
  opts:["Um número","290 valores, cada um dividido por 1000","Erro","Só o primeiro valor dividido"],
  correct:1, why:"Vetorização: a conta acontece em todos os elementos. É o comportamento padrão, não um recurso especial."}
]},

{id:"B.6", min:"11", title:"Condição: perguntas que devolvem TRUE ou FALSE", goal:"Como uma pergunta vira um filtro — a base de tudo que você faz com dado.",
blocks:[
 {t:"p",html:"Uma <b>comparação</b> é uma pergunta. A resposta é sempre <code class=\"i\">TRUE</code> ou <code class=\"i\">FALSE</code>."},
 {t:"code",cap:"Perguntando",code:'10.5 > 10        # TRUE\n10.5 == 10       # FALSE   (dois iguais! um só é atribuição)\n"ctrl" != "d14"  # TRUE    (diferente de)'},
 {t:"warn",title:"= e ==",html:"<p><code class=\"i\">=</code> atribui. <code class=\"i\">==</code> pergunta. Trocar os dois é o erro clássico de quem está começando.</p>"},
 {t:"h",text:"Perguntando para um vetor inteiro"},
 {t:"code",cap:"Uma pergunta, várias respostas",code:'medianas <- c(11.05, 10.90, 8.94, 10.99)\n\nmedianas < 10\n# [1] FALSE FALSE  TRUE FALSE\n#                   ^^^^ a terceira amostra'},
 {t:"p",html:"Esse vetor de TRUE/FALSE é a peça central do R. Ele serve para <b>duas</b> coisas:"},
 {t:"code",cap:"Contar e selecionar",code:'# 1) CONTAR — TRUE vale 1, FALSE vale 0\nsum(medianas < 10)\n# [1] 1     <- uma amostra abaixo de 10\n\n# 2) SELECIONAR — colchete devolve só onde é TRUE\nmedianas[medianas < 10]\n# [1] 8.94'},
 {t:"porque",
  existe:"Porque toda decisão sobre dado é uma pergunta aplicada a muitas linhas: quais proteínas são significativas, quais amostras estão fracas, quais accessions são contaminantes. TRUE/FALSE é como o computador guarda a resposta dessas perguntas.",
  faz:["Contar proteínas significativas: <code>sum(q &lt; 0.05)</code>","Achar a amostra ruim: <code>names(medianas[medianas &lt; 10])</code>","Combinar critérios com <code>&amp;</code> (e) e <code>|</code> (ou) — é literalmente o que o <code>add_rejections</code> faz","Contar valores faltantes: <code>sum(is.na(x))</code>"],
  sem:"Você olharia tabela de 290 linhas com o olho para achar as que interessam — e teria que refazer isso a cada análise nova."},
 {t:"key",title:"Isso é o seu corte de significância",html:"<p><code class=\"i\">p &lt; 0.05 &amp; abs(diff) &gt; 0.585</code>. Duas perguntas ligadas por “e”, aplicadas às 290 proteínas de uma vez. O <code class=\"i\">add_rejections()</code> não faz nada além disso.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que conta quantos valores do vetor <code>p_adj</code> são menores que 0.05.",
  ans:["sum(p_adj < 0.05)","sum(p_adj < 0.05, na.rm = TRUE)"], ph:"sum(...)",
  why:"TRUE vale 1, FALSE vale 0 — somar lógicos é contar. Na prática, acrescente <code>na.rm = TRUE</code>.",
  hint:"<code>sum()</code> em volta da pergunta."},
 {type:"mc", q:"Qual a diferença entre <code>x = 5</code> e <code>x == 5</code>?",
  opts:["Nenhuma","O primeiro guarda 5 em x; o segundo pergunta se x vale 5 e devolve TRUE/FALSE","O segundo dá erro","O primeiro é mais rápido"],
  correct:1, why:"Um sinal atribui, dois perguntam. Se você escrever <code>filter(dados, p = 0.05)</code> em vez de <code>p &lt; 0.05</code>, o resultado não é o que você espera."}
]},

{id:"B.7", min:"10", title:"Fazer o mesmo com muitos itens", goal:"A ideia de repetição — e por que no R ela quase sempre é invisível.",
blocks:[
 {t:"p",html:"Você tem três tecidos e quer a mesma análise nos três. Existem duas formas de dizer isso."},
 {t:"h",text:"1. A repetição explícita"},
 {t:"code",cap:"for: 'para cada um destes, faça isso'",code:'tecidos <- c("cerebelo", "hipocampo", "medula")\n\nfor (tec in tecidos) {\n  cat("Analisando", tec, "\\n")\n}\n# Analisando cerebelo\n# Analisando hipocampo\n# Analisando medula'},
 {t:"p",html:"<code class=\"i\">tec</code> é um nome temporário: na primeira volta vale <code class=\"i\">\"cerebelo\"</code>, na segunda <code class=\"i\">\"hipocampo\"</code>, na terceira <code class=\"i\">\"medula\"</code>. Tudo entre as chaves acontece uma vez por item."},
 {t:"h",text:"2. A repetição invisível"},
 {t:"p",html:"Para contas em vetor, você <b>não precisa</b> de repetição — a vetorização da aula B.5 já faz. Esta é a diferença que confunde quem vem de outra linguagem:"},
 {t:"code",cap:"Não faça isto no R",code:'# Desnecessário:\nresultado <- c()\nfor (i in 1:length(medianas)) {\n  resultado[i] <- log2(medianas[i])\n}\n\n# Basta:\nresultado <- log2(medianas)'},
 {t:"porque",
  existe:"Porque análise real nunca é um caso só: são 3 tecidos, 6 contrastes, 12 amostras, 24 corridas. Repetição é o que impede que você copie e cole o mesmo bloco mudando um nome — e esqueça de mudar num deles.",
  faz:["Rodar o pipeline nos 3 tecidos escrevendo a análise uma vez","Gerar os 6 volcanos e salvar cada um com o nome certo, automaticamente","Ler 24 arquivos e juntar tudo numa tabela só","Trocar um critério e reprocessar tudo, sem risco de esquecer um caso"],
  sem:"Você teria três cópias quase iguais do script. Ao corrigir um erro, arrumaria duas e esqueceria a terceira — e ninguém perceberia."},
 {t:"note",title:"A regra prática",html:"<p>Conta em vetor ou coluna: <b>não use repetição</b>, o R já faz. Tarefa por arquivo, por tecido ou por contraste: <b>use <code class=\"i\">for</code></b>. Se você copiou um bloco três vezes, é sinal de que faltou um <code class=\"i\">for</code>.</p>"}
],
ex:[
 {type:"mc", q:"Você quer o log2 de todos os 290 valores do vetor <code>x</code>. O que escrever?",
  opts:["Um <code>for</code> percorrendo os 290","<code>log2(x)</code>","Um <code>for</code> com <code>if</code> dentro","Chamar <code>log2()</code> 290 vezes"],
  correct:1, why:"Vetorização resolve. <code>for</code> fica para tarefas por arquivo/tecido/contraste, não para contas em vetor."},
 {type:"code", q:"Escreva o <code>for</code> que percorre o vetor <code>tecidos</code> imprimindo cada nome com <code>cat()</code>.",
  ans:["re:for\\s*\\(\\s*tec\\s+in\\s+tecidos\\s*\\)\\s*\\{?\\s*cat\\(\\s*tec.*\\)",
       "re:for\\s*\\(\\s*t\\s+in\\s+tecidos\\s*\\)\\s*\\{?\\s*cat\\(\\s*t.*\\)"],
  ph:'for (tec in tecidos) cat(tec, "\\n")',
  why:"O nome da variável do loop é escolha sua — <code>tec</code>, <code>t</code>, <code>x</code>, tanto faz.",
  hint:"<code>for (nome in vetor)</code> e depois o que fazer."}
]},

{id:"B.8", min:"10", title:"Como o R lê a sua linha", goal:"Entender a ordem em que as coisas acontecem — e por que parênteses aninhados confundem.",
blocks:[
 {t:"p",html:"O R resolve <b>de dentro para fora</b>. Numa linha com funções aninhadas, a mais interna acontece primeiro."},
 {t:"code",cap:"A ordem",code:'round(mean(log2(c(1024, 2048))), 1)'},
 {t:"list",items:[
  "<code class=\"i\">c(1024, 2048)</code> → cria o vetor",
  "<code class=\"i\">log2(...)</code> → vira <code class=\"i\">10, 11</code>",
  "<code class=\"i\">mean(...)</code> → vira <code class=\"i\">10.5</code>",
  "<code class=\"i\">round(..., 1)</code> → devolve <code class=\"i\">10.5</code>"
 ]},
 {t:"p",html:"É por isso que uma linha longa é difícil de ler: você tem que começar pelo miolo. Quando travar, <b>rode por partes</b> — execute só o pedaço de dentro e olhe o que sai."},
 {t:"code",cap:"Depurando por partes",code:'# Em vez de olhar a linha inteira e adivinhar:\nc(1024, 2048)\n# [1] 1024 2048\n\nlog2(c(1024, 2048))\n# [1] 10 11\n\nmean(log2(c(1024, 2048)))\n# [1] 10.5'},
 {t:"h",text:"Os parênteses precisam fechar"},
 {t:"code",cap:"O sinal de + no console",code:'mean(c(11.05, 10.90\n# +\n\n# O "+" significa: "sua linha não terminou, estou esperando".\n# Feche os parênteses ou aperte Esc para cancelar.'},
 {t:"porque",
  existe:"Porque uma análise é uma sequência de transformações, e alguma ordem tem que valer. De dentro para fora é a regra da matemática — a mesma dos parênteses de uma equação.",
  faz:["Prever o que uma linha faz antes de rodá-la","Achar erro rodando a linha em pedaços, em vez de tentar coisas ao acaso","Entender por que a ordem do pipeline importa: zeros→NA <b>antes</b> do log2, normalizar <b>antes</b> de testar","Reescrever uma linha aninhada com o pipe, para ler na ordem natural (módulo 4)"],
  sem:"Você trataria cada linha como uma caixa-preta que funciona ou não funciona, sem ter onde procurar quando falha."},
 {t:"key",title:"Onde isso te salva",html:"<p>Quando <code class=\"i\">log2(as.matrix(prog[, 5:16]))</code> der erro, você não vai olhar a linha inteira. Vai rodar <code class=\"i\">prog[, 5:16]</code>, depois <code class=\"i\">as.matrix(...)</code>, e ver em qual passo o resultado deixou de ser o esperado. Esse é o método, e ele funciona sempre.</p>"}
],
ex:[
 {type:"mc", q:"Em <code>round(mean(x), 2)</code>, o que acontece primeiro?",
  opts:["<code>round</code>","<code>mean(x)</code>","Os dois ao mesmo tempo","Depende do valor de x"],
  correct:1, why:"De dentro para fora: a média é calculada e só então o resultado é arredondado."},
 {type:"mc", q:"O console mostra <code>+</code> em vez de <code>&gt;</code>. O que houve?",
  opts:["Erro de sintaxe","O comando está incompleto — falta fechar parêntese ou aspas","O R travou","Está somando algo"],
  correct:1, why:"O <code>+</code> é o R esperando o resto do comando. Feche o que falta ou aperte <code>Esc</code> para cancelar e recomeçar."},
 {type:"do", q:"Pratique o método:", q2:"Peguei uma linha aninhada do meu script e rodei ela em pedaços, do miolo para fora, olhando o resultado de cada etapa."}
]}
]});

TRILHA.push({n:"0", title:"Antes de escrever código", lessons:[

{id:"0.1", min:"6", title:"Como usar este curso", goal:"Entender a regra do jogo — e por que copiar e colar não vai te tirar da dependência.",
blocks:[
 {t:"p",html:"Você já roda análise de proteômica em R. O que falta não é ferramenta, é <b>modelo mental</b>: saber o que cada linha faz, por que ela está ali, e o que acontece se você mudar um argumento. Sem isso, cada análise nova vira um pedido de socorro."},
 {t:"p",html:"Este curso não usa <code class=\"i\">mtcars</code> nem <code class=\"i\">iris</code>. Todos os exemplos são <b>os seus dados</b>: export do Progenesis com abundância raw e normalized, a tabela <code class=\"i\">input_dep2_*.txt</code>, os três tecidos do projeto do Rafael, a saliva do estudo de pulpite."},
 {t:"h",text:"As quatro regras"},
 {t:"list",items:[
  "<b>Digite o código, não copie.</b> O botão de copiar existe para blocos longos. Nos curtos, digitar é o que fixa. Errar de digitação e ler o erro é metade do aprendizado.",
  "<b>Rode tudo no RStudio de verdade.</b> Este site não executa R — de propósito. Você precisa ver o erro na sua máquina, com a sua versão (R 4.6.0), com os seus pacotes.",
  "<b>Uma aula por vez, sem pressa.</b> São 20 a 30 minutos por dia. Em seis semanas você fecha a trilha.",
  "<b>Anote as dúvidas no campo do fim da aula.</b> O botão <b>Feedback</b> junta tudo num relatório — cole no chat e eu ajusto o curso, explico de outro jeito ou aplico a aula direto nos seus arquivos."
 ]},
 {t:"note",title:"O que o site guarda",html:"<p>Progresso, respostas e anotações ficam salvos <b>neste navegador</b> (localStorage). Fechar a aba não perde nada. Limpar dados do navegador, sim — por isso, gere o relatório de vez em quando.</p>"},
 {t:"key",title:"Onde isso te leva",html:"<p>No fim você vai conseguir abrir um export novo do Progenesis, montar a matriz, decidir filtro/normalização/imputação com critério, rodar a estatística e sair com volcano e tabela — <b>escrevendo o script você mesmo</b>, e sabendo defender cada escolha na hora que o revisor perguntar.</p>"}
],
ex:[
 {type:"do", q:"Confirme o básico antes de seguir:", q2:"Abri o RStudio e confirmei a versão do R rodando <code>R.version.string</code> no console. (A sua é 4.6.0, em C:/Program Files/R/R-4.6.0.)"}
]},

{id:"0.2", min:"12", title:"RStudio: os quatro painéis e o Project", goal:"Parar de perder arquivo e de brigar com caminho. Trabalhar dentro de um Project, sempre.",
blocks:[
 {t:"p",html:"O RStudio tem quatro painéis. Você provavelmente usa dois. Os outros dois resolvem 80% das suas dúvidas do tipo “o que tem dentro desse objeto?”."},
 {t:"table",head:["Painel","O que é","Quando olhar"],rows:[
  ["<b>Source</b> (cima esq.)","Seu script <code>.R</code>. O que fica salvo.","Sempre. É aqui que você escreve."],
  ["<b>Console</b> (baixo esq.)","Onde o R executa. Nada aqui é salvo.","Para testes rápidos e para ler erros."],
  ["<b>Environment</b> (cima dir.)","Todos os objetos vivos na sessão.","Quando quiser ver dimensão de tabela, tipo, se o objeto existe."],
  ["<b>Files/Plots/Packages/Help</b>","Arquivos, gráficos, pacotes, documentação.","<code>?funcao</code> abre aqui. Use muito."]
 ]},
 {t:"h",text:"Script vs console"},
 {t:"p",html:"Regra: <b>tudo que importa vai no script</b>. O console é rascunho. Com o cursor numa linha do script, <code class=\"i\">Ctrl+Enter</code> manda ela para o console e avança. Selecione um bloco e <code class=\"i\">Ctrl+Enter</code> roda o bloco todo."},
 {t:"h",text:"Project: o fim do setwd()"},
 {t:"p",html:"Se o seu script começa com <code class=\"i\">setwd(\"C:/Users/Bioinfo/Documents/Mateus/...\")</code>, ele quebra em qualquer outra máquina — inclusive na sua, quando você mover a pasta. A solução é o <b>RStudio Project</b>."},
 {t:"p",html:"<b>File → New Project → Existing Directory</b>, aponte para a pasta do estudo (por exemplo <code class=\"i\">Dados_Rafael_UFPA</code>). Isso cria um arquivo <code class=\"i\">.Rproj</code>. Ao abrir o projeto por esse arquivo, o diretório de trabalho já é a pasta do estudo, e todos os caminhos passam a ser relativos:"},
 {t:"code",cap:"Caminhos relativos dentro de um Project",code:'# Sem Project (frágil):\n# setwd("C:/Users/Bioinfo/Documents/Mateus/Dados_Rafael_UFPA")\n# dados <- read.delim("C:/Users/Bioinfo/Documents/Mateus/Dados_Rafael_UFPA/input_dep2_cerebelo_raw.txt")\n\n# Com Project (robusto):\ndados <- read.delim("input_dep2_cerebelo_raw.txt")\n\n# Confere onde o R acha que está:\ngetwd()'},
 {t:"key",title:"No seu caso",code:"",html:"<p>Você tem pelo menos quatro estudos separados: <code class=\"i\">Dados_Rafael_UFPA</code> (cerebelo, hipocampo, medula), <code class=\"i\">Dados_Rogerio_UNESP_Aracatuba</code> (pulpite), <code class=\"i\">Dados_Profa_Talita</code> (pâncreas) e o material do Skyline. <b>Um Project para cada.</b> Isso resolve sozinho o problema de rodar o <code class=\"i\">qc_proteomica.R</code> em estudos diferentes: você troca de projeto, não de caminho.</p>"},
 {t:"h",text:"Atalhos que valem a pena decorar"},
 {t:"table",head:["Atalho","Faz"],rows:[
  ["<code>Ctrl+Enter</code>","Roda a linha ou a seleção"],
  ["<code>Ctrl+Shift+Enter</code>","Roda o script inteiro"],
  ["<code>Ctrl+Shift+M</code>","Insere o pipe <code>%&gt;%</code> (ou <code>|&gt;</code>)"],
  ["<code>Alt+-</code>","Insere <code>&lt;-</code>"],
  ["<code>Ctrl+L</code>","Limpa o console"],
  ["<code>Tab</code>","Autocompletar nome de objeto, função ou coluna"],
  ["<code>F1</code>","Ajuda da função sob o cursor"]
 ]},
 {t:"warn",title:"Sessão limpa",html:"<p>Em <b>Tools → Global Options → General</b>, desmarque <i>Restore .RData into workspace at startup</i> e ponha <i>Save workspace to .RData on exit: Never</i>. Restaurar workspace antigo é a maior fonte de “funcionava ontem”: você fica com objetos velhos vivos sem saber. É o mesmo motivo pelo qual o seu <code class=\"i\">qc_proteomica.R</code> deve rodar via <code class=\"i\">Rscript</code>, em sessão limpa.</p>"}
],
ex:[
 {type:"mc", q:"Você mandou o script para a colega e ela diz que dá erro logo na primeira linha. O que mais provavelmente está errado?",
  opts:["A versão do R dela é diferente","Há um <code>setwd()</code> com caminho da sua máquina","Ela não instalou o DEP2","O arquivo de dados está corrompido"],
  correct:1, why:"Caminho absoluto é a causa número um de script que não roda em outro lugar. Project + caminho relativo resolve."},
 {type:"do", q:"Faça agora:", q2:"Criei um RStudio Project na pasta de um dos meus estudos e confirmei com <code>getwd()</code> que o diretório é o certo."}
]},

{id:"0.3", min:"12", title:"Ler uma mensagem de erro sem entrar em pânico", goal:"Traduzir os cinco erros que você mais vai ver — e saber o que fazer em cada um.",
blocks:[
 {t:"p",html:"Erro em R não é castigo, é diagnóstico. Quase todo erro seu vai cair em um destes cinco. Aprender a lê-los é o que mais rápido te tira da dependência."},
 {t:"table",head:["Mensagem","Significa","O que fazer"],rows:[
  ["<code>object 'x' not found</code>","O objeto não existe nessa sessão","Você não rodou a linha que cria <code>x</code>, ou errou maiúscula/minúscula. R diferencia <code>Dados</code> de <code>dados</code>."],
  ["<code>could not find function \"foo\"</code>","O pacote não foi carregado ou não está instalado","<code>library(pacote)</code>, ou <code>install.packages()</code>. Se está instalado, use <code>pacote::foo()</code>."],
  ["<code>unused argument (x = ...)</code>","A função não tem esse argumento","Abra <code>?funcao</code>. Muito comum quando a versão do pacote mudou a assinatura."],
  ["<code>subscript out of bounds</code>","Você pediu a coluna/linha 15 de algo que tem 12","Confira com <code>dim()</code> antes de indexar."],
  ["<code>argument is not numeric or logical</code>","Você mandou texto para uma conta","A coluna virou <code>character</code> na leitura — decimal com vírgula, ou uma linha de cabeçalho no meio dos dados."]
 ]},
 {t:"h",text:"Erro vs aviso"},
 {t:"p",html:"<b>Error</b> interrompe: nada depois rodou. <b>Warning</b> não interrompe: o código rodou, mas o R está avisando de algo. Aviso de <code class=\"i\">NAs introduced by coercion</code> é grave apesar de ser “só” um warning — significa que virou <code class=\"i\">NA</code> silenciosamente, e você vai fazer estatística em cima de buraco."},
 {t:"code",cap:"O erro clássico do decimal com vírgula",code:'x <- c("11,05", "8,94", "10,2")\nmean(x)\n# Error in mean.default(x) : argument is not numeric or logical\n\n# O R leu como texto porque o decimal veio com vírgula.\nas.numeric(x)\n# [1] NA NA NA\n# Warning: NAs introduced by coercion\n\n# Certo:\nas.numeric(sub(",", ".", x, fixed = TRUE))\n# [1] 11.05  8.94 10.20'},
 {t:"key",title:"No seu caso",html:"<p>O export do Skyline (<code class=\"i\">teste2.csv</code>) veio com separador <code class=\"i\">;</code> e decimal <code class=\"i\">,</code>. Se você abrir com <code class=\"i\">read.csv()</code> puro, <b>toda</b> a coluna <i>Total Area MS1</i> vira texto e some na primeira conta. Na aula 3.5 a gente resolve isso na leitura, que é o lugar certo.</p>"},
 {t:"h",text:"O reflexo certo"},
 {t:"list",items:[
  "Leia a <b>última</b> linha do erro primeiro: é a mensagem real.",
  "Leia o <code class=\"i\">in ...</code>: diz em qual função quebrou.",
  "Rode a linha em pedaços. Se a linha tem três funções aninhadas, rode a de dentro sozinha e olhe o resultado.",
  "Use <code class=\"i\">str(objeto)</code> — 90% dos erros são o objeto não ser o que você pensa que é."
 ]}
],
ex:[
 {type:"mc", q:"<code>Error in test_diff(se, type = \"all\") : could not find function \"test_diff\"</code>. Qual a causa mais provável?",
  opts:["O objeto <code>se</code> está vazio","Faltou <code>library(DEP2)</code> na sessão","O argumento <code>type</code> não existe","O R está desatualizado"],
  correct:1, why:"<code>could not find function</code> é sempre pacote: não carregado ou não instalado. Se estivesse carregado mas com assinatura diferente, o erro seria <i>unused argument</i>."},
 {type:"code", q:"Escreva o comando que mostra a estrutura do objeto <code>dados</code> — tipo de cada coluna, dimensões, primeiros valores.",
  ans:["str(dados)"], ph:"str(...)", why:"<code>str()</code> é o seu primeiro comando diante de qualquer objeto estranho.",
  hint:"É uma função de três letras, abreviação de <i>structure</i>."}
]}
]});

TRILHA.push({n:"1", title:"Os tijolos da linguagem", lessons:[

{id:"1.1", min:"12", title:"Objetos, atribuição e tipos", goal:"Entender o que é um objeto, os quatro tipos que importam, e por que o tipo errado estraga a análise.",
blocks:[
 {t:"p",html:"Em R, tudo que você guarda é um <b>objeto</b>, e você guarda com <code class=\"i\">&lt;-</code>. Leia a seta como “recebe”."},
 {t:"code",cap:"Atribuição",code:'intensidade <- 4321.7      # cria o objeto\nintensidade                # digitar o nome mostra o valor\n# [1] 4321.7\n\nintensidade * 2            # usa, mas NÃO altera o objeto\nintensidade <- intensidade * 2   # agora sim, alterou'},
 {t:"p",html:"O <code class=\"i\">[1]</code> na saída não é o valor: é o índice do primeiro elemento mostrado na linha. Quando a saída tem muitos números, você verá <code class=\"i\">[1]</code>, <code class=\"i\">[18]</code>, <code class=\"i\">[35]</code>… marcando onde cada linha começa."},
 {t:"h",text:"Os quatro tipos que você vai usar"},
 {t:"table",head:["Tipo","Exemplo","Onde aparece nos seus dados"],rows:[
  ["<code>numeric</code> (double)","<code>4321.7</code>","Abundância, log2, p-valor, fold change"],
  ["<code>character</code>","<code>\"Q8R5L1\"</code>","Accession, gene, nome da amostra, condição"],
  ["<code>logical</code>","<code>TRUE</code> / <code>FALSE</code>","Resultado de comparação; coluna <code>_significant</code> do DEP2"],
  ["<code>integer</code>","<code>12L</code>","Contagens (nº de peptídeos, nº de proteínas). Raramente você cria à mão."]
 ]},
 {t:"code",cap:"Descobrindo e mudando o tipo",code:'class(4321.7)        # "numeric"\nclass("Q8R5L1")      # "character"\nclass(TRUE)          # "logical"\n\n# Conversão explícita\nas.numeric("11.05")  # 11.05\nas.character(11.05)  # "11.05"\n\n# TRUE vale 1 e FALSE vale 0 — isso é MUITO útil:\nsum(c(TRUE, FALSE, TRUE, TRUE))   # 3'},
 {t:"porque",
  existe:"Porque o computador precisa saber o que é permitido fazer com cada valor. Número aceita conta, texto não, e sim/não vira 1 e 0. O tipo é essa regra — e é ela que permite o R avisar você em vez de produzir bobagem.",
  faz:["Contar qualquer coisa sem loop: <code>sum(is.na(x))</code>, <code>sum(p &lt; 0.05)</code>","Descobrir por que uma coluna de intensidade não aceita <code>log2()</code>","Converter de propósito com <code>as.numeric()</code> em vez de torcer","Confiar que a matriz que vai para o limma é mesmo numérica"],
  sem:"Um arquivo com decimal em vírgula viraria texto silenciosamente, e todas as suas médias sairiam NA — sem uma única mensagem de erro apontando a causa."},
 {t:"key",title:"Por que isso importa",html:"<p>Aquele truque do <code class=\"i\">sum()</code> em lógico é como você conta qualquer coisa em proteômica sem escrever um loop: <code class=\"i\">sum(is.na(x))</code> conta missing values, <code class=\"i\">sum(p &lt; 0.05)</code> conta proteínas significativas, <code class=\"i\">sum(abund &gt; 0)</code> conta proteínas identificadas numa corrida.</p>"},
 {t:"h",text:"Nomes de objeto"},
 {t:"p",html:"Podem ter letras, números, <code class=\"i\">.</code> e <code class=\"i\">_</code>, mas <b>não podem começar com número</b>. Isso não é curiosidade — é a origem de um problema seu: quando um nome de amostra é <code class=\"i\">3dias_2</code>, o R o transforma em <code class=\"i\">X3dias_2</code> ao virar nome de coluna. Voltamos nisso na aula 5.4."},
 {t:"warn",title:"Evite",html:"<p>Não nomeie objetos como funções existentes: <code class=\"i\">data</code>, <code class=\"i\">df</code> até tudo bem, mas <code class=\"i\">c</code>, <code class=\"i\">mean</code>, <code class=\"i\">sum</code>, <code class=\"i\">T</code> e <code class=\"i\">F</code> são péssimas ideias. Escreva sempre <code class=\"i\">TRUE</code>/<code class=\"i\">FALSE</code> por extenso — <code class=\"i\">T</code> e <code class=\"i\">F</code> podem ser sobrescritos.</p>"}
],
ex:[
 {type:"code", q:"Crie um objeto chamado <code>lfc_corte</code> guardando o log2 de 1.5 (o corte de fold change que você usa no <code>add_rejections</code>).",
  ans:["lfc_corte <- log2(1.5)","lfc_corte = log2(1.5)"], ph:"lfc_corte <- ...",
  why:"log2(1.5) = 0.585 — exatamente o valor que aparece no seu script.", hint:"Use a seta <code>&lt;-</code> e a função <code>log2()</code>."},
 {type:"mc", q:"<code>sum(c(TRUE, TRUE, FALSE, NA), na.rm = TRUE)</code> devolve o quê?",
  opts:["<code>3</code>","<code>2</code>","<code>NA</code>","Erro"], correct:1,
  why:"TRUE vale 1, FALSE vale 0, e <code>na.rm = TRUE</code> descarta o NA. Sobra 1+1 = 2."}
]},

{id:"1.2", min:"12", title:"Vetores e vetorização", goal:"Entender por que em R você quase nunca precisa de loop — e como isso vira log2 da matriz inteira numa linha.",
blocks:[
 {t:"p",html:"Um <b>vetor</b> é uma sequência de valores do mesmo tipo. É a estrutura mais fundamental do R — na prática, cada coluna da sua tabela é um vetor."},
 {t:"code",cap:"Criando vetores",code:'# c() = combine\nabund <- c(1520.3, 980.1, 2410.8, 1105.0)\namostras <- c("ctrl_1", "ctrl_5", "ctrl_9", "3dias_2")\n\nlength(abund)   # 4\n\n# Sequências\n1:12                    # 1 2 3 ... 12\nseq(5, 16)              # colunas 5 a 16 = "Normalized abundance"\nrep("ctrl", 3)          # "ctrl" "ctrl" "ctrl"'},
 {t:"h",text:"Vetorização: a ideia central"},
 {t:"p",html:"Operação em vetor se aplica a <b>todos</b> os elementos de uma vez. Não existe loop no seu código, e mesmo assim a conta acontece elemento a elemento."},
 {t:"code",cap:"Uma linha, quatro contas",code:'abund <- c(1520.3, 980.1, 2410.8, 1105.0)\n\nlog2(abund)\n# [1] 10.570  9.937 11.235 10.110\n\nabund / 1000\n# [1] 1.5203 0.9801 2.4108 1.1050\n\nabund > 1200\n# [1]  TRUE FALSE  TRUE FALSE'},
 {t:"porque",
  existe:"Porque em análise de dados você quase nunca tem um número — tem uma coluna inteira. O R foi construído assumindo isso: a operação padrão já age sobre o conjunto todo, sem você pedir.",
  faz:["Transformar a matriz inteira em log2 numa linha","Comparar as 12 medianas com um limiar de uma vez e ver quais destoam","Dividir toda uma amostra por um fator de normalização de uma vez","Trabalhar com 290 proteínas com o mesmo esforço de trabalhar com 3"],
  sem:"Cada operação exigiria uma repetição explícita, com um índice para controlar — e índice errado não dá erro, dá resultado trocado."},
 {t:"key",title:"No seu caso",html:"<p>É por isso que <code class=\"i\">log2(matriz_intensidades)</code> transforma as 290 proteínas × 12 amostras de uma vez só. Toda a etapa de transformação log2 do seu pipeline é literalmente uma linha — e é a mesma ideia que o DEP2 usa por baixo.</p>"},
 {t:"h",text:"Reciclagem: útil e traiçoeira"},
 {t:"p",html:"Quando os vetores têm tamanhos diferentes, o R <b>recicla</b> o menor. Com o menor de tamanho 1, é o que você quer (dividir tudo por um número). Com tamanhos que não são múltiplos, é bug silencioso."},
 {t:"code",cap:"Reciclagem",code:'c(10, 20, 30, 40) / 10        # útil: 1 2 3 4\nc(10, 20, 30, 40) - c(1, 2)   # recicla: 9 18 29 38\nc(10, 20, 30) - c(1, 2)       # aviso de comprimento não-múltiplo'},
 {t:"h",text:"Funções que resumem um vetor"},
 {t:"code",cap:"Estatísticas descritivas",code:'x <- c(11.05, 8.94, 10.20, 10.85, NA)\n\nmean(x)                  # NA  — qualquer NA contamina!\nmean(x, na.rm = TRUE)    # 10.26\nmedian(x, na.rm = TRUE)  # 10.525\nsd(x, na.rm = TRUE)      # 0.964\nrange(x, na.rm = TRUE)   # 8.94 11.05\nsummary(x)               # min, quartis, mediana, média, max, nº de NAs'},
 {t:"warn",title:"na.rm = TRUE",html:"<p>Guarde isso: em proteômica label-free você <b>sempre</b> tem missing value. Esquecer <code class=\"i\">na.rm = TRUE</code> devolve <code class=\"i\">NA</code> e você acha que o dado está corrompido quando só faltou o argumento.</p>"}
],
ex:[
 {type:"code", q:"Você tem <code>medianas</code>, um vetor com a mediana log2 de cada uma das 12 amostras (com alguns NA). Escreva o comando que calcula a mediana geral ignorando os NA.",
  ans:["median(medianas, na.rm = TRUE)","median(medianas,na.rm=T)","median(x = medianas, na.rm = TRUE)"],
  ph:"median(...)", why:"Esse valor é exatamente o alvo do median-centering: você desloca cada amostra até essa mediana comum.",
  hint:"<code>median()</code> mais o argumento que descarta NA."},
 {type:"mc", q:"<code>intensidades &gt; 1000</code>, onde <code>intensidades</code> tem 290 valores, devolve o quê?",
  opts:["Um único TRUE ou FALSE","Um vetor de 290 valores lógicos","Os valores maiores que 1000","Erro, falta um loop"],
  correct:1, why:"Vetorização: a comparação roda nos 290 elementos e devolve 290 lógicos. Combinado com <code>sum()</code>, isso conta quantas passaram."}
]},

{id:"1.3", min:"14", title:"Índices: pegar só o pedaço que interessa", goal:"Dominar os colchetes — a ferramenta que você usa para separar blocos de coluna do Progenesis e para filtrar contaminantes.",
blocks:[
 {t:"p",html:"Colchetes <code class=\"i\">[ ]</code> selecionam. Existem três formas de dizer o que você quer, e a terceira é a que muda a sua vida."},
 {t:"code",cap:"1) Por posição",code:'amostras <- c("ctrl_1", "3dias_2", "14dias_3", "28dias_4", "ctrl_5")\n\namostras[1]        # "ctrl_1"\namostras[c(1, 5)]  # "ctrl_1" "ctrl_5"\namostras[2:4]      # do 2 ao 4\namostras[-1]       # TUDO menos o primeiro'},
 {t:"code",cap:"2) Por nome",code:'medianas <- c(ctrl_1 = 11.05, ctrl_5 = 10.90, ctrl_9 = 8.94)\nmedianas["ctrl_9"]   # 8.94'},
 {t:"code",cap:"3) Por condição lógica — o mais importante",code:'medianas <- c(ctrl_1 = 11.05, ctrl_5 = 10.90, ctrl_9 = 8.94, d3_2 = 10.99)\n\nmedianas < 10\n# ctrl_1  ctrl_5  ctrl_9   d3_2\n#  FALSE   FALSE    TRUE  FALSE\n\nmedianas[medianas < 10]     # ctrl_9 = 8.94\nnames(medianas[medianas < 10])   # "ctrl_9"'},
 {t:"porque",
  existe:"Porque quase nunca você quer a tabela inteira: quer as proteínas significativas, as amostras de um grupo, as linhas que não são contaminante. O colchete é como se diz 'só este pedaço' — e a forma lógica permite descrever o pedaço por critério, não por posição.",
  faz:["Filtrar contaminantes e spike-in por accession","Separar os blocos de coluna do export do Progenesis","Achar a amostra fraca perguntando quais medianas são baixas","Selecionar as proteínas que passam em dois critérios ao mesmo tempo"],
  sem:"Você teria que saber de cor a posição de cada linha e coluna — e qualquer arquivo novo, com outra ordem, quebraria tudo em silêncio."},
 {t:"key",title:"No seu caso",html:"<p>É exatamente assim que você acha amostra suspeita sem olhar gráfico nenhum: calcula a mediana log2 de cada corrida e pergunta quais estão muito abaixo. Foi o que apontou a <code class=\"i\">ctrl_9</code> (8,94 contra ~11 das outras) no cerebelo.</p>"},
 {t:"h",text:"Os operadores de comparação"},
 {t:"table",head:["Operador","Lê-se"],rows:[
  ["<code>==</code>","igual a (dois sinais! um só é atribuição)"],
  ["<code>!=</code>","diferente de"],
  ["<code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>&lt;=</code>","maior, menor, maior ou igual, menor ou igual"],
  ["<code>&amp;</code>","E — as duas condições"],
  ["<code>|</code>","OU — pelo menos uma"],
  ["<code>!</code>","NÃO — inverte"],
  ["<code>%in%</code>","está contido em"]
 ]},
 {t:"code",cap:"Combinando condições",code:'p    <- c(0.001, 0.04, 0.20, 0.003)\ndiff <- c( 1.20, 0.30, 1.80, -0.90)\n\n# Significativa = p pequeno E efeito grande (log2(1.5) = 0.585)\nsig <- p < 0.05 & abs(diff) > 0.585\nsig\n# [1]  TRUE FALSE FALSE  TRUE\n\nsum(sig)   # 2 proteínas'},
 {t:"p",html:"Isso é, linha por linha, o que o <code class=\"i\">add_rejections(alpha = 0.05, lfc = 0.585)</code> faz no seu pipeline: uma condição <code class=\"i\">&amp;</code> outra."},
 {t:"h",text:"%in% e grepl: filtrar contaminantes"},
 {t:"code",cap:"Dois jeitos de filtrar por nome",code:'genes <- c("Alb", "ALB", "Krt1", "Eno1", "Gapdh", "P00924")\n\n# Lista exata\ngenes %in% c("Alb", "Krt1")\n# [1]  TRUE FALSE  TRUE FALSE FALSE FALSE\n\n# Por padrão de texto, ignorando maiúsculas\ngrepl("^alb|^krt", genes, ignore.case = TRUE)\n# [1]  TRUE  TRUE  TRUE FALSE FALSE FALSE\n\n# Manter o que NÃO é contaminante:\ngenes[!grepl("^alb|^krt", genes, ignore.case = TRUE)]\n# "Eno1" "Gapdh" "P00924"'},
 {t:"warn",title:"O ignore.case não é detalhe",html:"<p>No seu <code class=\"i\">qc_proteomica.R</code> as regex de contaminante usam <code class=\"i\">ignore.case = TRUE</code> justamente porque nomenclatura de camundongo/rato é capitalizada (<code class=\"i\">Alb</code>) e a humana é maiúscula (<code class=\"i\">ALB</code>). Sem isso, o filtro funciona num estudo e falha silenciosamente no outro.</p>"},
 {t:"key",title:"Cuidado real do seu projeto",html:"<p>Filtrar “enolase” por nome apagaria a <code class=\"i\">Eno1</code> endógena do rato (accessions A0A8I6ART9, A0ABK0LLI1), que é proteína de verdade. O spike-in de levedura é o <b>accession</b> <code class=\"i\">P00924</code>. Moral: filtre contaminante e spike-in por <b>accession</b>, não por nome de gene.</p>"}
],
ex:[
 {type:"code", q:"<code>acc</code> é o vetor de accessions da sua tabela. Escreva a condição lógica que marca as linhas que <b>não</b> são o spike-in de levedura P00924.",
  ans:["acc != \"P00924\"","!(acc == \"P00924\")","!acc %in% \"P00924\"","!(acc %in% \"P00924\")"],
  ph:'acc != ...', why:"Foi exatamente essa remoção que levou a medula de 262 para 261 proteínas.",
  hint:"Use <code>!=</code> comparando com o texto entre aspas."},
 {type:"code", q:"Do vetor <code>p_adj</code>, escreva o comando que devolve <b>só</b> os valores abaixo de 0.05.",
  ans:["p_adj[p_adj < 0.05]"], ph:"p_adj[...]",
  why:"O vetor lógico vai dentro do colchete. Para contar em vez de listar, seria <code>sum(p_adj &lt; 0.05, na.rm = TRUE)</code>.",
  hint:"Escreva a condição lógica dentro dos colchetes do próprio vetor."},
 {type:"mc", q:"Qual comando conta quantas proteínas são significativas com q &lt; 0.05 <b>e</b> |log2FC| &gt; 0.585?",
  opts:["<code>sum(q &lt; 0.05 | abs(fc) &gt; 0.585)</code>","<code>sum(q &lt; 0.05 &amp; abs(fc) &gt; 0.585, na.rm = TRUE)</code>","<code>length(q &lt; 0.05 &amp; fc &gt; 0.585)</code>","<code>count(q, fc)</code>"],
  correct:1, why:"<code>&amp;</code> porque as duas condições têm de valer; <code>abs()</code> porque conta subida e descida; <code>na.rm</code> porque sempre há NA. <code>length()</code> daria o total de linhas, não o de TRUEs."}
]},

{id:"1.4", min:"11", title:"NA: o valor que domina tudo", goal:"Tratar missing value como dado, não como erro — a diferença entre MAR e MNAR começa aqui.",
blocks:[
 {t:"p",html:"<code class=\"i\">NA</code> significa “não sei”. Qualquer conta com um “não sei” dá “não sei”. Isso é coerente, mas pega todo mundo de surpresa."},
 {t:"code",cap:"NA contamina",code:'x <- c(11.05, NA, 10.20)\n\nx + 1        # 12.05    NA 11.20\nmean(x)      # NA\nmean(x, na.rm = TRUE)   # 10.625\n\n# E o mais traiçoeiro:\nNA == NA     # NA  (não é TRUE!)\nis.na(NA)    # TRUE  <- é assim que se testa'},
 {t:"warn",title:"Nunca use == para testar NA",html:"<p><code class=\"i\">x == NA</code> devolve <code class=\"i\">NA</code>, não <code class=\"i\">TRUE</code>. Sempre <code class=\"i\">is.na(x)</code>.</p>"},
 {t:"h",text:"Contando missing values"},
 {t:"code",cap:"O diagnóstico básico",code:'# Numa matriz proteínas x amostras:\nsum(is.na(mat))                    # total de buracos\nmean(is.na(mat)) * 100             # % de missing\n\n# Por proteína (linha):\nna_prot <- rowSums(is.na(mat))\n\n# Por amostra (coluna):\nna_amostra <- colSums(is.na(mat))\nsort(na_amostra, decreasing = TRUE)[1:3]   # as 3 piores amostras\n\n# Proteínas completas em todas as amostras:\nsum(na_prot == 0)'},
 {t:"porque",
  existe:"Porque 'não medido' é diferente de 'zero'. Se o R tratasse ausência como zero, uma proteína não detectada puxaria a média para baixo como se tivesse abundância nula — e em proteômica isso é a regra, não a exceção.",
  faz:["Quantificar o tamanho real do problema de cobertura do seu experimento","Montar filtro por grupo em vez de global","Distinguir MAR de MNAR e escolher a imputação certa","Calcular médias e medianas honestas com <code>na.rm = TRUE</code>"],
  sem:"Você não teria como diferenciar uma proteína ausente de uma proteína com abundância zero — e imputaria valor em cima do que deveria ser reportado como ausência biológica."},
 {t:"key",title:"No seu caso",html:"<p>Foi essa conta que quantificou o problema real do projeto do pâncreas: união de 7.440 grupos, mas só <b>65</b> presentes nas 24 corridas e 4.682 em uma única. E é ela que sustenta o filtro “≥70% de valores válidos por grupo” que você quer implementar.</p>"},
 {t:"h",text:"MAR vs MNAR — por que importa"},
 {t:"table",head:["","MAR / MCAR","MNAR"],rows:[
  ["Significado","Faltou por acaso (proteína existe, o instrumento não pegou naquela corrida)","Faltou porque está abaixo do limite de detecção"],
  ["Padrão nos dados","Buracos espalhados, sem relação com intensidade","Concentrados nas proteínas de baixa intensidade e num grupo só"],
  ["Imputação certa","<code>knn</code>, <code>MLE</code> — estima pelos vizinhos","<code>MinProb</code>, <code>man</code> — põe valor baixo"]
 ]},
 {t:"p",html:"Imputar MNAR com knn <b>inventa</b> abundância para proteína que não existe naquele grupo e cria diferencial falso. Imputar MAR com MinProb enterra proteína real. É por isso que o painel de diagnóstico MAR/MNAR está no seu <code class=\"i\">qc_proteomica.R</code>: a decisão de imputação depende dele."},
 {t:"note",title:"Observação sobre o DEP2",html:"<p><code class=\"i\">plot_missval()</code> só desenha proteínas com pelo menos um NA. No cerebelo eram só três (Slc25a22, Cox4i1, Dmc1, todas faltando na ctrl_9) — o gráfico parecer vazio ali não era bug, era o dado ser quase completo.</p>"}
],
ex:[
 {type:"code", q:"Escreva o comando que devolve, para cada proteína (linha) da matriz <code>mat</code>, quantas amostras têm valor faltante.",
  ans:["rowSums(is.na(mat))"], ph:"rowSums(...)",
  why:"Com isso você monta o filtro: <code>mat[rowSums(is.na(mat)) &lt;= 3, ]</code> mantém proteínas com no máximo 3 buracos.",
  hint:"Combine <code>rowSums()</code> com <code>is.na()</code>."},
 {type:"mc", q:"Uma proteína tem valor nas 6 amostras do grupo tratado e NA nas 6 do controle. O que isso mais provavelmente é, e como imputar?",
  opts:["MAR — imputar com knn","MNAR — imputar com MinProb (ou não imputar e tratar como presença/ausência)","Erro de leitura do arquivo","Contaminante"],
  correct:1, why:"Missing concentrado num grupo inteiro é a assinatura de MNAR: a proteína provavelmente está abaixo do limite de detecção no controle. Imputar com knn aqui inventaria um valor médio e mataria um achado real."}
]},

{id:"1.5", min:"12", title:"Funções: argumentos, defaults e a ajuda", goal:"Ler a documentação de qualquer função sozinho — inclusive as do DEP2 e do protti.",
blocks:[
 {t:"p",html:"Função é uma máquina: entra argumento, sai resultado. Toda a sua análise é encadeamento de funções."},
 {t:"code",cap:"Anatomia de uma chamada",code:'round(x = 10.5673, digits = 2)\n# nome    argumento 1   argumento 2\n\nround(10.5673, 2)          # por posição — mesma coisa\nround(digits = 2, x = 10.5673)   # nomeado: a ordem não importa'},
 {t:"h",text:"Defaults"},
 {t:"p",html:"Muitos argumentos têm valor padrão. <code class=\"i\">round(10.5673)</code> devolve <code class=\"i\">11</code> porque <code class=\"i\">digits</code> vale 0 por padrão. <b>Os defaults são a maior fonte de resultado inesperado</b> — e a razão de ler a documentação."},
 {t:"h",text:"Como ler a ajuda"},
 {t:"code",cap:"Ajuda",code:'?median          # abre a documentação no painel Help\nhelp(median)     # idem\nargs(median)     # só a assinatura\nexample(median)  # roda os exemplos\n\n?DEP2::test_diff   # ajuda de função de um pacote específico'},
 {t:"p",html:"A página de ajuda tem sempre a mesma estrutura. Vá direto para três seções: <b>Usage</b> (a assinatura com os defaults), <b>Arguments</b> (o que cada um faz) e <b>Examples</b> (no fim — geralmente é o mais útil)."},
 {t:"porque",
  existe:"Porque toda função tem escolhas embutidas que alguém tomou por você — qual método de FDR, o que fazer com NA, quantas casas arredondar. A documentação é onde essas escolhas estão escritas. Ela existe para você não depender de exemplo achado na internet.",
  faz:["Descobrir quais valores <code>fdr.type</code> aceita, sem perguntar a ninguém","Ver o default de um argumento e decidir se ele serve para o seu caso","Entender por que a mesma função se comporta diferente em outra versão","Achar a função certa por assunto com <code>??palavra</code>"],
  sem:"Você usaria os defaults sem saber que existem — e foi exatamente um default (o método de FDR) que quase te fez reportar 30 proteínas em vez de 8."},
 {t:"key",title:"No seu caso",html:"<p>Isso é o que responde perguntas como “quais valores <code class=\"i\">fdr.type</code> aceita?”. A resposta — <code class=\"i\">\"Strimmer's qvalue(t)\"</code>, <code class=\"i\">\"Strimmer's qvalue(p)\"</code>, <code class=\"i\">\"BH\"</code>, <code class=\"i\">\"Storey's qvalue\"</code> — está na página de ajuda do <code class=\"i\">test_diff</code>. E foi trocar de Strimmer para BH que fez os 30 “significativos” do cerebelo virarem 8 confiáveis.</p>"},
 {t:"h",text:"Pacotes: os três lugares de onde eles vêm"},
 {t:"code",cap:"Instalação por origem",code:'# CRAN — a maioria (tidyverse, data.table, ggplot2)\ninstall.packages("dplyr")\n\n# Bioconductor — as de bioinformática (limma, vsn, SummarizedExperiment)\ninstall.packages("BiocManager")\nBiocManager::install("limma")\n\n# GitHub — DEP2 mora aqui\ninstall.packages("remotes")\nremotes::install_github("mildpiggy/DEP2")\n\n# Instalar é uma vez. Carregar é toda sessão:\nlibrary(dplyr)'},
 {t:"h",text:"O operador :: e por que você já usa"},
 {t:"code",cap:"Chamada explícita",code:'DEP2::impute(se, fun = "MinProb")   # sem dúvida de qual impute()\nimpute(se, fun = "MinProb")         # qual pacote responde? depende da ordem dos library()'},
 {t:"warn",title:"Este é um problema real seu",html:"<p><code class=\"i\">MSnbase</code>, <code class=\"i\">QFeatures</code> e <code class=\"i\">MsCoreUtils</code> também definem <code class=\"i\">impute()</code>. Se algum for carregado <b>depois</b> do DEP2, ele captura a chamada e o erro é <i>“Please specify an imputation method”</i> — que não parece um conflito de pacote. Por isso todas as chamadas do seu <code class=\"i\">qc_proteomica.R</code> usam <code class=\"i\">DEP2::</code> explícito. Não é preciosismo, é defesa.</p>"},
 {t:"code",cap:"Diagnosticando conflito",code:'library(MSnbase)\nlibrary(DEP2)\n\nconflicts(detail = TRUE)   # lista o que foi mascarado\nfind("impute")             # mostra TODOS os pacotes que definem impute()\nsessionInfo()              # versões e ordem de carregamento'}
],
ex:[
 {type:"mc", q:"Você roda <code>impute(se, fun = \"MinProb\")</code> e recebe <i>“Please specify an imputation method”</i>. Qual é a causa mais provável?",
  opts:["O objeto <code>se</code> não tem NA","Outro pacote carregado depois do DEP2 está capturando <code>impute()</code>","<code>MinProb</code> não é um método válido","Falta instalar o vsn"],
  correct:1, why:"A mensagem vem de outro <code>impute()</code>, que não reconhece o argumento <code>fun</code>. A blindagem é <code>DEP2::impute()</code>, ou rodar em sessão limpa via Rscript."},
 {type:"code", q:"Escreva o comando que abre a documentação da função <code>test_diff</code> do pacote DEP2.",
  ans:["?DEP2::test_diff","help(test_diff, package = \"DEP2\")","?test_diff"], ph:"?...",
  why:"Vá direto em Usage e Arguments para ver os defaults.", hint:"Ponto de interrogação, e você pode qualificar com <code>pacote::</code>."},
 {type:"do", q:"Faça agora, na sua máquina:", q2:"Rodei <code>find(\"impute\")</code> e <code>sessionInfo()</code> numa sessão com os meus pacotes carregados e vi quais definem <code>impute()</code>."}
]}
]});

TRILHA.push({n:"2", title:"Estruturas de dados = os seus arquivos", lessons:[

{id:"2.1", min:"14", title:"data.frame, tibble e matrix", goal:"Saber qual estrutura usar quando — e por que o DEP2 exige matriz numérica.",
blocks:[
 {t:"p",html:"Três estruturas retangulares, com regras diferentes. Confundi-las é a origem de metade dos erros de pipeline."},
 {t:"table",head:["","O que aceita","Onde você usa"],rows:[
  ["<code>matrix</code>","<b>Um tipo só</b> — normalmente tudo numérico","A matriz de intensidades. É o que limma e vsn exigem."],
  ["<code>data.frame</code>","Colunas de tipos diferentes","A tabela lida do Progenesis: accession (texto) + abundâncias (número)"],
  ["<code>tibble</code>","Igual ao data.frame, com melhor comportamento","O padrão do tidyverse e do protti"]
 ]},
 {t:"code",cap:"Criando e inspecionando",code:'df <- data.frame(\n  accession = c("Q8R5L1", "P62259", "P00924"),\n  gene      = c("Slc25a22", "Ywhae", "ENO1_YEAST"),\n  ctrl_1    = c(1520.3, 8830.2, 45210.0),\n  ctrl_5    = c(1490.7, 9010.5, 44980.1)\n)\n\ndim(df)      # 3 linhas, 4 colunas\nnrow(df)     # 3\nncol(df)     # 4\nnames(df)    # nomes das colunas\nstr(df)      # tipos de cada coluna  <- use SEMPRE\nhead(df, 3)  # primeiras linhas'},
 {t:"h",text:"Selecionando: linha e coluna"},
 {t:"code",cap:"O colchete de dois argumentos",code:'df[1, ]        # linha 1, todas as colunas\ndf[, 2]        # coluna 2, todas as linhas\ndf[1, 2]       # linha 1, coluna 2\ndf[, "gene"]   # coluna por nome\ndf$gene        # o mesmo, forma mais comum\n\ndf[df$gene == "Slc25a22", ]        # linhas que atendem à condição\ndf[, c("accession", "ctrl_1")]     # só essas duas colunas'},
 {t:"warn",title:"A vírgula",html:"<p><code class=\"i\">df[1, ]</code> é linha. <code class=\"i\">df[, 1]</code> é coluna. Esquecer a vírgula em <code class=\"i\">df[1]</code> devolve a primeira <b>coluna</b> como data.frame — quase nunca o que você queria.</p>"},
 {t:"h",text:"Por que o DEP2 e o limma querem matriz"},
 {t:"p",html:"Álgebra matricial não roda com coluna de texto no meio. Por isso o passo obrigatório é separar <b>anotação</b> (accession, gene, descrição) de <b>dados</b> (abundâncias) e converter só a parte numérica."},
 {t:"code",cap:"Do data.frame para a matriz",code:'# Colunas 3 e 4 são as amostras\nmat <- as.matrix(df[, 3:4])\nrownames(mat) <- df$accession\n\nclass(mat)   # "matrix" "array"\nmat\n#            ctrl_1  ctrl_5\n# Q8R5L1     1520.3  1490.7\n# P62259     8830.2  9010.5\n# P00924    45210.0 44980.1\n\nlog2(mat)    # agora a conta funciona na tabela inteira'},
 {t:"warn",title:"Se sobrar uma coluna de texto",html:"<p><code class=\"i\">as.matrix()</code> não dá erro: ele converte <b>tudo</b> para texto silenciosamente. Aí <code class=\"i\">log2(mat)</code> falha com <i>non-numeric argument</i>. Confira sempre com <code class=\"i\">class(mat[1,1])</code> ou <code class=\"i\">typeof(mat)</code> depois de converter.</p>"},
 {t:"h",text:"tibble: as diferenças que importam"},
 {t:"list",items:[
  "Imprime só as 10 primeiras linhas e mostra o tipo de cada coluna — não inunda o console.",
  "Nunca converte texto em factor automaticamente.",
  "<code class=\"i\">tb[, 1]</code> devolve um tibble; <code class=\"i\">df[, 1]</code> devolve um vetor. Essa diferença sutil quebra código.",
  "Aceita nomes de coluna com espaço, como <code class=\"i\">`Normalized abundance`</code> — muito relevante para o export do Progenesis."
 ]},
 {t:"code",cap:"Conversões",code:'tb <- tibble::as_tibble(df)\ndf2 <- as.data.frame(tb)\n\n# Matriz -> data.frame preservando os nomes de linha numa coluna:\ndf3 <- tibble::rownames_to_column(as.data.frame(mat), "accession")'}
],
ex:[
 {type:"mc", q:"<code>log2(mat)</code> devolve <i>“non-numeric argument to binary operator”</i>. O que aconteceu?",
  opts:["Há valores negativos na matriz","Alguma coluna de texto entrou na conversão e a matriz virou character","Há NA na matriz","A matriz é grande demais"],
  correct:1, why:"<code>as.matrix()</code> força um único tipo. Uma coluna de texto puxa tudo para character, sem erro nenhum na hora. Valores negativos dariam NaN com aviso, e NA passaria adiante como NA."},
 {type:"code", q:"<code>prog</code> é o data.frame lido do Progenesis; as colunas 5 a 16 são as amostras. Escreva o comando que cria a matriz numérica dessas colunas.",
